name: Apply M4-03 Coverage Fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  coverage-fix:
    if: github.head_ref == 'tooling/m403-closeout-hold'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout formal M4-03 branch
        uses: actions/checkout@v6
        with:
          ref: work/m4-03-provider-credential-connection
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and configure baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0299594c0a72eebe87f5452a2fcb8dd7aa38c498"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Load coverage fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin tooling/m403-closeout-hold
          git show origin/tooling/m403-closeout-hold:.github/tooling/m403-coverage-fix.py > "${RUNNER_TEMP}/m403-coverage-fix.py"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format, test coverage and push
        shell: bash
        run: |
          set +e
          python "${RUNNER_TEMP}/m403-coverage-fix.py" > "${RUNNER_TEMP}/m403-coverage-fix.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/m403-coverage-fix.log"
          exit "${status}"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: m403-coverage-fix-diagnostics
          path: ${{ runner.temp }}/m403-coverage-fix.log
          if-no-files-found: error
          retention-days: 7
