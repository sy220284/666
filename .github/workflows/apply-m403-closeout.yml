name: Apply M4-03 Closeout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'tooling/m403-closeout'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout formal M4-03 branch
        uses: actions/checkout@v6
        with:
          ref: work/m4-03-provider-credential-connection
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and configure baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "379b8518b9c2b753dd4e22392c4221be648ffb4b"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Load closeout script
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin tooling/m403-closeout
          git show origin/tooling/m403-closeout:.github/tooling/m403-closeout.py > "${RUNNER_TEMP}/m403-closeout.py"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full closeout and push governance
        shell: bash
        run: |
          set +e
          python "${RUNNER_TEMP}/m403-closeout.py" > "${RUNNER_TEMP}/m403-closeout.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/m403-closeout.log"
          exit "${status}"

      - name: Upload closeout diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: m403-closeout-diagnostics
          path: ${{ runner.temp }}/m403-closeout.log
          if-no-files-found: error
          retention-days: 7
