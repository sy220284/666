name: Apply M4-03 Final Hardening

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'tooling/m403-final-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout formal M4-03 branch
        uses: actions/checkout@v6
        with:
          ref: work/m4-03-provider-credential-connection
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and configure baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "506e4a6bfaa13fd7c0ddc3b99b46d774654625e6"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Load final hardening script
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin tooling/m403-final-hardening
          git show origin/tooling/m403-final-hardening:.github/tooling/m403-final-hardening.py > "${RUNNER_TEMP}/m403-final-hardening.py"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply and verify final hardening
        shell: bash
        run: |
          set +e
          python "${RUNNER_TEMP}/m403-final-hardening.py" > "${RUNNER_TEMP}/m403-final-hardening.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/m403-final-hardening.log"
          exit "${status}"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: m403-final-hardening-diagnostics
          path: ${{ runner.temp }}/m403-final-hardening.log
          if-no-files-found: error
          retention-days: 7
