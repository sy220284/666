name: Apply unsigned release policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [governance]
    paths:
      - .github/workflows/apply-unsigned-release-policy.yml
      - scripts/apply-unsigned-release-policy-v2.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'governance')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: governance
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Apply policy patch
        run: python3 scripts/apply-unsigned-release-policy-v2.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format and validate policy change
        run: |
          pnpm exec prettier --write \
            .github/workflows/release.yml \
            scripts/release-acceptance.mjs \
            scripts/package-desktop.mjs \
            scripts/verify-package-assets.mjs \
            scripts/release-tool.mjs \
            tests/unit/release-tool.test.ts \
            tests/unit/package-desktop.test.ts \
            docs/process/RELEASE_QUALIFICATION.md \
            docs/product/SELF_USE_RELEASE_POLICY.md
          pnpm exec vitest run tests/unit/release-tool.test.ts tests/unit/package-desktop.test.ts
          node scripts/documentation-consistency.mjs
          pnpm release:check
          git diff --check
      - name: Commit final governance change
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-unsigned-release-policy.yml \
            scripts/apply-unsigned-release-policy.py \
            scripts/apply-unsigned-release-policy-v2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No release policy changes were produced.' >&2
            exit 1
          fi
          git commit -m '治理：取消正式发布签名门禁'
          git push origin HEAD:governance
