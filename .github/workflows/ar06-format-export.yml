name: AR-06 Format Export

on:
  pull_request:
    paths:
      - 'apps/desktop/renderer/src/features/planning/planning-form-values.ts'
      - 'tests/unit/ar06-planning-boundaries.test.ts'
      - '.github/workflows/ar06-format-export.yml'

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec prettier apps/desktop/renderer/src/features/planning/planning-form-values.ts tests/unit/ar06-planning-boundaries.test.ts --write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ar06-prettier-output
          path: |
            apps/desktop/renderer/src/features/planning/planning-form-values.ts
            tests/unit/ar06-planning-boundaries.test.ts
          if-no-files-found: error
          retention-days: 1
