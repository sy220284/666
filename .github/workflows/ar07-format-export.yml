name: AR07 Format Export

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format AR-07 files
        run: |
          pnpm exec prettier --write \
            apps/desktop/renderer/src/app/app-shell-m3.tsx \
            apps/desktop/renderer/src/app/app-shell-layout.tsx \
            apps/desktop/renderer/src/app/app-shell-pages.tsx \
            apps/desktop/renderer/src/app/app-shell-status.ts \
            apps/desktop/renderer/src/app/app-shell-helpers.ts \
            apps/desktop/renderer/src/app/use-app-settings-persistence.ts \
            apps/desktop/renderer/src/app/use-app-shell-actions.ts \
            apps/desktop/renderer/src/app/use-app-shell-navigation.ts \
            apps/desktop/renderer/src/app/use-project-session-controller.ts \
            apps/desktop/renderer/src/app/use-workspace-runtime.ts \
            apps/desktop/renderer/src/app/use-workspace-startup.ts \
            tests/unit/ar07-app-shell-boundaries.test.ts \
            tests/unit/app-shell-capability-actions.test.ts \
            tests/unit/m8-09-v1-stability-invariants.test.ts \
            tests/unit/renderer-react-runtime-root.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar07-prettier-output
          path: |
            apps/desktop/renderer/src/app/app-shell-m3.tsx
            apps/desktop/renderer/src/app/app-shell-layout.tsx
            apps/desktop/renderer/src/app/app-shell-pages.tsx
            apps/desktop/renderer/src/app/app-shell-status.ts
            apps/desktop/renderer/src/app/app-shell-helpers.ts
            apps/desktop/renderer/src/app/use-app-settings-persistence.ts
            apps/desktop/renderer/src/app/use-app-shell-actions.ts
            apps/desktop/renderer/src/app/use-app-shell-navigation.ts
            apps/desktop/renderer/src/app/use-project-session-controller.ts
            apps/desktop/renderer/src/app/use-workspace-runtime.ts
            apps/desktop/renderer/src/app/use-workspace-startup.ts
            tests/unit/ar07-app-shell-boundaries.test.ts
            tests/unit/app-shell-capability-actions.test.ts
            tests/unit/m8-09-v1-stability-invariants.test.ts
            tests/unit/renderer-react-runtime-root.test.ts
          retention-days: 1
