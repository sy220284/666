name: AR08 Contracts Apply

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Detect completed application
        id: detect
        run: |
          if [[ -f packages/contracts/src/protocol-registry.ts ]]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.detect.outputs.apply == 'true'
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.detect.outputs.apply == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Apply generated Contracts split
        if: steps.detect.outputs.apply == 'true'
        run: |
          cat > /tmp/ar08-payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/ar08-payload.b64 > /tmp/ar08-payload.tar.gz
          tar -xzf /tmp/ar08-payload.tar.gz -C "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: steps.detect.outputs.apply == 'true'
      - name: Format generated files
        if: steps.detect.outputs.apply == 'true'
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/index.ts \
            packages/contracts/src/protocol-registry.ts \
            packages/contracts/src/app-runtime-contracts.ts \
            packages/contracts/src/worldforge-bridge.ts \
            tests/unit/ar08-contracts-public-surface.test.ts \
            tests/fixtures/contracts-public-runtime-baseline.json
      - name: Validate Contracts split
        if: steps.detect.outputs.apply == 'true'
        run: |
          pnpm --filter @worldforge/contracts typecheck
          pnpm exec vitest run tests/unit/ar08-contracts-public-surface.test.ts
      - name: Commit generated split
        if: steps.detect.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/index.ts \
            packages/contracts/src/protocol-registry.ts \
            packages/contracts/src/app-runtime-contracts.ts \
            packages/contracts/src/worldforge-bridge.ts \
            tests/unit/ar08-contracts-public-surface.test.ts \
            tests/fixtures/contracts-public-runtime-baseline.json
          git commit -m "refactor(contracts): 拆分公开协议与Bridge聚合 [ar08-apply]"
          git push origin HEAD:${{ github.head_ref }}
