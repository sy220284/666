name: Controlled Merge

on:
  workflow_run:
    workflows:
      - Quality
      - Security
      - Performance
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  automerge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
      - name: Wait for previous main verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/governance/automerge-base-gate.mjs
      - name: Aggregate engineering checks, merge eligible pull request and schedule final main verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/automerge.mjs
