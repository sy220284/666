name: Branch Hygiene

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  branch-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
      - name: Self-test branch inventory policy
        run: node .github/governance/branch-inventory-policy.mjs self-test
      - name: Repair and enforce exact main/work branch inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_INVENTORY_OUTPUT: artifacts/branch-hygiene
        run: node .github/governance/branch-inventory-policy.mjs --repair
      - name: Upload branch report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: branch-hygiene-report-${{ github.run_id }}
          path: artifacts/branch-hygiene/
          if-no-files-found: error
          retention-days: 30
