name: Branch Hygiene

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  branch-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Self-test branch inventory policy
        run: node .github/governance/branch-inventory-policy.mjs self-test
      - name: Enforce exact main and work branch inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_INVENTORY_OUTPUT: artifacts/branch-hygiene
        run: node .github/governance/branch-inventory-policy.mjs
      - name: Upload branch report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: branch-hygiene-report-${{ github.run_id }}
          path: artifacts/branch-hygiene/
          if-no-files-found: error
          retention-days: 30
