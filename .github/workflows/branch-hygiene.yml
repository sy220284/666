name: Branch Hygiene

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only branches already classified as safe obsolete
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  branch-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Classify branches and optionally delete obsolete branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_HYGIENE_OUTPUT: artifacts/branch-hygiene
          BRANCH_HYGIENE_APPLY: ${{ inputs.apply == true }}
        run: node scripts/branch-hygiene.mjs
      - name: Upload branch report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: branch-hygiene-report
          path: artifacts/branch-hygiene/
          if-no-files-found: error
          retention-days: 30
