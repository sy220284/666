name: CI Policy Diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/ci-policy-diagnostics.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Synchronize legacy PR policy assertion
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'scripts/ci-policy.mjs';
          const source = await readFile(file, 'utf8');
          const before = "    'scripts/ci-policy.mjs',\n";
          const after = "    'pnpm ci:policy',\n";
          if (!source.includes(before)) throw new Error('Legacy PR policy assertion was not found');
          await writeFile(file, source.replace(before, after), 'utf8');
          NODE
          node --check scripts/ci-policy.mjs
      - name: Commit synchronized ordinary policy file
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ci-policy.mjs
          git diff --cached --check
          git commit -m 'fix(ci): synchronize parsed policy entrypoint'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$HEAD_REF"
