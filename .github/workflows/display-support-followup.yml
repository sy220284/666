name: Display Support Follow-up

on:
  push:
    branches: [work]

permissions:
  contents: write

concurrency:
  group: display-support-follow-up
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
      - name: Apply current-authority display follow-up
        run: python3 scripts/display-support-followup.py
      - name: Remove helpers and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/display-support-followup.yml scripts/display-support-followup.py
          git add apps/desktop/main/src/window-state.ts tests/unit/electron-window-state-coverage.test.ts docs/ui/DISPLAY_SUPPORT_MAINTENANCE.md docs/product/V1_SCOPE_AND_ACCEPTANCE.md docs/product/FUNCTION_CATALOG.md docs/product/V1.0_TRACEABILITY_MATRIX.md docs/testing/P0_ACCEPTANCE_MATRIX.md docs/ui/UI_SYSTEM.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(display): align current QHD support authorities'
          git push origin HEAD:work
