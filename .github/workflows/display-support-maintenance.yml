              '- 1280×800 100%。\n- 2560×1440 100/125/150%。\n- 3440×1440和3840×1600。\n- 混合DPI双显示器。\n- 1024×640有效视口降级检查。',
              '- 2560×1440 100/125/150/200%。\n- 2560×1600 100%或系统推荐缩放。\n- 3440×1440和3840×2160。\n- 混合DPI双显示器。\n- 窄CSS/DIP有效视口只验证高DPI与窗口缩放降级，不计入正式物理显示支持。',
          )

          # Planned M12-03 must inherit current display authority rather than reintroduce FHD/1280.
          replace_once('docs/tasks/M12/M12-03_AUTHOR_PRODUCTIVITY_PERSONALIZATION.md', '6. 正式平台体验矩阵使用 FHD / QHD / 4K；1280×800 验证 graceful degradation，不要求强塞三栏。', '6. 正式平台体验矩阵使用 QHD / QHD+ / UWQHD / 4K；窗口或高DPI导致的窄有效CSS视口允许降级为双栏/单栏，不把FHD及以下恢复为正式支持。')
          replace_once('docs/tasks/M12/M12-03_AUTHOR_PRODUCTIVITY_PERSONALIZATION.md', '- FHD / QHD / 4K 正式体验矩阵。', '- QHD / QHD+ / UWQHD / 4K 正式体验矩阵。')
          replace_once('docs/tasks/M12/M12-03_AUTHOR_PRODUCTIVITY_PERSONALIZATION.md', '- 1280×800 双栏/单栏降级专项。', '- 高DPI/窄窗口有效CSS视口的双栏/单栏降级专项（非低分辨率硬件支持）。')

          # Guard: no formal machine authority may still require FHD/1280.
          forbidden = {
              'docs/process/PLATFORM_EXPERIENCE_MATRIX.json': ['mainstream-fhd', '1920'],
              'tests/e2e/platform-experience.spec.ts': ['mainstream-fhd', '1920, height: 1080'],
              'tests/e2e/visual-regression.spec.ts': ['1280x800.png', '1280×800四主题视觉基线'],
              'scripts/governance-self-check.mjs': ['mainstream-fhd', '1920x1080, 2560x1440'],
          }
          for path, needles in forbidden.items():
              source = read(path)
              for needle in needles:
                  if needle in source:
                      raise SystemExit(f'{path}: retired display authority remains: {needle}')
          PY

      - name: Remove maintenance workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/display-support-maintenance.yml
          git add \
            apps/desktop/main/src/window-state.ts \
            docs/process/PLATFORM_EXPERIENCE_MATRIX.json \
            docs/tasks/M12/M12-03_AUTHOR_PRODUCTIVITY_PERSONALIZATION.md \
            docs/testing/PERFORMANCE_BUDGETS.md \
            docs/testing/TEST_STRATEGY.md \
            docs/ui/DISPLAY_SUPPORT_MAINTENANCE.md \
            docs/ui/README.md \
            docs/ui/RESPONSIVE_AND_DPI.md \
            docs/ui/UI_ACCEPTANCE_CHECKLIST.md \
            docs/ui/VISUAL_REFERENCE_BASELINE.md \
            scripts/governance-self-check.mjs \
            tests/e2e/electron-shell.spec.ts \
            tests/e2e/platform-experience.spec.ts \
            tests/e2e/visual-regression.spec.ts \
            tests/performance/display-layout.test.ts \
            tests/unit/electron-window-state-coverage.test.ts \
            tests/unit/quality-system-v2.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(display): adopt QHD-first support matrix'
          git push origin HEAD:work
