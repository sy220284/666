name: Display Support Maintenance

on:
  push:
    branches: [work]

permissions:
  contents: write

concurrency:
  group: display-support-maintenance
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
      - name: Apply QHD-first display support policy
        run: python3 scripts/display-support-maintenance.py
      - name: Remove maintenance helpers and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/display-support-maintenance.yml scripts/display-support-maintenance.py
          git add apps/desktop/main/src/window-state.ts docs/process/PLATFORM_EXPERIENCE_MATRIX.json docs/tasks/M12/M12-03_AUTHOR_PRODUCTIVITY_PERSONALIZATION.md docs/testing/PERFORMANCE_BUDGETS.md docs/testing/TEST_STRATEGY.md docs/ui/DISPLAY_SUPPORT_MAINTENANCE.md docs/ui/README.md docs/ui/RESPONSIVE_AND_DPI.md docs/ui/UI_ACCEPTANCE_CHECKLIST.md docs/ui/VISUAL_REFERENCE_BASELINE.md scripts/governance-self-check.mjs tests/e2e/electron-shell.spec.ts tests/e2e/platform-experience.spec.ts tests/e2e/visual-regression.spec.ts tests/performance/display-layout.test.ts tests/unit/electron-window-state-coverage.test.ts tests/unit/quality-system-v2.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(display): adopt QHD-first support matrix'
          git push origin HEAD:work
