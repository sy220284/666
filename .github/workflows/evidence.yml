name: Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  statuses: read

concurrency:
  group: evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence:
    name: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_FINAL: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && contains(github.event.pull_request.body, '<!-- worldforge-task:') }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Assert clean working tree before evidence validation
        run: node .github/governance/assert-clean-tree.mjs
      - name: Validate changed task evidence documents
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/evidence-policy.mjs
      - name: Validate all effectively Verified task evidence documents
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          node scripts/verified-evidence-scan.mjs 2>&1 | tee test-results/ci/verified-evidence-scan.log
      - name: Upload full-scan diagnostics
        if: ${{ failure() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-evidence-scan-${{ github.run_id }}
          path: test-results/ci/verified-evidence-scan.log
          if-no-files-found: error
          retention-days: 7
      - name: Assert clean working tree after evidence validation
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
