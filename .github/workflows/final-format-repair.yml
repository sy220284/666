name: Final Format Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/final-format-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format final tooling and regression files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/desktop/renderer/src/features/writing/writing-workbench.tsx \
            scripts/check-boundaries.mjs \
            scripts/check-workspaces.mjs \
            scripts/verify-package-assets.mjs \
            scripts/workflow-structure-policy.mjs \
            tests/unit/boundaries.test.ts \
            tests/unit/renderer-m3-09-workbenches.test.ts \
            tests/unit/scan-secrets.test.ts \
            tests/unit/workflow-structure-policy.test.ts
      - name: Validate formatting and affected regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm exec vitest run \
            tests/unit/boundaries.test.ts \
            tests/unit/renderer-m3-09-workbenches.test.ts \
            tests/security/renderer-react-boundary.test.ts \
            tests/unit/workflow-structure-policy.test.ts \
            tests/unit/tooling-hardening.test.ts \
            tests/unit/scan-secrets.test.ts
          pnpm lint
          pnpm typecheck
      - name: Commit validated ordinary files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/desktop/renderer/src/features/writing/writing-workbench.tsx \
            scripts/check-boundaries.mjs \
            scripts/check-workspaces.mjs \
            scripts/verify-package-assets.mjs \
            scripts/workflow-structure-policy.mjs \
            tests/unit/boundaries.test.ts \
            tests/unit/renderer-m3-09-workbenches.test.ts \
            tests/unit/scan-secrets.test.ts \
            tests/unit/workflow-structure-policy.test.ts
          git diff --cached --check
          git commit -m 'fix(tooling): format audit hardening and update regressions'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$HEAD_REF"
