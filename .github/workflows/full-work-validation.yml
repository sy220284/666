name: Full Work Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or exact commit SHA to validate
        required: true
        type: string
        default: work
      package_smoke:
        description: Run Linux, Windows and macOS package smoke tests
        required: true
        type: boolean
        default: true
      windows_ime:
        description: Run the real Windows Microsoft Pinyin acceptance test
        required: true
        type: boolean
        default: true
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/full-work-validation.yml'

permissions:
  contents: read

concurrency:
  group: full-work-validation-${{ github.event.pull_request.head.sha || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  governance:
    name: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || 'work' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean validation checkout
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Resolve validation commit identities
        id: validation
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          base_sha="${PULL_REQUEST_BASE_SHA:-$head_sha}"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Audit permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Validate Schema 2 task authorization
        run: pnpm task:validate
      - name: Validate workflow and CI policies
        run: pnpm ci:policy
      - name: Validate changed task evidence documents
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EVIDENCE_BASE_SHA: ${{ steps.validation.outputs.base_sha }}
          EVIDENCE_HEAD_SHA: ${{ steps.validation.outputs.head_sha }}
        run: node scripts/evidence-policy.mjs
      - name: Validate all Verified task evidence documents
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/verified-evidence-scan.mjs
      - name: Self-test main verification wait behavior
        run: node .github/governance/main-verification-wait.self-test.mjs
      - name: Audit native main-branch protection
        if: ${{ github.event_name != 'pull_request' && env.REPO_ADMIN_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RULESET_REPORT: artifacts/full-work-validation/ruleset-report.json
          RULESET_STRICT: true
        run: pnpm ci:ruleset
      - name: Record native ruleset audit availability
        if: ${{ github.event_name == 'pull_request' || env.REPO_ADMIN_TOKEN == '' }}
        shell: bash
        run: |
          mkdir -p artifacts/full-work-validation
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            reason='native ruleset audit is covered by the trusted Repository Governance workflow'
          else
            reason='REPO_ADMIN_TOKEN is not configured; native ruleset audit was not available'
          fi
          printf '{"status":"unavailable","reason":"%s"}\n' "$reason" \
            > artifacts/full-work-validation/ruleset-report.json
      - name: Assert governance validation did not mutate tracked files
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-work-governance-report
          path: artifacts/full-work-validation/
          if-no-files-found: error
          retention-days: 30

  quality:
    name: quality
    uses: ./.github/workflows/quality-core.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha || inputs.ref || 'work' }}
      draft_mode: false
      full_suite: true
      package_smoke: ${{ github.event_name == 'pull_request' || inputs.package_smoke }}
      security_suite: false
      performance_eval: false

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || 'work' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean security checkout
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit high-severity dependency vulnerabilities
        run: pnpm audit --audit-level=high
      - name: Scan complete repository history for secrets
        run: node scripts/scan-secrets.mjs --history
      - run: pnpm test:prepare
      - name: Run application security tests
        run: pnpm test:security
      - name: Assert security validation did not mutate tracked files
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  performance:
    name: performance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || 'work' }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:prepare
      - name: Run performance budgets
        env:
          WORLDFORGE_M8_PERF_OUTPUT: test-results/performance/m8-02.json
        run: |
          mkdir -p test-results/performance
          pnpm exec vitest run tests/performance --no-file-parallelism
          test -s test-results/performance/m8-02.json
      - name: Run AI protocol baselines
        run: |
          pnpm exec vitest run \
            tests/performance/ai-output-protocol.test.ts \
            tests/performance/ai-eval-baseline.test.ts

  windows-native-ime:
    name: windows-native-ime
    if: ${{ github.event_name == 'pull_request' || inputs.windows_ime }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || 'work' }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before Windows IME acceptance
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify built-in Microsoft Pinyin input profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path test-results/windows-ime | Out-Null
          $tipId = '{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}'
          $profileId = '{FA550B04-5AD7-411F-A5AC-CA038EC515D7}'
          $inputTip = "0804:$tipId$profileId"
          $profilePath = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\$tipId\LanguageProfile\0x00000804\$profileId"
          if (-not (Test-Path $profilePath)) {
            throw "MICROSOFT_PINYIN_PROFILE_MISSING: $profilePath"
          }
          $registry = Get-ItemProperty -Path $profilePath
          [pscustomobject]@{
            inputTip = $inputTip
            profilePath = $profilePath
            description = [string]$registry.Description
          } |
            ConvertTo-Json -Depth 3 |
            Out-File -FilePath test-results/windows-ime/microsoft-pinyin-profile.json -Encoding utf8
          Start-Process "$env:WINDIR\System32\ctfmon.exe"
          Start-Sleep -Seconds 2
      - name: Build desktop
        run: pnpm build
      - name: Run real Windows Pinyin acceptance
        shell: powershell
        env:
          WORLDFORGE_WINDOWS_IME_EVIDENCE_DIR: ${{ github.workspace }}\test-results\windows-ime
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec playwright test --config tests/e2e/playwright.windows-ime.config.ts --workers=1 2>&1 |
            Tee-Object -FilePath test-results/windows-ime/windows-ime-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert clean working tree after Windows IME acceptance
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload Windows native IME evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-work-windows-native-ime
          path: test-results/windows-ime/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: summary
    if: always()
    needs:
      - governance
      - quality
      - security
      - performance
      - windows-native-ime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce full work validation result
        shell: bash
        env:
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          WINDOWS_IME_RESULT: ${{ needs.windows-native-ime.result }}
          WINDOWS_IME_REQUIRED: ${{ github.event_name == 'pull_request' || inputs.windows_ime }}
        run: |
          set -euo pipefail
          printf 'governance=%s\nquality=%s\nsecurity=%s\nperformance=%s\nwindows-ime=%s\n' \
            "$GOVERNANCE_RESULT" \
            "$QUALITY_RESULT" \
            "$SECURITY_RESULT" \
            "$PERFORMANCE_RESULT" \
            "$WINDOWS_IME_RESULT"
          test "$GOVERNANCE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
          if [ "$WINDOWS_IME_REQUIRED" = true ]; then
            test "$WINDOWS_IME_RESULT" = success
          else
            case "$WINDOWS_IME_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi
