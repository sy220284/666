name: Governance Code Quality Finalize

on:
  push:
    branches: [governance]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Resolve updated quality toolchain
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Migrate SQLite result boundaries and finalize renderer lifecycle fixes
        shell: bash
        run: |
          cat > .tmp-code-quality-finalize.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';

          const root = path.resolve('packages/core-service/src');
          const sqliteTarget = path.join(root, 'database/sqlite-result.ts');
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) =>
            entry.isDirectory() ? walk(path.join(directory, entry.name)) : entry.name.endsWith('.ts') ? [path.join(directory, entry.name)] : [],
          );
          const hasSqliteCall = (node) => {
            let found = false;
            const visit = (current) => {
              if (
                ts.isCallExpression(current) &&
                ts.isPropertyAccessExpression(current.expression) &&
                ['all', 'get'].includes(current.expression.name.text)
              ) found = true;
              if (!found) ts.forEachChild(current, visit);
            };
            visit(node);
            return found;
          };
          const replaceExact = (source, from, to, label) => {
            if (!source.includes(from)) throw new Error(`Expected source fragment not found: ${label}`);
            return source.replace(from, to);
          };
          const editFile = (file, transform) => {
            const original = fs.readFileSync(file, 'utf8');
            const updated = transform(original);
            if (updated === original) throw new Error(`Expected code-quality edit did not change ${file}`);
            fs.writeFileSync(file, updated);
          };

          let changedFiles = 0;
          let replacements = 0;
          for (const file of walk(root)) {
            const sourceText = fs.readFileSync(file, 'utf8');
            const sourceFile = ts.createSourceFile(file, sourceText, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            const changes = [];
            const visit = (node) => {
              if (
                ts.isAsExpression(node) &&
                ts.isAsExpression(node.expression) &&
                node.expression.type.kind === ts.SyntaxKind.UnknownKeyword &&
                hasSqliteCall(node.expression.expression)
              ) {
                changes.push({
                  start: node.getStart(sourceFile),
                  end: node.end,
                  text: `sqliteResult<${node.type.getText(sourceFile)}>(${node.expression.expression.getText(sourceFile)})`,
                });
                return;
              }
              ts.forEachChild(node, visit);
            };
            visit(sourceFile);
            if (changes.length === 0) continue;

            let output = sourceText;
            for (const change of changes.sort((left, right) => right.start - left.start)) {
              output = output.slice(0, change.start) + change.text + output.slice(change.end);
            }
            if (!output.includes('database/sqlite-result.js')) {
              let relative = path.relative(path.dirname(file), sqliteTarget).replaceAll(path.sep, '/').replace(/\.ts$/u, '');
              if (!relative.startsWith('.')) relative = `./${relative}`;
              relative += '.js';
              const imports = sourceFile.statements.filter(ts.isImportDeclaration);
              const position = imports.length > 0 ? imports.at(-1).end : 0;
              output = output.slice(0, position) + `\nimport { sqliteResult } from '${relative}';` + output.slice(position);
            }
            fs.writeFileSync(file, output);
            changedFiles += 1;
            replacements += changes.length;
          }
          if (changedFiles !== 41 || replacements !== 139) {
            throw new Error(`SQLite codemod mismatch: files=${changedFiles}, replacements=${replacements}; expected 41/139`);
          }

          const recoveryPath = 'packages/core-service/src/recovery/backup-restore.ts';
          let recovery = fs.readFileSync(recoveryPath, 'utf8');
          const requestCast = '  return value as unknown as RestoreRequestRecord;';
          const journalCast = '  return value as unknown as RestoreOperationJournal;';
          if (!recovery.includes(requestCast) || !recovery.includes(journalCast)) {
            throw new Error('Recovery record double assertions not found');
          }
          recovery = recovery
            .replace(requestCast, `  return {\n    schemaVersion: 1,\n    requestId: value.requestId,\n    sourceProjectId: value.sourceProjectId,\n    backupId: value.backupId,\n    restoredProjectId: value.restoredProjectId,\n  };`)
            .replace(journalCast, `  return {\n    schemaVersion: 1,\n    requestId: value.requestId,\n    sourceProjectId: value.sourceProjectId,\n    backupId: value.backupId,\n    targetParentDirectory: value.targetParentDirectory,\n    targetPath: value.targetPath,\n  };`);
          fs.writeFileSync(recoveryPath, recovery);

          const coveragePath = 'vitest.coverage.config.ts';
          let coverage = fs.readFileSync(coveragePath, 'utf8');
          const exclusionBlocks = /const processBoundaryCoverageExcludes = \[[\s\S]*?\] as const;\n\nconst rendererDomLifecycleCoverageExcludes = \[[\s\S]*?\] as const;/u;
          if (!exclusionBlocks.test(coverage)) throw new Error('Coverage exclusion blocks not found');
          coverage = coverage.replace(
            exclusionBlocks,
            `interface CoverageExclusionRegistry {\n  schemaVersion: number;\n  policy: 'explicit-exclusions-with-substitute-tests';\n  exclusions: readonly {\n    path: string;\n    category: 'process-boundary' | 'renderer-dom-lifecycle';\n    reason: string;\n    substituteTests: readonly string[];\n    exitCondition: string;\n  }[];\n}\n\nconst coverageExclusions = JSON.parse(\n  readFileSync(source('./docs/architecture/coverage-exclusions.json'), 'utf8'),\n) as CoverageExclusionRegistry;\nconst registeredCoverageExcludes = coverageExclusions.exclusions.map((entry) => entry.path);`,
          );
          const oldSpreads = '        ...processBoundaryCoverageExcludes,\n        ...rendererDomLifecycleCoverageExcludes,';
          if (!coverage.includes(oldSpreads)) throw new Error('Coverage exclusion spreads not found');
          coverage = coverage.replace(oldSpreads, '        ...registeredCoverageExcludes,');
          fs.writeFileSync(coveragePath, coverage);

          const governanceTestPath = 'tests/unit/code-quality-governance.test.ts';
          let governanceTest = fs.readFileSync(governanceTestPath, 'utf8');
          governanceTest = governanceTest
            .replace("      policy: 'dual-track',\n", "      policy: 'dual-track',\n      sourceHead: '881a3bcb882fe8171362ac7e45d508ee0d78ee40',\n      exclusionCount: 31,\n")
            .replace('statements: 2588', 'statements: 2443')
            .replace('branches: 2281', 'branches: 2249')
            .replace('functions: 934', 'functions: 888')
            .replace('lines: 2309', 'lines: 2153')
            .replace("    expect(eslintConfig).toContain('projectService: true');", "    expect(eslintConfig).toContain('projectService: true');\n    expect(eslintConfig).toContain(\"'react-hooks/rules-of-hooks': 'error'\");\n    expect(eslintConfig).toContain(\"'react-hooks/exhaustive-deps': 'error'\");")
            .replace("    expect(quality).toContain(\"github.event.pull_request.head.ref == 'work'\");", "    expect(quality).toContain(\"github.event.pull_request.head.ref == 'work'\");\n    expect(quality).toContain(\"github.event.pull_request.head.ref == 'governance'\");");
          fs.writeFileSync(governanceTestPath, governanceTest);

          editFile('apps/desktop/renderer/src/features/canon/canon-workbench.tsx', (source) => {
            let next = replaceExact(
              source,
              '  const bridge = props.bridge;\n',
              '  const bridge = props.bridge;\n  const section = props.section;\n  const onSectionChange = props.onSectionChange;\n',
              'canon-workbench stable prop aliases',
            );
            next = replaceExact(
              next,
              "    if (selectedForeshadowingId && props.section !== 'narrative') {\n      props.onSectionChange('narrative');\n    }\n  }, [props.onSectionChange, props.section, selectedForeshadowingId]);",
              "    if (selectedForeshadowingId && section !== 'narrative') {\n      onSectionChange('narrative');\n    }\n  }, [onSectionChange, section, selectedForeshadowingId]);",
              'canon-workbench effect dependencies',
            );
            return next;
          });

          editFile('apps/desktop/renderer/src/features/canon/state-proposal-panel.tsx', (source) => {
            let next = replaceExact(
              source,
              "  const resource = useBridgeQuery(`ai-review:${projectId}:${chapterId}`, load);\n  const command = useBridgeCommand(resource.refresh);",
              "  const resource = useBridgeQuery(`ai-review:${projectId}:${chapterId}`, load);\n  const refreshResource = resource.refresh;\n  const command = useBridgeCommand(refreshResource);",
              'state proposal stable refresh callback',
            );
            next = replaceExact(next, '          void resource.refresh();', '          void refreshResource();', 'state proposal polling refresh');
            next = replaceExact(
              next,
              '  }, [activeRunId, bridge, projectId, resource.refresh]);',
              '  }, [activeRunId, bridge, projectId, refreshResource]);',
              'state proposal polling dependencies',
            );
            return next;
          });

          editFile('apps/desktop/renderer/src/features/checks/search-panel.tsx', (source) => {
            let next = replaceExact(
              source,
              "import { useEffect, useRef, useState, type FormEvent } from 'react';",
              "import { useCallback, useEffect, useRef, useState, type FormEvent } from 'react';",
              'search panel useCallback import',
            );
            next = replaceExact(
              next,
              '  const requests = useRef(new RequestGenerationGroup<SearchPanelRequestLane>());',
              '  const requestGroup = useRef(new RequestGenerationGroup<SearchPanelRequestLane>()).current;',
              'search panel stable request group',
            ).replaceAll('requests.current', 'requestGroup');
            next = replaceExact(
              next,
              `  const requestStateChanged = (): void => setRequestStateVersion(nextRequestGeneration);\n  const beginRequest = (lane: SearchPanelRequestLane): number => {\n    const generation = requestGroup.begin(lane);\n    requestStateChanged();\n    return generation;\n  };\n  const completeRequest = (lane: SearchPanelRequestLane, generation: number): void => {\n    if (requestGroup.complete(lane, generation)) requestStateChanged();\n  };\n  const isCurrentRequest = (lane: SearchPanelRequestLane, generation: number): boolean =>\n    requestGroup.isCurrent(lane, generation);`,
              `  const requestStateChanged = useCallback(\n    (): void => setRequestStateVersion(nextRequestGeneration),\n    [],\n  );\n  const beginRequest = useCallback(\n    (lane: SearchPanelRequestLane): number => {\n      const generation = requestGroup.begin(lane);\n      requestStateChanged();\n      return generation;\n    },\n    [requestGroup, requestStateChanged],\n  );\n  const completeRequest = useCallback(\n    (lane: SearchPanelRequestLane, generation: number): void => {\n      if (requestGroup.complete(lane, generation)) requestStateChanged();\n    },\n    [requestGroup, requestStateChanged],\n  );\n  const isCurrentRequest = useCallback(\n    (lane: SearchPanelRequestLane, generation: number): boolean =>\n      requestGroup.isCurrent(lane, generation),\n    [requestGroup],\n  );`,
              'search panel request callbacks',
            );
            next = replaceExact(
              next,
              '  }, [bridge, projectId]);',
              '  }, [bridge, projectId, requestGroup, requestStateChanged]);',
              'search panel reset dependencies',
            );
            next = replaceExact(
              next,
              '  }, [bridge, projectId, reloadToken]);',
              '  }, [beginRequest, bridge, completeRequest, projectId, reloadToken, requestGroup]);',
              'search panel load dependencies',
            );
            return next;
          });

          editFile('apps/desktop/renderer/src/features/planning/idea-capsule-panel.tsx', (source) => {
            let next = replaceExact(
              source,
              "  const [activeRun, setActiveRun] = useState<GenerationRun | null>(null);\n  const [pendingAction, setPendingAction] = useState<string | null>(null);",
              "  const [activeRun, setActiveRun] = useState<GenerationRun | null>(null);\n  const activeRunId = activeRun?.runId ?? null;\n  const [pendingAction, setPendingAction] = useState<string | null>(null);",
              'idea capsule stable active run id',
            );
            next = replaceExact(next, '    if (!activeRun) return;', '    if (!activeRunId) return;', 'idea capsule active run guard');
            next = replaceExact(
              next,
              '      const outcome = await bridge.generation.getRun(projectId, activeRun.runId, { mode: \'share\' });',
              '      const outcome = await bridge.generation.getRun(projectId, activeRunId, { mode: \'share\' });',
              'idea capsule polling run id',
            );
            next = replaceExact(
              next,
              '  }, [activeRun?.runId, bridge, loadIdeas, projectId]);',
              '  }, [activeRunId, bridge, loadIdeas, projectId]);',
              'idea capsule polling dependencies',
            );
            return next;
          });

          editFile('apps/desktop/renderer/src/features/writing/writing-assistance-panel.tsx', (source) => {
            let next = replaceExact(
              source,
              '  const requestGeneration = useRef(new RequestGeneration());',
              '  const requestTracker = useRef(new RequestGeneration()).current;',
              'writing assistance stable request tracker',
            ).replaceAll('requestGeneration.current', 'requestTracker');
            next = replaceExact(
              next,
              '  }, [bridge, chapterId, projectId]);',
              '  }, [bridge, chapterId, projectId, requestTracker]);',
              'writing assistance refresh dependencies',
            );
            next = replaceExact(
              next,
              '  }, [refresh]);',
              '  }, [refresh, requestTracker]);',
              'writing assistance cleanup dependencies',
            );
            return next;
          });

          editFile('apps/desktop/renderer/src/features/writing/writing-core-workbench.tsx', (source) => {
            let next = replaceExact(
              source,
              '      chapter,\n      clearStatistics,',
              '      chapter,\n      clearStatistics,\n      continuationScrollCleanup,\n      continuationTimer,',
              'writing core continuation dependencies',
            );
            next = replaceExact(
              next,
              '      saveContinuation,\n      scheduleContinuationSave,\n      setStatus,\n    ],',
              '      saveContinuation,\n      scheduleContinuationSave,\n      setSelectedLocked,\n      setStatus,\n    ],',
              'writing core lock dependency',
            );
            return next;
          });

          for (const file of [
            'packages/core-service/src/utility-control-lifecycle.ts',
            'packages/core-service/src/utility-control-operations.ts',
            'packages/core-service/src/utility-project-content-router.ts',
            'packages/core-service/src/utility-project-narrative-router.ts',
            'packages/core-service/src/utility-project-primary-router.ts',
            'packages/core-service/src/utility-project-structure-router.ts',
            'packages/core-service/src/utility-search-rhythm-router.ts',
            'packages/core-service/src/utility-validation-router.ts',
          ]) {
            editFile(file, (source) => {
              const next = source.replace(/^\s*\/\/ eslint-disable-next-line @typescript-eslint\/switch-exhaustiveness-check --[^\n]*\n/mu, '');
              return next;
            });
          }
          NODE
          node ./.tmp-code-quality-finalize.mjs
          rm .tmp-code-quality-finalize.mjs
      - name: Format changed source
        shell: bash
        run: |
          git diff --name-only -z | xargs -0 pnpm exec prettier --write --ignore-unknown
      - name: Remove one-shot workflow before permanent policy checks
        run: rm .github/workflows/governance-code-quality-finalize.yml
      - name: Verify governance and type boundaries
        run: |
          node scripts/check-coverage-policy.mjs
          node scripts/type-assertion-policy.mjs
          pnpm ci:policy
      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck
      - name: Run focused code-quality tests
        run: |
          pnpm test:prepare
          pnpm exec vitest run \
            tests/unit/code-quality-governance.test.ts \
            tests/unit/code-quality-renderer-zero-coverage.test.ts \
            tests/unit/renderer-lifecycle-view-coverage.test.ts \
            tests/unit/sqlite-result-boundary.test.ts \
            tests/unit/type-assertion-policy.test.ts
      - name: Commit finalized governance result
        shell: bash
        run: |
          rm -f .tmp-code-quality-finalize.mjs
          rm -f .github/workflows/governance-code-quality-finalize.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '治理：收口SQLite类型边界并修复Hooks生命周期'
          git push origin HEAD:governance
