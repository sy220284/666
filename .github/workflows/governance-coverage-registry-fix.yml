name: Governance Coverage Registry Fix

on:
  push:
    branches: [governance]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Update stale coverage-registry assertion
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const file = 'tests/unit/app-shell-runtime-models.test.ts';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(
            "    const [config, baselineSource] = await Promise.all([\n      readFile('vitest.coverage.config.ts', 'utf8'),\n      readFile('docs/architecture/coverage-baseline.json', 'utf8'),\n    ]);",
            "    const [config, baselineSource, exclusionsSource] = await Promise.all([\n      readFile('vitest.coverage.config.ts', 'utf8'),\n      readFile('docs/architecture/coverage-baseline.json', 'utf8'),\n      readFile('docs/architecture/coverage-exclusions.json', 'utf8'),\n    ]);",
          );
          source = source.replace(
            "    const baseline = JSON.parse(baselineSource) as {\n      core: {\n        thresholdPercent: Record<'statements' | 'branches' | 'functions' | 'lines', number>;\n      };\n    };",
            "    const baseline = JSON.parse(baselineSource) as {\n      core: {\n        thresholdPercent: Record<'statements' | 'branches' | 'functions' | 'lines', number>;\n      };\n    };\n    const exclusions = JSON.parse(exclusionsSource) as {\n      exclusions: Array<{ path: string }>;\n    };\n    const excludedPaths = exclusions.exclusions.map((entry) => entry.path);",
          );
          source = source.replace(
            "      expect(config).toContain(`apps/desktop/renderer/src/app/${file}`);",
            "      expect(excludedPaths).toContain(`apps/desktop/renderer/src/app/${file}`);",
          );
          source = source.replace(
            "    expect(config).not.toContain('apps/desktop/renderer/src/app/app-shell-helpers.ts');\n    expect(config).not.toContain('apps/desktop/renderer/src/app/app-shell-status.ts');",
            "    expect(excludedPaths).not.toContain('apps/desktop/renderer/src/app/app-shell-helpers.ts');\n    expect(excludedPaths).not.toContain('apps/desktop/renderer/src/app/app-shell-status.ts');\n    expect(config).toContain('registeredCoverageExcludes');\n    expect(config).toContain(\"readFileSync(source('./docs/architecture/coverage-exclusions.json'), 'utf8')\");",
          );
          fs.writeFileSync(file, source);
          NODE
          pnpm exec prettier --write tests/unit/app-shell-runtime-models.test.ts
      - name: Verify focused governance test
        run: pnpm exec vitest run tests/unit/app-shell-runtime-models.test.ts tests/unit/code-quality-governance.test.ts
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/governance-coverage-registry-fix.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '测试：同步覆盖排除注册表断言'
          git push origin HEAD:governance
