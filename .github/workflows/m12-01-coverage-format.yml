name: M12-01 Locked Coverage Repair

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/m12-01-coverage-format.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: node tests/tools/m12-01-one-shot.mjs
      - run: pnpm exec prettier --write tests/unit/journal-content-router.test.ts tests/unit/journal-ipc-coverage.test.ts tests/unit/journal-workbench-boundaries.test.ts tests/e2e/visual-baselines/manifest.json
      - run: pnpm test:prepare
      - run: pnpm exec vitest run tests/unit/journal-content-router.test.ts tests/unit/journal-ipc-coverage.test.ts tests/unit/journal-workbench-boundaries.test.ts
      - run: pnpm exec vitest run --config vitest.coverage.config.ts
      - run: pnpm exec prettier --check tests/unit/journal-content-router.test.ts tests/unit/journal-ipc-coverage.test.ts tests/unit/journal-workbench-boundaries.test.ts tests/e2e/visual-baselines/manifest.json
      - name: Commit verified repair and remove one-shot tools
        shell: bash
        run: |
          rm tests/tools/m12-01-one-shot.mjs
          rm .github/workflows/m12-01-coverage-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/journal-content-router.test.ts tests/unit/journal-ipc-coverage.test.ts tests/unit/journal-workbench-boundaries.test.ts tests/e2e/visual-baselines/manifest.json tests/tools/m12-01-one-shot.mjs .github/workflows/m12-01-coverage-format.yml
          git diff --cached --check
          git commit -m 'test(M12-01): close renderer coverage and visual baseline'
          git push origin HEAD:work
