name: M12-01 Closure Repair

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/m12-01-format.yml'

permissions:
  contents: write

concurrency:
  group: m12-01-closure-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply audited Journal closure wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('packages/core-service/src/journal-service.ts')
          text = path.read_text()

          if "import { journalCatchUpWindow } from './journal-period.js';" not in text:
              anchor = "import type { ProjectWorkspaceService } from './project-workspace.js';"
              if anchor not in text:
                  raise SystemExit('project-workspace import anchor not found')
              text = text.replace(anchor, "import { journalCatchUpWindow } from './journal-period.js';\n" + anchor, 1)

          if "import { journalNavigationReferences } from './journal-navigation.js';" not in text:
              anchor = "import { journalCatchUpWindow } from './journal-period.js';"
              if anchor not in text:
                  raise SystemExit('journal period import anchor not found')
              text = text.replace(anchor, "import { journalNavigationReferences } from './journal-navigation.js';\n" + anchor, 1)

          legacy_start = text.find('function previousDaily(now: Date):')
          if legacy_start != -1:
              legacy_end_marker = "  return { start: start.toISOString(), end: end.toISOString() };\n}\n\nexport class JournalService"
              legacy_end = text.find(legacy_end_marker, legacy_start)
              if legacy_end == -1:
                  raise SystemExit('legacy UTC helper end anchor not found')
              text = text[:legacy_start] + 'export class JournalService' + text[legacy_end + len(legacy_end_marker):]

          old_catch = "    const period = current.schedule === 'daily' ? previousDaily(now) : previousWeekly(now);\n    const periodType = current.schedule as Exclude<JournalSchedule, 'off'>;"
          if old_catch in text:
              new_catch = "    const periodType = current.schedule as Exclude<JournalSchedule, 'off'>;\n    const period = this.#workspace.readProject(input.projectId, (database) =>\n      journalCatchUpWindow(database, input.projectId, periodType, now),\n    );"
              text = text.replace(old_catch, new_catch, 1)

          nav_line = '    navigationReferences: journalNavigationReferences(database, projectId, start, end),\n'
          if nav_line not in text:
              digest_anchor = '    digestReferences: digestRows.map((row) => ({\n'
              if digest_anchor not in text:
                  raise SystemExit('digestReferences anchor not found')
              text = text.replace(digest_anchor, nav_line + digest_anchor, 1)

          path.write_text(text)
          PY
      - name: Apply repository locked Prettier
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.d.ts')
          pnpm exec prettier --write "${files[@]}"
      - name: Commit audited closure repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core-service/src/journal-service.ts -- '*.ts' '*.tsx' '*.d.ts'
          git commit -m "fix(M12-01): wire journal closure helpers"
          git push origin HEAD:work
