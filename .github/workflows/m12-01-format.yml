name: M12-01 Closure Repair

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/m12-01-format.yml'

permissions:
  contents: write

concurrency:
  group: m12-01-closure-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply lifecycle and stale-result guards
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service_path = Path('packages/core-service/src/journal-service.ts')
          text = service_path.read_text()
          marker = 'Journal AI source changed before completion.'
          if marker not in text:
              anchor = "      if (run.status !== 'queued' && run.status !== 'running') {"
              if anchor not in text:
                  raise SystemExit('AI status anchor not found')
              guard = (
                  "      const source = database\n"
                  "        .prepare(\n"
                  "          `SELECT content_hash AS contentHash\n"
                  "             FROM generation_input_sources\n"
                  "            WHERE run_id = ? AND source_type = 'journal_entry' AND source_id = ?\n"
                  "            ORDER BY source_order\n"
                  "            LIMIT 1`,\n"
                  "        )\n"
                  "        .get(input.runId, entry.id) as { readonly contentHash?: string | null } | undefined;\n"
                  "      if (!source?.contentHash || source.contentHash !== entry.sourceHash) {\n"
                  "        throw new JournalServiceError(\n"
                  "          'JOURNAL_AI_CONFLICT',\n"
                  "          'Journal AI source changed before completion.',\n"
                  "        );\n"
                  "      }\n"
              )
              text = text.replace(anchor, guard + anchor, 1)
              service_path.write_text(text)

          shell_path = Path('apps/desktop/renderer/src/app/app-shell-m3.tsx')
          shell = shell_path.read_text()
          catchup_marker = 'window.worldforgeJournal.catchUp({ projectId })'
          if catchup_marker not in shell:
              anchor = "  useEffect(() => {\n    const onKeyDown = (event: KeyboardEvent): void => {"
              if anchor not in shell:
                  raise SystemExit('AppShell keydown anchor not found')
              effect = (
                  "  useEffect(() => {\n"
                  "    const projectId = activeProject?.projectId;\n"
                  "    if (!projectId || activeProject?.databaseMode === 'read-only' || !window.worldforgeJournal) return;\n"
                  "    void window.worldforgeJournal.catchUp({ projectId }).catch(() => undefined);\n"
                  "  }, [activeProject?.databaseMode, activeProject?.projectId]);\n\n"
              )
              shell = shell.replace(anchor, effect + anchor, 1)
              shell_path.write_text(shell)
          PY
      - name: Apply repository locked Prettier
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.d.ts')
          pnpm exec prettier --write "${files[@]}"
      - name: Commit audited closure repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core-service/src/journal-service.ts apps/desktop/renderer/src/app/app-shell-m3.tsx -- '*.ts' '*.tsx' '*.d.ts'
          git commit -m "fix(M12-01): close journal lifecycle races"
          git push origin HEAD:work
