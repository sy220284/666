name: M12-01 Static Repair

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/m12-01-format.yml'

permissions:
  contents: write

concurrency:
  group: m12-01-static-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Repair Journal static typing and Prompt identity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          journal = Path('packages/core-service/src/journal-service.ts')
          text = journal.read_text()
          text = text.replace(
              'function count(database: ProjectDatabase, sql: string, ...parameters: unknown[]): number {',
              'function count(\n  database: ProjectDatabase,\n  sql: string,\n  ...parameters: (string | number | bigint | null)[]\n): number {',
              1,
          )
          text = text.replace(
              'function sum(database: ProjectDatabase, sql: string, ...parameters: unknown[]): number {',
              'function sum(\n  database: ProjectDatabase,\n  sql: string,\n  ...parameters: (string | number | bigint | null)[]\n): number {',
              1,
          )
          journal.write_text(text)

          longform = Path('packages/core-service/src/longform-ai-service.ts')
          text = longform.read_text()
          if 'journalSummaryPrompt,' not in text:
              text = text.replace('  ideaExplorePrompt,\n', '  ideaExplorePrompt,\n  journalSummaryPrompt,\n', 1)
          if 'journal_summarize: journalSummaryPrompt,' not in text:
              text = text.replace('    idea_explore: ideaExplorePrompt,\n', '    idea_explore: ideaExplorePrompt,\n    journal_summarize: journalSummaryPrompt,\n', 1)
          longform.write_text(text)
          PY
      - name: Apply repository locked Prettier
        run: pnpm exec prettier --write packages/core-service/src/journal-service.ts packages/core-service/src/longform-ai-service.ts
      - name: Verify repaired type surface
        run: pnpm typecheck
      - name: Commit verified static repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core-service/src/journal-service.ts packages/core-service/src/longform-ai-service.ts
          git commit -m 'fix(M12-01): close journal static type gaps'
          git push origin HEAD:work
