name: M12-01 Locked Formatter

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/m12-01-format.yml'
      - 'packages/contracts/src/journal.ts'
      - 'packages/contracts/src/ai-output-protocol.ts'
      - 'packages/contracts/src/generation.ts'
      - 'packages/contracts/src/task-protocol.ts'
      - 'packages/core-service/src/generation/run-repository.ts'

permissions:
  contents: write

concurrency:
  group: m12-01-locked-formatter
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply repository locked Prettier
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/journal.ts
          packages/contracts/src/ai-output-protocol.ts
          packages/contracts/src/generation.ts
          packages/contracts/src/task-protocol.ts
          packages/core-service/src/generation/run-repository.ts
      - name: Commit authoritative formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/journal.ts \
            packages/contracts/src/ai-output-protocol.ts \
            packages/contracts/src/generation.ts \
            packages/contracts/src/task-protocol.ts \
            packages/core-service/src/generation/run-repository.ts
          git commit -m "style(M12-01): apply locked Prettier output"
          git push origin HEAD:work
