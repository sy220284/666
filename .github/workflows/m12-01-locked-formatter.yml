name: M12-01 Locked Formatter

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/m12-01-locked-formatter.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply repository formatter and self-remove
        shell: bash
        run: |
          pnpm exec prettier --write \
            packages/core-service/src/journal-service.ts \
            tests/integration/journal-ai-stale-result.test.ts \
            tests/integration/journal-service.test.ts \
            tests/performance/m12-01-journal-window-performance.test.ts
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'docs/tasks/runtime/M12-01.json';
          const runtime = JSON.parse(readFileSync(path, 'utf8'));
          runtime.allowedPaths = runtime.allowedPaths.filter(
            (entry) => entry !== '.github/workflows/m12-01-locked-formatter.yml',
          );
          writeFileSync(path, `${JSON.stringify(runtime, null, 2)}\n`);
          NODE
          rm .github/workflows/m12-01-locked-formatter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'style(M12-01): apply locked Prettier output'
          git push origin HEAD:work
