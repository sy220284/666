name: M12-01 SQLite Boundary Fix

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/m12-01-sqlite-boundary-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply SQLite result boundary and self-remove
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceExact(text, from, to, label) {
            const first = text.indexOf(from);
            if (first < 0 || text.indexOf(from, first + from.length) >= 0) {
              throw new Error(`Expected exactly one match for ${label}`);
            }
            return text.replace(from, to);
          }

          const servicePath = 'packages/core-service/src/journal-service.ts';
          let service = readFileSync(servicePath, 'utf8');
          service = replaceExact(
            service,
            "import type { DatabaseClock } from './database/index.js';\n",
            "import type { DatabaseClock } from './database/index.js';\nimport { sqliteResult } from './database/sqlite-result.js';\n",
            'journal-service sqliteResult import',
          );
          service = replaceExact(
            service,
            '  const digestRows = database\n',
            '  const digestRows = sqliteResult<DigestRow[]>(\n    database\n',
            'digest rows start',
          );
          service = replaceExact(
            service,
            '    .all(projectId) as unknown as DigestRow[];\n',
            '      .all(projectId),\n  );\n',
            'digest rows result',
          );
          service = replaceExact(
            service,
            '    const rows = database\n',
            '    const rows = sqliteResult<JournalRow[]>(\n      database\n',
            'catalog rows start',
          );
          service = replaceExact(
            service,
            '        parsed.limit + 1,\n      ) as unknown as JournalRow[];\n',
            '        parsed.limit + 1,\n      ),\n    );\n',
            'catalog rows result',
          );
          writeFileSync(servicePath, service);

          const navPath = 'packages/core-service/src/journal-navigation.ts';
          let nav = readFileSync(navPath, 'utf8');
          nav = replaceExact(
            nav,
            "} from '@worldforge/contracts';\n",
            "} from '@worldforge/contracts';\n\nimport { sqliteResult } from './database/sqlite-result.js';\n",
            'journal-navigation sqliteResult import',
          );
          for (const [name, type] of [
            ['chapters', 'ChapterRow'],
            ['versions', 'VersionRow'],
            ['entities', 'EntityRow'],
            ['issues', 'ValidationRow'],
            ['ideas', 'IdeaRow'],
          ]) {
            nav = replaceExact(
              nav,
              `  const ${name} = database\n`,
              `  const ${name} = sqliteResult<${type}[]>(\n    database\n`,
              `${name} rows start`,
            );
            nav = replaceExact(
              nav,
              `    .all(projectId, periodStart, periodEnd) as unknown as ${type}[];\n`,
              '      .all(projectId, periodStart, periodEnd),\n  );\n',
              `${name} rows result`,
            );
          }
          writeFileSync(navPath, nav);

          const runtimePath = 'docs/tasks/runtime/M12-01.json';
          const runtime = JSON.parse(readFileSync(runtimePath, 'utf8'));
          runtime.allowedPaths = runtime.allowedPaths.filter(
            (entry) => entry !== '.github/workflows/m12-01-sqlite-boundary-fix.yml',
          );
          writeFileSync(runtimePath, `${JSON.stringify(runtime, null, 2)}\n`);
          NODE
          pnpm exec prettier --write \
            packages/core-service/src/journal-service.ts \
            packages/core-service/src/journal-navigation.ts \
            docs/tasks/runtime/M12-01.json
          node scripts/type-assertion-policy.mjs
          rm .github/workflows/m12-01-sqlite-boundary-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(M12-01): enforce SQLite result boundaries'
          git push origin HEAD:work
