name: M12-01 Test Format Fix

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/m12-01-test-format-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Fix deterministic Journal entry selector and format
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'tests/unit/journal-workbench-interactions.test.ts';
          const source = readFileSync(path, 'utf8');
          const from = "buttonContaining(renderer.root, '每日 ·')";
          const matches = source.split(from).length - 1;
          if (matches !== 2) throw new Error(`Expected two daily entry selectors, found ${matches}.`);
          writeFileSync(path, source.split(from).join("buttonContaining(renderer.root, '确定性复盘')"));
          NODE
          pnpm exec prettier --write tests/unit/journal-workbench-interactions.test.ts
          pnpm test:prepare
          pnpm exec vitest run tests/unit/journal-workbench-interactions.test.ts
          pnpm exec prettier --check tests/unit/journal-workbench-interactions.test.ts
      - name: Self-remove authorization and publish verified test fix
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'docs/tasks/runtime/M12-01.json';
          const runtime = JSON.parse(readFileSync(path, 'utf8'));
          runtime.allowedPaths = runtime.allowedPaths.filter(
            (entry) => entry !== '.github/workflows/m12-01-test-format-fix.yml',
          );
          writeFileSync(path, `${JSON.stringify(runtime, null, 2)}\n`);
          NODE
          rm .github/workflows/m12-01-test-format-fix.yml
          pnpm exec prettier --write docs/tasks/runtime/M12-01.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test(M12-01): close journal workbench coverage gap'
          git push origin HEAD:work
