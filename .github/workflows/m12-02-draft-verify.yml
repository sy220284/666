name: M12-02 Draft Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: m12-02-draft-verify-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'work' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply exact closure-test corrections
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'tests/reliability/m12-02-artifact-recovery.test.ts';
          let source = readFileSync(file, 'utf8');

          const manifestTypeBefore = 'artifacts: Array<{ managedRelativePath: string; sha256: string; sizeBytes: number }>';
          const manifestTypeAfter = 'files: Array<{ relativePath: string; sha256: string; sizeBytes: number }>';
          if (!source.includes(manifestTypeBefore)) throw new Error('Expected artifact manifest type was not found.');
          if ((source.match(/manifest\.artifacts/gu) ?? []).length !== 2) throw new Error('Expected exactly two manifest.artifacts assertions.');
          source = source.replace(manifestTypeBefore, manifestTypeAfter).replaceAll('manifest.artifacts', 'manifest.files');

          const unsafeStartMarker = "  it('fails backup creation when managed artifact metadata escapes the project path boundary', async () => {";
          const nextTestMarker = "  it('removes managed artifact bundles as part of backup cleanup completion', async () => {";
          const start = source.indexOf(unsafeStartMarker);
          const end = source.indexOf(nextTestMarker, start);
          if (start < 0 || end < 0) throw new Error('Expected unsafe-path test boundaries were not found.');
          const replacement = [
            "  it('rejects unsafe managed paths at both database and restore-manifest boundaries', async () => {",
            '    const value = await harness();',
            '    try {',
            '      await expect(',
            '        value.workspace.writeProject(randomUUID(), value.project.projectId, (database) => {',
            '          database',
            '            .prepare(',
            "              'UPDATE research_attachments SET managed_relative_path = ? WHERE id = ? AND project_id = ?',",
            '            )',
            "            .run('../escape.txt', value.attachment.id, value.project.projectId);",
            '        }),',
            "      ).rejects.toMatchObject({ code: 'DATABASE_WRITE_FAILED' });",
            '',
            '      const checkpoint = await value.recovery.createOperationCheckpoint(randomUUID(), {',
            '        projectId: value.project.projectId,',
            "        operation: 'replace',",
            '      });',
            '      const manifestPath = path.join(',
            '        value.backupRoot,',
            '        value.project.projectId,',
            '        `${checkpoint.backupId}.artifacts.json`,',
            '      );',
            "      const manifest = JSON.parse(await readFile(manifestPath, 'utf8')) as {",
            '        files: Array<Record<string, unknown>>;',
            '      };',
            "      manifest.files[0]!.relativePath = '../escape.txt';",
            "      await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\\n`, 'utf8');",
            '',
            '      await expect(',
            '        value.recovery.restoreCheckpoint(',
            '          randomUUID(),',
            '          { projectId: value.project.projectId, backupId: checkpoint.backupId },',
            '          value.restoreParent,',
            '        ),',
            "      ).rejects.toMatchObject({ code: 'RESTORE_SOURCE_INVALID' });",
            '      expect(await readdir(value.restoreParent)).toEqual([]);',
            '    } finally {',
            '      await value.workspace.shutdown();',
            '      await value.runtime.close();',
            '    }',
            '  });',
            '',
          ].join('\n');
          source = source.slice(0, start) + replacement + source.slice(end);
          writeFileSync(file, source, 'utf8');
          NODE
      - name: Format every changed PR text file with locked Prettier
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '\.(ts|tsx|js|mjs|cjs|json|md|yml|yaml)$' || true)
          files+=(tests/reliability/m12-02-artifact-recovery.test.ts)
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -u)
          if (( ${#files[@]} > 0 )); then
            pnpm exec prettier --write "${files[@]}"
            pnpm exec prettier --check "${files[@]}"
          fi
          pnpm exec prettier --version
      - name: Run workspace boundaries
        run: |
          pnpm check:workspaces
          pnpm check:boundaries
      - name: Run lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck
      - name: Prepare tests
        run: pnpm test:prepare
      - name: Run M12-02 closure and regression tests
        run: >-
          pnpm exec vitest run
          tests/unit/ar08-contracts-public-surface.test.ts
          tests/unit/m10-12-generation-cancel-barrier.test.ts
          tests/unit/m10-12-generation-cancel-order.test.ts
          tests/unit/m10-12-generation-persist-cancel-race.test.ts
          tests/unit/m10-19-lifecycle-renderer-recovery.test.ts
          tests/unit/ipc-handlers-branch-coverage.test.ts
          tests/unit/m11-05-idea-navigation.test.ts
          tests/unit/m11-project-operation-semantics.test.ts
          tests/unit/renderer-m3-09-workbenches.test.ts
          tests/security/search-rhythm-ipc.test.ts
          tests/integration/recovery-request-replay.test.ts
          tests/integration/m12-02-research-assets.test.ts
          tests/integration/m12-02-research-closure.test.ts
          tests/integration/m12-02-generation-research-reference.test.ts
          tests/integration/m12-02-artifact-move.test.ts
          tests/reliability/m12-02-artifact-recovery.test.ts
      - name: Commit verified closure fixes and locked formatting
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'test(M12-02): verify artifact path and manifest boundaries'
            git push origin HEAD:work
          fi
