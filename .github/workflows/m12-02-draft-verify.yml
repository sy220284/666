name: M12-02 Visual Baseline Apply

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: m12-02-visual-baseline-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'work' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work
          fetch-depth: 0
      - name: Download immutable visual witness artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 9220558006
          path: /tmp/m12-02-visual-witness
          github-token: ${{ github.token }}
          repository: sy220284/666
          run-id: 31803014918
      - name: Apply byte-stable visual witness artifact
        shell: bash
        run: |
          set -euo pipefail
          witness=/tmp/m12-02-visual-witness

          apply_baseline() {
            local snapshot="$1"
            local expected="$2"
            local actual
            actual="$(find "$witness" -type f -name "${snapshot}.actual.png" -print -quit)"
            test -n "$actual"
            local observed
            observed="$(sha256sum "$actual" | awk '{print $1}')"
            test "$observed" = "$expected"
            cp "$actual" "tests/e2e/visual-baselines/$snapshot"
          }

          apply_baseline 'theme-a-light-1280x800.png' '49a78490e24ecd98d734c4a1263e08d7ea47e0fe992417e3f759f8fbd71491e7'
          apply_baseline 'theme-a-dark-1280x800.png' '2de849bccc172050f450eee3f45f9cd2202d401eaa7a91acbc4ab6ee09c4c544'
          apply_baseline 'theme-b-light-1280x800.png' '2d5dbddc39d1b44d8e8945bb9b55e9b98ad727e10a193c61688962e8be0af6bc'
          apply_baseline 'theme-b-dark-1280x800.png' '790ff5da93ae555c0a9313721f35483fec2107cd52cf7b98b6b1d47299232e89'

          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in (
              'theme-a-light-1280x800.png',
              'theme-a-dark-1280x800.png',
              'theme-b-light-1280x800.png',
              'theme-b-dark-1280x800.png',
          ):
              data = (Path('tests/e2e/visual-baselines') / name).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: invalid PNG signature')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1280, 800):
                  raise SystemExit(f'{name}: unexpected dimensions {(width, height)}')
          PY

          cat > tests/e2e/visual-baselines/manifest.json <<'JSON'
          {
            "schemaVersion": 1,
            "platform": "linux",
            "source": {
              "verifiedHead": "07b9484a7a8ab7f2b02af6aff0572a17b7fd4720",
              "qualityRunId": 31794884165,
              "artifactId": 9217434664,
              "artifactDigest": "sha256:380f368582b02552f480974414eba7530c2750ed299bf164d042230c64457277"
            },
            "stabilityWitness": {
              "verifiedHead": "3e6f77c02ebc36d8b670788f92c8e04ce669da20",
              "qualityRunId": 31803014918,
              "artifactId": 9220558006,
              "artifactDigest": "sha256:62ad1f69f5d5beb49b53f6eca5d164db42de820929e5a0ddfed34897b12748c9"
            },
            "baselines": [
              {
                "snapshotName": "theme-a-light-1280x800.png",
                "sha256": "49a78490e24ecd98d734c4a1263e08d7ea47e0fe992417e3f759f8fbd71491e7",
                "width": 1280,
                "height": 800
              },
              {
                "snapshotName": "theme-a-dark-1280x800.png",
                "sha256": "2de849bccc172050f450eee3f45f9cd2202d401eaa7a91acbc4ab6ee09c4c544",
                "width": 1280,
                "height": 800
              },
              {
                "snapshotName": "theme-b-light-1280x800.png",
                "sha256": "2d5dbddc39d1b44d8e8945bb9b55e9b98ad727e10a193c61688962e8be0af6bc",
                "width": 1280,
                "height": 800
              },
              {
                "snapshotName": "theme-b-dark-1280x800.png",
                "sha256": "790ff5da93ae555c0a9313721f35483fec2107cd52cf7b98b6b1d47299232e89",
                "width": 1280,
                "height": 800
              }
            ]
          }
          JSON

          sha256sum tests/e2e/visual-baselines/*.png
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/visual-baselines
          git commit -m 'test(M12-02): accept stable research visual baselines'
          git push origin HEAD:work
