name: M12-02 Locked Formatter

on:
  push:
    branches:
      - work
    paths:
      - .github/workflows/m12-02-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format M12-02 coverage tests with locked Prettier
        run: |
          pnpm exec prettier --write \
            tests/unit/m12-02-research-ipc-coverage.test.ts \
            tests/unit/m12-02-research-workbench-branches.test.ts \
            tests/unit/m12-02-research-workbench-render.test.ts
          pnpm exec prettier --check \
            tests/unit/m12-02-research-ipc-coverage.test.ts \
            tests/unit/m12-02-research-workbench-branches.test.ts \
            tests/unit/m12-02-research-workbench-render.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m12-02-formatted-tests
          path: |
            tests/unit/m12-02-research-ipc-coverage.test.ts
            tests/unit/m12-02-research-workbench-branches.test.ts
            tests/unit/m12-02-research-workbench-render.test.ts
          if-no-files-found: error
          retention-days: 1
