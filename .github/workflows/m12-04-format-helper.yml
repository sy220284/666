# M12-04 one-time trigger
name: M12-04 One-time Formatter

on:
  push:
    branches:
      - work

permissions:
  contents: write

jobs:
  format-research-workbench:
    if: github.event.head_commit.message == 'chore(M12-04): run one-time formatter helper'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work
          fetch-depth: 1
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format the M12-04 research workbench only
        run: pnpm exec prettier --write apps/desktop/renderer/src/features/research/research-workbench.tsx
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/renderer/src/features/research/research-workbench.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(M12-04): format research workbench'
          git push origin HEAD:work
