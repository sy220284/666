name: M8-02 Backup Failure Ledger Codemod

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - scripts/m8-02-backup-failure-ledger-codemod.mjs
      - .github/workflows/m8-02-backup-failure-ledger-codemod.yml

permissions:
  contents: write

concurrency:
  group: m8-02-backup-failure-ledger-codemod
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-02-performance-e2e-ai-eval
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply deterministic codemod
        run: node scripts/m8-02-backup-failure-ledger-codemod.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format and verify vertical closure
        run: |
          pnpm exec prettier --write \
            migrations/project/0029_backup_failure_ledger.sql \
            packages/contracts/src/recovery.ts \
            packages/core-service/src/recovery.ts \
            apps/desktop/renderer/src/runtime/workspace-attention.ts \
            apps/desktop/renderer/src/app/app-shell-m3.tsx \
            tests/unit/workspace-attention.test.ts \
            tests/migration/backup-failure-ledger-migration.test.ts \
            tests/integration/recovery-failure-ledger.test.ts \
            tests/migration/*.test.ts \
            docs/database/DATABASE_SCHEMA.md
          pnpm typecheck
          pnpm exec vitest run \
            tests/migration/backup-failure-ledger-migration.test.ts \
            tests/integration/recovery-failure-ledger.test.ts \
            tests/unit/workspace-attention.test.ts
      - name: Commit verified closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "修复(M8-02)：建立备份失败权威账本"
          git push origin HEAD:work/m8-02-performance-e2e-ai-eval
