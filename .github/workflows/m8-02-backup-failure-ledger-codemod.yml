name: M8-02 Backup Failure Ledger Codemod

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - scripts/m8-02-backup-failure-ledger-codemod.mjs
      - .github/workflows/m8-02-backup-failure-ledger-codemod.yml

permissions:
  contents: write

concurrency:
  group: m8-02-backup-failure-ledger-codemod
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-02-performance-e2e-ai-eval
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Correct codemod templates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'scripts/m8-02-backup-failure-ledger-codemod.mjs';
          let content = await readFile(file, 'utf8');
          const replacements = [
            [
              "          .prepare(\n            `INSERT INTO backup_failures(",
              "          .prepare(\n            \\`INSERT INTO backup_failures(",
            ],
            [
              ") VALUES(?, ?, 'import', 'daily', 'UNKNOWN', ?, NULL)`,",
              ") VALUES(?, ?, 'import', 'daily', 'UNKNOWN', ?, NULL)\\`,",
            ],
            [
              "            .prepare(\n              `SELECT error_code AS errorCode, resolved_at AS resolvedAt",
              "            .prepare(\n              \\`SELECT error_code AS errorCode, resolved_at AS resolvedAt",
            ],
            [
              "                 FROM backup_failures WHERE project_id = ?`,",
              "                 FROM backup_failures WHERE project_id = ?\\`,",
            ],
            [
              "recovery = replaceExact(\n  recovery,\n  `    return this.#createBackup(\n      requestId,\n      { projectId: input.projectId, operation: 'manual-protection' },`,\n  `    return this.#createTrackedBackup(\n      requestId,\n      { projectId: input.projectId, operation: 'manual-protection' },`,\n  'track daily failure',\n);",
              "recovery = replaceExact(\n  recovery,\n  `    return this.#createBackup(\n      requestId,\n      { projectId: input.projectId, operation: 'manual-protection' },\n      {\n        track: 'daily',`,\n  `    return this.#createTrackedBackup(\n      requestId,\n      { projectId: input.projectId, operation: 'manual-protection' },\n      {\n        track: 'daily',`,\n  'track daily failure',\n);",
            ],
          ];
          for (const [before, after] of replacements) {
            const count = content.split(before).length - 1;
            if (count !== 1) throw new Error(`template correction expected one match, got ${count}`);
            content = content.replace(before, after);
          }
          await writeFile(file, content, 'utf8');
          NODE
      - name: Apply deterministic codemod
        shell: bash
        run: |
          mkdir -p test-results/codemod
          set -o pipefail
          node scripts/m8-02-backup-failure-ledger-codemod.mjs 2>&1 | tee test-results/codemod/codemod.log
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format and verify vertical closure
        shell: bash
        run: |
          mkdir -p test-results/codemod
          set -o pipefail
          {
            pnpm exec prettier --write \
              migrations/project/0029_backup_failure_ledger.sql \
              packages/contracts/src/recovery.ts \
              packages/core-service/src/recovery.ts \
              apps/desktop/renderer/src/runtime/workspace-attention.ts \
              apps/desktop/renderer/src/app/app-shell-m3.tsx \
              tests/unit/workspace-attention.test.ts \
              tests/migration/backup-failure-ledger-migration.test.ts \
              tests/integration/recovery-failure-ledger.test.ts \
              tests/migration/*.test.ts \
              docs/database/DATABASE_SCHEMA.md
            pnpm typecheck
            pnpm exec vitest run \
              tests/migration/backup-failure-ledger-migration.test.ts \
              tests/integration/recovery-failure-ledger.test.ts \
              tests/unit/workspace-attention.test.ts
          } 2>&1 | tee test-results/codemod/verification.log
      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p test-results/codemod
          git status --short > test-results/codemod/git-status.txt
          git diff --no-ext-diff > test-results/codemod/git-diff.patch
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m8-02-backup-failure-ledger-${{ github.run_id }}
          path: test-results/codemod/
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "修复(M8-02)：建立备份失败权威账本"
          git push origin HEAD:work/m8-02-performance-e2e-ai-eval
