name: M8-02 Cross Platform E2E Fix Codemod

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - scripts/m8-02-cross-platform-e2e-fix-codemod.mjs
      - .github/workflows/m8-02-cross-platform-e2e-fix-codemod.yml

permissions:
  contents: write

concurrency:
  group: m8-02-cross-platform-e2e-fix-codemod
  cancel-in-progress: false

jobs:
  finalize-verified-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-02-performance-e2e-ai-eval
          fetch-depth: 0
      - name: Reapply previously verified deterministic codemod
        run: node scripts/m8-02-cross-platform-e2e-fix-codemod.mjs
      - name: Commit only formal verified changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            apps/desktop/renderer/src/features/home/home-page.tsx \
            apps/desktop/renderer/src/features/writing/writing-core-workbench.tsx \
            tests/e2e/electron-shell.spec.ts \
            .github/workflows/m8-02-remaining-validation.yml
          git add -A -- \
            scripts/m8-02-cross-platform-e2e-fix-codemod.mjs \
            .github/workflows/m8-02-cross-platform-e2e-fix-codemod.yml
          git status --short
          git commit -m "修复(M8-02)：关闭跨平台Electron验收缺口"
          git push origin HEAD:work/m8-02-performance-e2e-ai-eval
