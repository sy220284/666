name: M8-02 Diagnostic Confirmation Codemod

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - scripts/m8-02-diagnostic-confirmation-codemod.mjs
      - .github/workflows/m8-02-diagnostic-confirmation-codemod.yml

permissions:
  contents: write

concurrency:
  group: m8-02-diagnostic-confirmation-codemod
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-02-performance-e2e-ai-eval
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Apply deterministic codemod
        run: node scripts/m8-02-diagnostic-confirmation-codemod.mjs
      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          apps/desktop/main/src/ipc-handlers.ts
          apps/desktop/main/src/electron-main.ts
          tests/e2e/electron-shell.spec.ts
          tests/security/diagnostic-ipc-confirmation.test.ts
      - name: Verify trusted confirmation
        shell: bash
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/security/diagnostic-ipc-confirmation.test.ts tests/security/diagnostic-export.test.ts
      - name: Commit verified closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "修复(M8-02)：将诊断导出确认下沉到Main可信边界"
          git push origin HEAD:work/m8-02-performance-e2e-ai-eval
