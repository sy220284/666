name: M8-02 Final Closure Codemod

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - scripts/m8-02-final-closure-codemod.mjs
      - .github/workflows/m8-02-final-closure-codemod.yml

permissions:
  contents: write

concurrency:
  group: m8-02-final-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.head_ref == 'work/m8-02-performance-e2e-ai-eval'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      WORLDFORGE_M8_PERF_OUTPUT: test-results/performance/m8-release-performance.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply deterministic closure patch
        run: node scripts/m8-02-final-closure-codemod.mjs
      - name: Format changed source and tests
        run: >-
          pnpm exec prettier --write
          packages/core-service/src/docx-transfer.ts
          packages/core-service/src/recovery.ts
          tests/integration/docx-transfer.test.ts
          tests/integration/three-track-recovery.test.ts
          tests/performance/m8-release-evidence.test.ts
          tests/e2e/electron-shell.spec.ts
          tests/e2e/m1-deferred-acceptance.spec.ts
          tests/e2e/unreadable-project-recovery.spec.ts
      - name: Static verification
        run: |
          pnpm lint
          pnpm typecheck
      - name: Targeted integration and performance verification
        run: |
          pnpm test:prepare
          pnpm exec vitest run \
            tests/integration/docx-transfer.test.ts \
            tests/integration/three-track-recovery.test.ts \
            tests/performance/m8-release-evidence.test.ts
      - name: Install Electron display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Full Electron E2E verification
        run: xvfb-run -a pnpm test:e2e
      - name: Commit verified formal changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/core-service/src/docx-transfer.ts \
            packages/core-service/src/recovery.ts \
            tests/integration/docx-transfer.test.ts \
            tests/integration/three-track-recovery.test.ts \
            tests/performance/m8-release-evidence.test.ts \
            tests/e2e/electron-shell.spec.ts \
            tests/e2e/m1-deferred-acceptance.spec.ts \
            tests/e2e/unreadable-project-recovery.spec.ts
          git diff --cached --check
          git commit -m '测试(M8-02)：关闭DOCX、备份并发与运行性能专项'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m8-02-final-closure-evidence
          path: |
            test-results/performance/
            test-results/electron/
          if-no-files-found: warn
