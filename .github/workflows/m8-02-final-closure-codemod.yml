name: M8-02 Final Closure Codemod

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - scripts/m8-02-final-closure-codemod.mjs
      - scripts/m8-02-final-closure-fix.mjs
      - scripts/m8-02-e2e-diagnostic-fix.mjs
      - scripts/m8-02-shared-recovery-codemod.mjs
      - .github/workflows/m8-02-final-closure-codemod.yml

permissions:
  contents: write

concurrency:
  group: m8-02-final-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.head_ref == 'work/m8-02-performance-e2e-ai-eval'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      WORLDFORGE_M8_PERF_OUTPUT: test-results/performance/m8-release-performance.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply deterministic closure and diagnostic patches
        run: |
          node scripts/m8-02-final-closure-codemod.mjs
          node scripts/m8-02-final-closure-fix.mjs
          node scripts/m8-02-e2e-diagnostic-fix.mjs
          node scripts/m8-02-shared-recovery-codemod.mjs
      - name: Format changed source and tests
        run: >-
          pnpm exec prettier --write
          apps/desktop/renderer/src/bridge/request-lifecycle.ts
          apps/desktop/renderer/src/bridge/renderer-bridge-adapter.ts
          apps/desktop/renderer/src/runtime/workspace-attention.ts
          apps/desktop/renderer/src/features/data-tools/data-tools-workbench.tsx
          packages/core-service/src/docx-transfer.ts
          packages/core-service/src/recovery.ts
          tests/unit/bridge-request-sharing.test.ts
          tests/integration/docx-transfer.test.ts
          tests/integration/three-track-recovery.test.ts
          tests/performance/m8-release-evidence.test.ts
          tests/e2e/electron-shell.spec.ts
          tests/e2e/continuation-panel-race.spec.ts
          tests/e2e/m1-deferred-acceptance.spec.ts
          tests/e2e/unreadable-project-recovery.spec.ts
      - name: Static and shared-query verification
        run: |
          set -o pipefail
          {
            pnpm lint
            pnpm typecheck
            pnpm test:prepare
            pnpm exec vitest run tests/unit/bridge-request-sharing.test.ts
          } 2>&1 | tee m8-static.log
      - name: Build Electron workspaces
        run: pnpm build
      - name: Install Electron display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Run recovery and continuation diagnostics
        run: |
          set -o pipefail
          node scripts/run-electron-e2e.mjs \
            tests/e2e/continuation-panel-race.spec.ts \
            tests/e2e/m1-deferred-acceptance.spec.ts \
            tests/e2e/unreadable-project-recovery.spec.ts \
            2>&1 | tee m8-recovery-diagnostic.log
      - name: Run Renderer frame-rate diagnostic
        run: |
          set -o pipefail
          node scripts/run-electron-e2e.mjs \
            tests/e2e/electron-shell.spec.ts \
            --grep 'records Renderer animation-frame budget' \
            2>&1 | tee m8-renderer-diagnostic.log
      - name: Upload closure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m8-02-targeted-electron-diagnostics
          path: |
            m8-static.log
            m8-recovery-diagnostic.log
            m8-renderer-diagnostic.log
            tests/e2e/test-results/electron/
            test-results/electron/
          if-no-files-found: warn
