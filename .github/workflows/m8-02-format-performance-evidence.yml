name: M8-02 Format Performance Evidence

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - .github/workflows/m8-02-format-performance-evidence.yml
      - tests/performance/m8-release-evidence.test.ts

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-02-performance-e2e-ai-eval
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format and verify
        run: |
          pnpm exec prettier --write tests/performance/m8-release-evidence.test.ts
          pnpm exec prettier --check tests/performance/m8-release-evidence.test.ts .github/workflows/performance.yml
          pnpm typecheck
          rm .github/workflows/m8-02-format-performance-evidence.yml
      - name: Commit formatted source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "格式(M8-02)：规范性能证据测试"
          git push origin HEAD:work/m8-02-performance-e2e-ai-eval
