name: M8-02 Renderer Closure Codemod

on:
  push:
    branches:
      - work/m8-02-performance-e2e-ai-eval
    paths:
      - scripts/m8-02-renderer-closure-codemod.mjs
      - .github/workflows/m8-02-renderer-closure-codemod.yml
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
    paths:
      - scripts/m8-02-renderer-closure-codemod.mjs
      - .github/workflows/m8-02-renderer-closure-codemod.yml

permissions:
  contents: write

concurrency:
  group: m8-02-renderer-closure-codemod
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-02-performance-e2e-ai-eval
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Apply deterministic codemod
        run: node scripts/m8-02-renderer-closure-codemod.mjs
      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          apps/desktop/renderer/src/app/app-shell-m3.tsx
          apps/desktop/renderer/src/features/settings/provider-settings.tsx
          apps/desktop/renderer/src/features/settings/settings-page.tsx
          apps/desktop/renderer/src/runtime/ai-readiness.ts
          apps/desktop/renderer/src/runtime/workspace-attention.ts
          tests/unit/ai-readiness.test.ts
          tests/unit/workspace-attention.test.ts
      - name: Verify Renderer closure
        id: verify
        shell: bash
        run: |
          set +e
          pnpm typecheck > renderer-closure-verification.log 2>&1
          typecheck_status=$?
          pnpm exec vitest run tests/unit/ai-readiness.test.ts tests/unit/workspace-attention.test.ts tests/unit/status-arbitrator.test.ts >> renderer-closure-verification.log 2>&1
          test_status=$?
          cat renderer-closure-verification.log
          if [ "$typecheck_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload failed verification log
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: m8-02-renderer-closure-verification
          path: renderer-closure-verification.log
          if-no-files-found: error
          retention-days: 3
      - name: Commit verified closure
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "修复(M8-02)：闭环业务状态仲裁与AI会话可用性"
          git push origin HEAD:work/m8-02-performance-e2e-ai-eval
