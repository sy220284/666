name: M8-02 Windows Reopen Fix

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - scripts/m8-02-windows-reopen-fix.mjs
      - .github/workflows/m8-02-windows-reopen-fix.yml

permissions:
  contents: write

concurrency:
  group: m8-02-windows-reopen-fix
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-02-performance-e2e-ai-eval
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/m8-02-windows-reopen-fix.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify Windows source and packaged paths
        shell: bash
        run: |
          mkdir -p test-results/m8-02-windows-fix
          set -o pipefail
          {
            pnpm exec prettier --write apps/desktop/renderer/src/app/app-shell-m3.tsx
            pnpm lint
            pnpm typecheck
            pnpm build
            node scripts/run-electron-e2e.mjs tests/e2e/electron-shell.spec.ts
            pnpm run package -- --platform windows --version 0.1.0 --output release/windows
            node scripts/verify-package-assets.mjs --platform windows --version 0.1.0 --directory release/windows
            node scripts/smoke-packaged-desktop.mjs --platform windows --directory release/windows
          } 2>&1 | tee test-results/m8-02-windows-fix/verification.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m8-02-windows-reopen-fix-${{ github.run_id }}
          path: test-results/m8-02-windows-fix/
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified product fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/renderer/src/app/app-shell-m3.tsx
          git commit -m "修复(M8-02)：关闭项目重开竞态"
          git push origin HEAD:work/m8-02-performance-e2e-ai-eval
