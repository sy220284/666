name: M8-04 最终完整流程验证

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - scripts/m8-04-finalize-implementation.mjs
      - .github/workflows/m8-04-final-validation.yml

permissions:
  contents: write

concurrency:
  group: m8-04-final-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-record:
    if: github.head_ref == 'work/m8-04-author-experience-language'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 检出正式任务分支
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 安装pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - name: 安装Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: 清理临时改写脚本的旧式全局声明
        run: |
          for file in scripts/m8-04-*.mjs; do
            [ -f "$file" ] || continue
            sed -i '1{/^\/\* global .* \*\/$/d;}' "$file"
          done
      - name: 验证正式中文名称与代码规范
        run: |
          pnpm check:language
          pnpm lint
          pnpm typecheck
      - name: 执行完整自动化测试
        run: |
          pnpm test
          pnpm test:unit
          pnpm test:integration
          pnpm test:security
          pnpm test:perf
      - name: 构建桌面应用与工作区
        run: pnpm build
      - name: 安装桌面显示依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb
          fc-match "Noto Serif CJK SC"
      - name: 验证五条作者完整流程
        run: pnpm test:e2e
      - name: 登记实现结果与验证包
        run: node scripts/m8-04-finalize-implementation.mjs
      - name: 格式化任务与追踪文档
        run: >-
          pnpm exec prettier --write
          docs/tasks/M8/M8-04_AUTHOR_EXPERIENCE_LANGUAGE.md
          docs/tasks/TASK_INDEX.md
          docs/tasks/ACTIVE_TASK.json
          docs/tasks/ACTIVE_TASK.md
          docs/product/FUNCTION_CATALOG.md
          docs/product/V1.0_TRACEABILITY_MATRIX.md
          docs/test-evidence/M8-04/summary.md
          docs/test-evidence/M8-04/known-risks.md
          docs/test-evidence/M8-04/performance.json
      - name: 验证任务状态一致性
        run: pnpm task:validate
      - name: 提交实现状态与验证记录
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/tasks/M8/M8-04_AUTHOR_EXPERIENCE_LANGUAGE.md \
            docs/tasks/TASK_INDEX.md \
            docs/tasks/ACTIVE_TASK.json \
            docs/tasks/ACTIVE_TASK.md \
            docs/product/FUNCTION_CATALOG.md \
            docs/product/V1.0_TRACEABILITY_MATRIX.md \
            docs/test-evidence/M8-04
          git commit -m '文档(M8-04)：登记完整验证与已实现状态'
          git push origin HEAD:work/m8-04-author-experience-language
