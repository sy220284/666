name: M8-04 锁定格式修复

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/m8-04-format-fix.yml

permissions:
  contents: write

concurrency:
  group: m8-04-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-and-verify:
    if: github.head_ref == 'work/m8-04-author-experience-language'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出正式任务分支
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 安装pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: 安装Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: 使用仓库锁定格式化器修复
        run: >-
          pnpm exec prettier --write
          scripts/check-author-language.mjs
          apps/desktop/renderer/src/presentation/author-terms.ts
          apps/desktop/renderer/src/shell/navigation-target.ts
      - name: 验证全仓格式
        run: pnpm format:check
      - name: 提交格式修复
        run: |
          if git diff --quiet; then
            echo '没有格式变更。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/check-author-language.mjs \
            apps/desktop/renderer/src/presentation/author-terms.ts \
            apps/desktop/renderer/src/shell/navigation-target.ts
          git commit -m '样式(M8-04)：应用仓库锁定格式'
          git push origin HEAD:work/m8-04-author-experience-language
