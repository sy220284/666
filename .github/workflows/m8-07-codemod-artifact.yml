name: M8-07 Codemod Artifact

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  codemod-artifact:
    if: github.event.pull_request.head.ref == 'tooling/m8-07-codemod-artifact'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: python3 .github/governance/m8-07-language-codemod.py
      - run: python3 .github/governance/m8-07-codemod-postfix.py
      - name: Format with repository Prettier
        shell: bash
        run: |
          mapfile -t files < test-results/m8-07-codemod-files.txt
          pnpm exec prettier --write "${files[@]}"
          pnpm exec prettier --check "${files[@]}"
      - name: Validate generated result
        shell: bash
        run: |
          pnpm check:language
          pnpm typecheck
          pnpm test:unit
      - name: Materialize verified result on isolated tooling branch
        shell: bash
        env:
          TOOL_BRANCH: tooling/m8-07-codemod-artifact
        run: |
          mapfile -t files < test-results/m8-07-codemod-files.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -m "chore(tooling): materialize verified M8-07 codemod result"
          git push origin "HEAD:${TOOL_BRANCH}"
