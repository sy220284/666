name: M8-07 E2E Format

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'tooling/m8-07-e2e-format'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format and validate visual E2E
        run: |
          pnpm exec prettier --write tests/e2e/m8-07-chinese-experience.spec.ts
          pnpm exec prettier --check tests/e2e/m8-07-chinese-experience.spec.ts
          pnpm typecheck
      - name: Materialize formatted test on isolated branch
        shell: bash
        env:
          TOOL_BRANCH: tooling/m8-07-e2e-format
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/m8-07-chinese-experience.spec.ts
          git diff --cached --check
          git commit -m "chore(tooling): format M8-07 visual E2E"
          git push origin "HEAD:${TOOL_BRANCH}"
