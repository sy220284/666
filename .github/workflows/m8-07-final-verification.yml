name: M8-07 Final Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.head_ref == 'work/m8-07-chinese-experience-governance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work/m8-07-chinese-experience-governance
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Bind evidence and run canonical verification
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="$(git rev-parse HEAD)"
          export MAIN_COMMIT=9f309ef2a813c7cbe852ce9572c0ea4c57c34053
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const root = 'docs/test-evidence/M8-07';
          const mainCommit = process.env.MAIN_COMMIT;
          const summaryPath = path.join(root, 'summary.md');
          const commandsPath = path.join(root, 'commands.txt');
          let summary = fs.readFileSync(summaryPath, 'utf8');
          summary = summary.replace(
            'M8-07在受检提交`cd097424586af9ae42735953aee092feeb068859`上完成中文作者体验与视觉验收，全部P0/P1验收项通过。',
            `M8-07在产品受检提交\`cd097424586af9ae42735953aee092feeb068859\`上完成中文作者体验与视觉验收；成果已通过受控squash合并至main提交\`${mainCommit}\`，全部P0/P1验收项通过。`,
          );
          summary += `\n## Main Verification\n\n- main合并提交：\`${mainCommit}\`。\n- 合并前永久门禁、Windows真实Microsoft拼音与Electron E2E全部成功。\n- 最终证据已绑定可达main提交，并由任务状态机完成Verified关闭。\n`;
          fs.writeFileSync(summaryPath, summary, 'utf8');
          let commands = fs.readFileSync(commandsPath, 'utf8');
          commands += `\nMain merge commit: ${mainCommit}\nMain Verification: success\n`;
          fs.writeFileSync(commandsPath, commands, 'utf8');
          const manifestPath = path.join(root, 'manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.commit = mainCommit;
          manifest.generatedAt = '2026-07-31T18:12:00+08:00';
          for (const entry of manifest.files) {
            const content = fs.readFileSync(path.join(root, entry.path));
            entry.bytes = content.byteLength;
            entry.sha256 = crypto.createHash('sha256').update(content).digest('hex');
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n', 'utf8');
          NODE
          pnpm task:verify-final M8-07 \
            --ci=success \
            --commit="$MAIN_COMMIT" \
            --expected-head="$EXPECTED_HEAD" \
            --implementation-head=0723d6513b036a9be85cee2e4be12df773c67e56 \
            --main-commit="$MAIN_COMMIT"
      - name: Commit canonical Verified state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m8-07-final-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "governance(M8-07): complete main verification"
          git push origin HEAD:work/m8-07-chinese-experience-governance
