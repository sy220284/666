name: M8-07 Format Artifact

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  format-artifact:
    if: github.event.pull_request.head.ref == 'work/m8-07-chinese-experience-governance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format current M8-07 failures with repository Prettier
        run: >-
          pnpm exec prettier --write
          scripts/ui-acceptance-gate.mjs
          apps/desktop/renderer/src/m8-07.css
          tests/unit/ui-acceptance-gate.test.ts
      - name: Verify formatted files
        run: >-
          pnpm exec prettier --check
          scripts/ui-acceptance-gate.mjs
          apps/desktop/renderer/src/m8-07.css
          tests/unit/ui-acceptance-gate.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m8-07-formatted-files
          path: |
            scripts/ui-acceptance-gate.mjs
            apps/desktop/renderer/src/m8-07.css
            tests/unit/ui-acceptance-gate.test.ts
          if-no-files-found: error
          retention-days: 1
