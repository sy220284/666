name: M8-07 Render State Once

on:
  push:
    branches:
      - work/m8-07-chinese-experience-governance
    paths:
      - .github/workflows/m8-07-render-state-once.yml

permissions:
  contents: read
  issues: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work/m8-07-chinese-experience-governance
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Render implemented transition
        run: |
          node scripts/taskctl.mjs advance --ci=success --commit=85832bb78ffd48a39e90ed4103f6eeca789c0bda
          node scripts/ui-acceptance-gate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m8-07-implemented-state
          path: |
            docs/tasks/ACTIVE_TASK.json
            docs/tasks/ACTIVE_TASK.md
            docs/tasks/TASK_INDEX.md
            docs/tasks/M8/M8-07_CHINESE_EXPERIENCE_GOVERNANCE.md
          if-no-files-found: error
          retention-days: 1
      - name: Report run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/244/comments -f body="M8-07 implemented-state artifact run: ${{ github.run_id }}"
