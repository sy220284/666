name: M8-07 Temporary Format

on:
  push:
    branches: [work/m8-07-chinese-experience-governance]

permissions:
  contents: write

concurrency:
  group: m8-07-temporary-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-07-chinese-experience-governance
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format M8-07 acceptance files
        run: >-
          pnpm exec prettier --write
          tests/e2e/m8-07-windows-ime.spec.ts
          tests/e2e/playwright.windows-ime.config.ts
          .github/workflows/quality.yml
      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/m8-07-windows-ime.spec.ts tests/e2e/playwright.windows-ime.config.ts .github/workflows/quality.yml
          git commit -m "style(M8-07): format Windows IME acceptance"
          git push origin HEAD:work/m8-07-chinese-experience-governance
