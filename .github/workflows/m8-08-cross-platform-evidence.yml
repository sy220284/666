name: M8-08 Linux Package Evidence Retry

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  package-linux:
    if: ${{ github.head_ref == 'work/m8-08-v1-final-governance-closure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - name: Build Linux portable package
        run: >-
          pnpm run package --
          --platform linux
          --version 1.0.0
          --output release/linux
      - name: Verify Linux package assets
        run: >-
          node scripts/verify-package-assets.mjs
          --platform linux
          --version 1.0.0
          --directory release/linux
      - name: Run Linux packaged startup with explicit CI sandbox fallback
        env:
          WORLDFORGE_PACKAGED_SMOKE_ALLOW_NO_SANDBOX: '1'
        run: >-
          xvfb-run -a node scripts/smoke-packaged-desktop.mjs
          --platform linux
          --directory release/linux
      - name: Write artifact inventory
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = 'release/linux';
          const files = [];
          const walk = (dir) => {
            for (const name of fs.readdirSync(dir).sort()) {
              const full = path.join(dir, name);
              const stat = fs.lstatSync(full);
              if (stat.isDirectory()) walk(full);
              else if (stat.isFile()) {
                const content = fs.readFileSync(full);
                files.push({ path: full.replaceAll('\\', '/'), bytes: content.byteLength, sha256: crypto.createHash('sha256').update(content).digest('hex') });
              }
            }
          };
          walk(root);
          fs.writeFileSync(path.join(root, 'artifact-manifest.json'), JSON.stringify({ platform: 'linux', version: '1.0.0', sourceHead: process.env.SOURCE_HEAD, files }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worldforge-v1-linux
          path: release/linux/
          if-no-files-found: error
          retention-days: 30
