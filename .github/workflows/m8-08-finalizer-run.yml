name: M8-08 Finalizer Runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'work/m8-08-v1-final-governance-closure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work/m8-08-v1-final-governance-closure
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate M8-08 Implemented state
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/run-m8-08-finalizer.cjs')
          text = path.read_text()
          text = text.replace(
              "await readFile(`docs/tasks/runtime/${taskId}.json`, 'utf8')",
              "await readFile('docs/tasks/runtime/' + taskId + '.json', 'utf8')",
          )
          text = text.replace(
              "await readFile(`docs/tasks/runtime/${name}`, 'utf8')",
              "await readFile('docs/tasks/runtime/' + name, 'utf8')",
          )
          path.write_text(text)
          PY
          node scripts/run-m8-08-finalizer.cjs
          git checkout -- scripts/run-m8-08-finalizer.cjs
      - name: Format generated state
        run: >-
          pnpm exec prettier --write
          .github/governance/verification-hold-taskctl.mjs
          docs/tasks/ACTIVE_TASK.json
          docs/tasks/runtime/M8-08.json
          docs/test-evidence/M8-08/manifest.json
      - name: Commit, validate, and push
        shell: bash
        env:
          TASK_PR_BODY: '<!-- worldforge-task: M8-08 -->'
          TASK_PR_HEAD_REF: work/m8-08-v1-final-governance-closure
          TASK_BASE_REF: origin/main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "governance(M8-08): record Implemented release evidence"
          node .github/governance/verification-hold-taskctl.mjs self-test
          pnpm task:validate
          node .github/governance/parallel-task-policy.mjs pr-policy
          node .github/governance/parallel-task-policy.mjs validate
          pnpm ci:evidence
          git push origin HEAD:work/m8-08-v1-final-governance-closure
