name: M8-08 Temporary Capability Restart

on:
  push:
    branches:
      - work/m8-08-v1-final-governance-closure
    paths:
      - .github/automation/m8-08-capability-restart.mjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work/m8-08-v1-final-governance-closure
          fetch-depth: 0
      - run: node .github/automation/m8-08-capability-restart.mjs
      - name: Commit capability and restart repairs
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "修复(M8-08)：统一能力入口与Core重启刷新"
          git push origin HEAD:work/m8-08-v1-final-governance-closure
