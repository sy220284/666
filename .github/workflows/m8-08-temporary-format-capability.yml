name: M8-08 Temporary Format Capability

on:
  push:
    branches:
      - work/m8-08-v1-final-governance-closure
    paths:
      - .github/automation/m8-08-format-capability.trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: work/m8-08-v1-final-governance-closure
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format capability and restart files
        run: >-
          pnpm exec prettier --write
          apps/desktop/renderer/src/app/app-shell-m3.tsx
          apps/desktop/renderer/src/features/home/home-page.tsx
          apps/desktop/renderer/src/react-entry.tsx
          apps/desktop/renderer/src/runtime/core-recovery-supervisor.ts
          tests/unit/app-shell-capability-actions.test.ts
          tests/unit/core-recovery-supervisor-branch-coverage.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "格式(M8-08)：统一能力与重启代码格式"
          git push origin HEAD:work/m8-08-v1-final-governance-closure
