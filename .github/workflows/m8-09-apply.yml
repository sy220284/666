name: M8-09 one-time stability apply
run-name: M8-09 apply for PR #258

on:
  push:
    branches:
      - work/m8-09-v1-stability-hardening
    paths:
      - scripts/apply-m8-09-v1-stability.mjs
      - .github/workflows/m8-09-apply.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - scripts/apply-m8-09-v1-stability.mjs
      - .github/workflows/m8-09-apply.yml

permissions:
  contents: write

concurrency:
  group: m8-09-one-time-apply
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'work/m8-09-v1-stability-hardening') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-09-v1-stability-hardening
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply deterministic M8-09 changes
        run: node scripts/apply-m8-09-v1-stability.mjs
      - name: Normalize focused test assertion
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'tests/unit/m8-09-v1-stability-invariants.test.ts';
          const before = "expect(content.match(/onChange={() => setPlan(null)}/gu)?.length).toBeGreaterThanOrEqual(3);";
          const after = "expect(content.split('onChange={() => setPlan(null)}').length - 1).toBeGreaterThanOrEqual(3);";
          const source = await readFile(file, 'utf8');
          if (!source.includes(before)) throw new Error('M8_09_FOCUSED_ASSERTION_ANCHOR_MISSING');
          await writeFile(file, source.replace(before, after), 'utf8');
          NODE
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Synchronize generated task mirror
        run: pnpm task:sync
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/desktop/main/src/electron-main.ts
          apps/desktop/main/src/ipc-handlers.ts
          apps/desktop/renderer/src/app/app-shell-m3.tsx
          apps/desktop/renderer/src/features/checks/search-panel.tsx
          apps/desktop/renderer/src/features/writing/writing-core-workbench.tsx
          apps/desktop/renderer/src/presentation/author-error-message.ts
          apps/desktop/renderer/src/react-entry.tsx
          apps/desktop/renderer/src/runtime/global-error-boundary.ts
          packages/core-service/src/project-workspace.ts
          tests/unit/m8-09-v1-stability-invariants.test.ts
          docs/PROJECT_EXECUTION_ENTRY.md
          docs/tasks/ACTIVE_TASK.json
          docs/tasks/ACTIVE_TASK.md
          docs/tasks/TASK_INDEX.md
          docs/tasks/M8/M8-09_V1_STABILITY_HARDENING.md
          docs/tasks/runtime/M8-09.json
          docs/test-evidence/M8-09/manifest.json
          docs/test-evidence/M8-09/summary.md
          docs/test-evidence/M8-09/known-risks.md
      - name: Validate task and boundaries
        run: |
          pnpm task:validate
          pnpm check:workspaces
          pnpm check:boundaries
          pnpm check:language
          pnpm format:check
      - name: Static verification
        run: |
          pnpm lint
          pnpm typecheck
      - name: Focused regression verification
        run: pnpm exec vitest run tests/unit/m8-09-v1-stability-invariants.test.ts
      - name: Integration verification
        run: pnpm test:integration
      - name: Build verification
        run: pnpm build
      - name: Commit verified implementation
        env:
          BRANCH: work/m8-09-v1-stability-hardening
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "M8-09：修复V1.0数据安全与生命周期问题"
          git push origin "HEAD:$BRANCH"
