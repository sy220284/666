name: M8-09 Bootstrap

on:
  push:
    branches:
      - work/m8-09-v1-stability-remediation
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: m8-09-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[m8-09-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work/m8-09-v1-stability-remediation
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Correct bootstrap anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/m8-09-apply.py')
          source = path.read_text(encoding='utf-8')
          needle = 'replace_exact_count(workspace, registration_block, registration_replacement, 2)'
          replacement = r'''replace_exact_count(workspace, registration_block, registration_replacement, 1)

          regex_once(
              workspace,
              r"      try \{\n        await this\.\#recentProjects\.register\(requestId, \{\n          projectId: context\.summary\.projectId,\n          workspacePath: context\.summary\.workspacePath,\n          displayName: context\.summary\.name,\n        \}\);\n      \} catch \(error\) \{\n        await this\.\#closeContext\(context\);\n        throw error;\n      \}\n      this\.\#active = context;",
              "      await this.#registerRecentBestEffort(requestId, context.summary);\\n      this.#active = context;",
          )'''
          if source.count(needle) != 1:
              raise SystemExit('bootstrap anchor not found')
          path.write_text(source.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Apply M8-09 remediation
        run: python3 scripts/m8-09-apply.py
      - name: Complete guarded workspace attention refresh
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('apps/desktop/renderer/src/app/app-shell-m3.tsx')
          source = path.read_text(encoding='utf-8')

          ref_anchor = "  const initialWorkspaceResolved = useRef(false);\n"
          if source.count(ref_anchor) != 1:
              raise SystemExit('workspace attention ref anchor not found')
          source = source.replace(
              ref_anchor,
              ref_anchor + "  const workspaceAttentionGeneration = useRef(0);\n",
              1,
          )

          new = """  const refreshWorkspaceAttention = useCallback(async (): Promise<void> => {
            const generation = workspaceAttentionGeneration.current + 1;
            workspaceAttentionGeneration.current = generation;
            const projectId = activeProject?.projectId ?? null;
            if (!projectId) {
              setWorkspaceAttention(EMPTY_WORKSPACE_ATTENTION);
              return;
            }
            const next = await loadWorkspaceAttention(bridge, projectId);
            if (
              workspaceAttentionGeneration.current === generation &&
              activeProject?.projectId === projectId
            ) {
              setWorkspaceAttention(next);
            }
          }, [activeProject, bridge]);

          useEffect(() => {
            void refreshWorkspaceAttention();
            return () => {
              workspaceAttentionGeneration.current += 1;
            };
          }, [refreshWorkspaceAttention, route, tasks]);"""
          pattern = re.compile(
              r"  useEffect\(\(\) => \{\s+let active = true;.*?\n  \}, \[activeProject, bridge, route, tasks\]\);",
              re.S,
          )
          source, count = pattern.subn(new, source, count=1)
          if count != 1:
              raise SystemExit('generated workspace attention block not found')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          apps/desktop/renderer/src/features/writing/writing-core-workbench.tsx
          apps/desktop/renderer/src/app/app-shell-m3.tsx
          apps/desktop/renderer/src/features/checks/search-panel.tsx
          apps/desktop/renderer/src/presentation/author-error-message.ts
          apps/desktop/renderer/src/react-entry.tsx
          apps/desktop/main/src/electron-main.ts
          apps/desktop/main/src/ipc-handlers.ts
          packages/core-service/src/project-workspace.ts
          tests/unit/v1-stability-remediation.test.ts
          docs/tasks/runtime/M8-09.json
      - name: Validate task and language
        run: |
          node .github/governance/parallel-task-policy.mjs self-test
          pnpm check:language
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee m8-09-unit.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload unit diagnostics
        if: steps.unit.outputs.status != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m8-09-unit-diagnostics
          path: m8-09-unit.log
          if-no-files-found: error
          retention-days: 7
      - name: Stop after unit failure
        if: steps.unit.outputs.status != '0'
        run: exit 1
      - name: Integration tests
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee m8-09-integration.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload integration diagnostics
        if: steps.integration.outputs.status != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m8-09-integration-diagnostics
          path: m8-09-integration.log
          if-no-files-found: error
          retention-days: 7
      - name: Stop after integration failure
        if: steps.integration.outputs.status != '0'
        run: exit 1
      - name: Remove bootstrap files
        run: rm scripts/m8-09-apply.py .github/workflows/m8-09-bootstrap.yml
      - name: Commit generated remediation
        env:
          BRANCH: work/m8-09-v1-stability-remediation
        run: |
          git config user.name "worldforge-governance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M8-09：修复V1.0数据安全与生命周期问题 [m8-09-generated]"
          git push origin "HEAD:$BRANCH"
