name: M9-02 Fix Final Contracts

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: m9-02-final-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: >-
      github.event.pull_request.head.ref == 'work/m9-02-shared-structure' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply deterministic final fixes
        run: node scripts/m9-02-fix-final-contracts.mjs
      - name: Format changed files
        run: pnpm format
      - name: Validate lint and structure
        run: |
          pnpm lint
          pnpm check:boundaries
      - name: Run affected unit tests
        run: >-
          pnpm exec vitest run
          tests/unit/renderer-m3-09-workbenches.test.ts
          tests/unit/shared-structure-boundary.test.ts
      - name: Remove one-time tooling
        run: |
          rm scripts/m9-02-fix-final-contracts.mjs
          rm .github/workflows/m9-02-fix-final-contracts.yml
      - name: Commit final corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "修复：收敛Shared Structure最终合同"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
