name: Main Verification

run-name: Main Verification ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit SHA produced by the controlled merge
        required: true
        type: string
      source_pr:
        description: Pull request number that produced the main commit
        required: true
        type: string
      source_head_sha:
        description: Pull request head SHA whose permanent checks passed
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: main-verification-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  validate-main:
    name: validate-main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SOURCE_PR: ${{ inputs.source_pr }}
      SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Assert clean final main checkout
        run: node .github/governance/assert-clean-tree.mjs
      - name: Verify final main provenance, source checks and tree identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/main-verification.mjs
      - name: Assert main provenance validation did not mutate tracked files
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  main-verification:
    name: main-verification
    if: always()
    needs: validate-main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SOURCE_PR: ${{ inputs.source_pr }}
      SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
      VALIDATE_RESULT: ${{ needs.validate-main.result }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Assert clean status publisher checkout
        run: node .github/governance/assert-clean-tree.mjs
      - name: Publish final main verification status
        run: node scripts/main-verification.mjs publish-status
      - name: Assert status publication did not mutate tracked files
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  synchronize-work:
    name: synchronize-integrations
    needs: main-verification
    if: ${{ needs.main-verification.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Self-test integration synchronization guards
        run: node .github/governance/work-synchronization.mjs self-test
      - name: Synchronize idle integration branches to verified main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_SYNCHRONIZATION_OUTPUT: artifacts/integration-synchronization
        run: node .github/governance/work-synchronization.mjs
      - name: Upload integration synchronization report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-synchronization-${{ inputs.expected_sha }}
          path: artifacts/integration-synchronization/
          if-no-files-found: error
          retention-days: 30
