name: Performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: performance-route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine performance validation route
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          FULL_VALIDATION_DRAFT: ${{ contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->') }}
        run: |
          set -euo pipefail
          run=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            run=true
          elif [ "$PR_DRAFT" = true ] && [ "$FULL_VALIDATION_DRAFT" != true ]; then
            echo "Performance and AI evaluation are deferred until Ready or the exact full-validation-draft marker."
          else
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            if [ -z "$changed_files" ]; then
              run=true
            else
              run="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs performance)"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  performance:
    name: performance
    needs: route
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Document deferred or non-runtime performance route
        if: ${{ needs.route.outputs.run != 'true' }}
        run: |
          echo "Performance and AI evaluation are skipped because no runtime, dependency or performance-authority input changed."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ needs.route.outputs.run == 'true' }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ needs.route.outputs.run == 'true' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ needs.route.outputs.run == 'true' }}
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ needs.route.outputs.run == 'true' }}
      - run: pnpm test:prepare
        if: ${{ needs.route.outputs.run == 'true' }}
      - name: Run performance budgets
        env:
          PERFORMANCE_ROUTE_ENABLED: ${{ needs.route.outputs.run }}
          WORLDFORGE_M8_PERF_OUTPUT: test-results/performance/m8-02.json
        run: |
          set -euo pipefail
          if [ "$PERFORMANCE_ROUTE_ENABLED" != true ]; then
            echo "Performance budgets are not applicable to this change."
            exit 0
          fi
          mkdir -p test-results/ci test-results/performance
          set -o pipefail
          pnpm exec vitest run tests/performance --no-file-parallelism --retry=1 2>&1 | tee test-results/ci/performance.log
          test -s test-results/performance/m8-02.json
      - name: Run AI protocol baselines
        if: ${{ needs.route.outputs.run == 'true' }}
        run: |
          set -o pipefail
          pnpm exec vitest run \
            tests/performance/ai-output-protocol.test.ts \
            tests/performance/ai-eval-baseline.test.ts \
            2>&1 | tee test-results/ci/ai-eval.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && needs.route.outputs.run == 'true' }}
        with:
          name: performance-and-ai-eval-evidence
          path: |
            test-results/ci/performance.log
            test-results/ci/ai-eval.log
            test-results/performance/
          if-no-files-found: error
          retention-days: 14
