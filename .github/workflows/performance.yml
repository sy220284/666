name: Performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  performance:
    name: performance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine performance validation route
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          run=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            run=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            if [ -z "$changed_files" ] || printf '%s\n' "$changed_files" | grep -Eqv '^(docs/|.*\.md$)'; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          node-version: 24
          cache: pnpm
      - name: Assert clean working tree before performance validation
        if: ${{ steps.route.outputs.run == 'true' }}
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ steps.route.outputs.run == 'true' }}
      - name: Run performance budgets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.route.outputs.run }}" != true ]; then
            echo "Performance suite skipped: only documentation changed."
            exit 0
          fi
          mkdir -p test-results/ci
          set -o pipefail
          pnpm test:perf 2>&1 | tee test-results/ci/performance.log
      - name: Assert clean working tree after performance validation
        if: ${{ always() && steps.route.outputs.run == 'true' }}
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload performance diagnostics
        if: ${{ failure() && steps.route.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-diagnostics
          path: |
            test-results/ci/performance.log
            test-results/performance/
          if-no-files-found: warn
          retention-days: 7
