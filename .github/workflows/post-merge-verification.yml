name: Post Merge Verification Dispatcher

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: post-merge-verification-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Assert clean trusted main checkout
        run: node .github/governance/assert-clean-tree.mjs
      - name: Idempotently schedule Main Verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/governance/post-merge-verification.mjs
      - name: Assert dispatcher did not mutate tracked files
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
