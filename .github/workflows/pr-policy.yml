name: PR Policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TASK_BASE_REF: ${{ github.event.pull_request.base.sha }}
      TASK_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      TASK_EVENT_NAME: pull_request_target
      TASK_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      TASK_PR_DRAFT: ${{ github.event.pull_request.draft }}
      TASK_PR_READY: ${{ github.event.pull_request.draft == false }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate tree without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate pull request shape with trusted policy
        working-directory: candidate
        run: node ../trusted/.github/governance/single-work-policy.mjs validate
      - name: Validate candidate automation inventory with trusted policy
        working-directory: candidate
        run: node ../trusted/.github/governance/automation-layout-policy.mjs
      - name: Validate candidate CI policy with trusted policy
        working-directory: candidate
        run: node ../trusted/scripts/ci-policy.mjs
      - name: Self-test trusted merge policy
        working-directory: candidate
        run: node ../trusted/.github/governance/pr-policy-self-test.mjs
      - name: Publish trusted PR policy status
        if: always()
        env:
          POLICY_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const state = process.env.POLICY_RESULT === 'success' ? 'success' : 'failure';
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.CANDIDATE_SHA}`,
            {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({
                state,
                context: 'pr-policy',
                description:
                  state === 'success'
                    ? 'Trusted main policy accepted the candidate'
                    : 'Trusted main policy rejected the candidate',
                target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              }),
            },
          );
          if (!response.ok) throw new Error(`Unable to publish pr-policy status: ${response.status}`);
          NODE
