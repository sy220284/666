name: PR Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TASK_BASE_REF: ${{ github.event.pull_request.base.sha }}
      TASK_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      TASK_EVENT_NAME: pull_request
      TASK_PR_HEAD_REF: ${{ github.head_ref }}
      TASK_PR_DRAFT: ${{ github.event.pull_request.draft }}
      TASK_PR_READY: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply M10-07 locked formatter Artifact
        if: github.actor != 'github-actions[bot]'
        env:
          ARTIFACT_ID: '8892991829'
          ARTIFACT_SHA256: '6b1b1f37c200e56c886ef2de77e0222abe2b3fc9bbdd8ce97290d35e748bd2e8'
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/worldforge-formatter.zip"
          toolchain="$RUNNER_TEMP/worldforge-formatter"
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive"
          echo "$ARTIFACT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$toolchain"
          unzip -q "$archive" -d "$toolchain"
          (
            cd "$toolchain"
            sha256sum --check --strict SHA256SUMS.txt
          )
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');const m=JSON.parse(fs.readFileSync('$toolchain/manifest.json','utf8'));const h=crypto.createHash('sha256').update(fs.readFileSync('pnpm-lock.yaml')).digest('hex');if(m.profile!=='formatter'||m.toolVersions.prettier!=='3.9.5'||m.rootLockfileSha256!==h)process.exit(1)"
          prettier="$toolchain/node_modules/prettier/bin/prettier.cjs"
          test "$(node "$prettier" --version)" = '3.9.5'
          targets=(
            apps/desktop/renderer/src/features/writing/version-panel.tsx
            packages/contracts/src/version.ts
            packages/core-service/src/candidate-apply.ts
            packages/core-service/src/candidate-integrity.ts
            packages/core-service/src/candidate-state.ts
            packages/core-service/src/draft-lock-guard.ts
            packages/core-service/src/draft/draft-model.ts
            packages/core-service/src/generation-runtime.ts
            packages/core-service/src/import-export/import-export-model.ts
            packages/core-service/src/recovery/backup-manifest.ts
            packages/core-service/src/search/replace-apply.ts
            packages/core-service/src/search/search-model.ts
            packages/core-service/src/stable-json.ts
            packages/core-service/src/version.ts
            tests/integration/m10-07-candidate-undo-invariant.test.ts
            tests/integration/m10-07-search-replace-revision.test.ts
            tests/integration/version-service.test.ts
            tests/unit/search-model-secondary-error.test.ts
            tests/unit/stable-json.test.ts
          )
          node "$prettier" --config prettier.config.mjs --write "${targets[@]}"
          node "$prettier" --config prettier.config.mjs --check \
            'scripts/**/*.mjs' \
            'apps/**/*.{ts,json,mjs,html,css}' \
            'packages/**/*.{ts,json}' \
            'tests/**/*.ts' \
            'evals/**/*.{json,yaml,yml}' \
            '.github/**/*.{yaml,yml,json,md}' \
            '*.{json,yaml,yml,mjs,ts}'
          if git diff --quiet; then
            echo 'Locked formatter produced no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "${targets[@]}"
          git commit -m '格式：应用工作流锁定Prettier结果'
          git push origin HEAD:work
      - name: Assert clean working tree before policy validation
        run: node .github/governance/assert-clean-tree.mjs
      - name: Validate unique work pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/governance/single-work-policy.mjs validate
      - name: Validate permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Validate permanent CI policy
        run: pnpm ci:policy
      - name: Smoke test changed toolchain exporters
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$TASK_BASE_REF" HEAD)"
          if ! printf '%s\n' "$changed_files" | grep -Eq '^\.github/(governance/toolchain-bundle\.mjs|workflows/toolchain-export\.yml)$'; then
            echo "Toolchain exporter unchanged; smoke test skipped."
            exit 0
          fi
          source_sha="$(git rev-parse HEAD)"
          for profile in formatter quality; do
            node .github/governance/toolchain-bundle.mjs export \
              --profile "$profile" \
              --source-sha "$source_sha" \
              --output "$RUNNER_TEMP/toolchain-$profile"
          done
      - name: Upload formatter toolchain smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolchain-formatter-smoke-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/toolchain-formatter/
          if-no-files-found: ignore
          retention-days: 1
      - name: Reject tracked root scratch artifacts
        run: test ! -e tmp
      - name: Self-test permanent work policy
        run: |
          node .github/governance/single-work-policy.mjs self-test
          node .github/governance/automerge-base-gate.mjs self-test
          node .github/governance/pr-policy-self-test.mjs
      - name: Assert clean working tree after policy validation
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
