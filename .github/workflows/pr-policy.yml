name: PR Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TASK_BASE_REF: ${{ github.event.pull_request.base.sha }}
      TASK_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      TASK_EVENT_NAME: pull_request
      TASK_PR_HEAD_REF: ${{ github.head_ref }}
      TASK_PR_DRAFT: ${{ github.event.pull_request.draft }}
      TASK_PR_READY: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Assert clean working tree before policy validation
        run: node .github/governance/assert-clean-tree.mjs
      - name: Validate unique work pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/governance/single-work-policy.mjs validate
      - name: Validate permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Validate permanent CI policy
        run: pnpm ci:policy
      - name: Smoke test changed toolchain exporters
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$TASK_BASE_REF" HEAD)"
          if ! printf '%s\n' "$changed_files" | grep -Eq '^\.github/(governance/toolchain-bundle\.mjs|workflows/toolchain-export\.yml)$'; then
            echo "Toolchain exporter unchanged; smoke test skipped."
            exit 0
          fi
          source_sha="$(git rev-parse HEAD)"
          for profile in formatter quality; do
            node .github/governance/toolchain-bundle.mjs export \
              --profile "$profile" \
              --source-sha "$source_sha" \
              --output "$RUNNER_TEMP/toolchain-$profile"
          done
      - name: Upload formatter toolchain smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolchain-formatter-smoke-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/toolchain-formatter/
          if-no-files-found: ignore
          retention-days: 1
      - name: Reject tracked root scratch artifacts
        run: test ! -e tmp
      - name: Self-test permanent work policy
        run: |
          node .github/governance/single-work-policy.mjs self-test
          node .github/governance/automerge-base-gate.mjs self-test
          node .github/governance/pr-policy-self-test.mjs
      - name: Assert clean working tree after policy validation
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
