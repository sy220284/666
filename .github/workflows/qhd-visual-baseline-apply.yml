name: QHD Visual Baseline Apply

on:
  push:
    branches: [work]

permissions:
  actions: read
  contents: write

concurrency:
  group: qhd-visual-baseline-apply
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
      - name: Download QHD source witness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 9237369963
          path: /tmp/qhd-source
          github-token: ${{ github.token }}
          repository: sy220284/666
          run-id: 31849374107
      - name: Download QHD stability witness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 9237733370
          path: /tmp/qhd-witness
          github-token: ${{ github.token }}
          repository: sy220284/666
          run-id: 31850697040
      - name: Verify and apply independently witnessed QHD baselines
        shell: bash
        run: |
          set -euo pipefail

          apply_baseline() {
            local snapshot="$1"
            local expected="$2"
            local source witness source_sha witness_sha
            source="$(find /tmp/qhd-source -type f -name "${snapshot}.actual.png" -print -quit)"
            witness="$(find /tmp/qhd-witness -type f -name "${snapshot}.actual.png" -print -quit)"
            test -n "$source"
            test -n "$witness"
            source_sha="$(sha256sum "$source" | awk '{print $1}')"
            witness_sha="$(sha256sum "$witness" | awk '{print $1}')"
            test "$source_sha" = "$expected"
            test "$witness_sha" = "$expected"
            cmp -s "$source" "$witness"
            cp "$source" "tests/e2e/visual-baselines/$snapshot"
          }

          apply_baseline 'theme-a-light-2560x1440.png' 'b7fabb43ae8f189fec176490d1e48fe03f962ddd5b747f5f01d1e26d3554550b'
          apply_baseline 'theme-a-dark-2560x1440.png' '82c1e46f46ad1fde89f0144463e8ed03e5440e12e1e4f6e9b29c7140d76dd3d0'
          apply_baseline 'theme-b-light-2560x1440.png' '012a4bab50d0052c5bdafc3d0c4c3b700204620c3821c0c4e466ec3f28309e07'
          apply_baseline 'theme-b-dark-2560x1440.png' 'e68073a464c3f6cb9083bbbf3f191a1dadb4f02c8caba2954555e8741701cd91'

          rm -f \
            tests/e2e/visual-baselines/theme-a-light-1280x800.png \
            tests/e2e/visual-baselines/theme-a-dark-1280x800.png \
            tests/e2e/visual-baselines/theme-b-light-1280x800.png \
            tests/e2e/visual-baselines/theme-b-dark-1280x800.png

          python3 - <<'PY'
          from pathlib import Path
          import json
          import struct

          baselines = [
              ('theme-a-light-2560x1440.png', 'b7fabb43ae8f189fec176490d1e48fe03f962ddd5b747f5f01d1e26d3554550b'),
              ('theme-a-dark-2560x1440.png', '82c1e46f46ad1fde89f0144463e8ed03e5440e12e1e4f6e9b29c7140d76dd3d0'),
              ('theme-b-light-2560x1440.png', '012a4bab50d0052c5bdafc3d0c4c3b700204620c3821c0c4e466ec3f28309e07'),
              ('theme-b-dark-2560x1440.png', 'e68073a464c3f6cb9083bbbf3f191a1dadb4f02c8caba2954555e8741701cd91'),
          ]
          root = Path('tests/e2e/visual-baselines')
          for name, _ in baselines:
              data = (root / name).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: invalid PNG signature')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (2560, 1440):
                  raise SystemExit(f'{name}: unexpected dimensions {(width, height)}')

          manifest = {
              'schemaVersion': 1,
              'platform': 'linux',
              'source': {
                  'verifiedHead': '728d9e3ae46e9c44b0976503dadda8ab02e65e28',
                  'qualityRunId': 31849374107,
                  'artifactId': 9237369963,
                  'artifactDigest': 'sha256:e3d9ea092a1a28c8c845bc5a01a51d10dfc87c8687950014fa00dc584dd13d40',
              },
              'stabilityWitness': {
                  'verifiedHead': '1fda30b2736cc51394b3afacd0fbb810cd567d03',
                  'qualityRunId': 31850697040,
                  'artifactId': 9237733370,
                  'artifactDigest': 'sha256:6669f11e6a633a4d4d60f39c280fed0b7979f0db8fc3600b072f3bb1690aa79d',
              },
              'baselines': [
                  {'snapshotName': name, 'sha256': digest, 'width': 2560, 'height': 1440}
                  for name, digest in baselines
              ],
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          path = Path('tests/e2e/m8-07-chinese-experience.spec.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "test('M8-07中文作者体验视觉与1280×800布局矩阵'": "test('M8-07中文作者体验视觉与QHD布局矩阵'",
              'await setViewport(application, 1280, 800);': 'await setViewport(application, 2560, 1440);',
              'theme-a-light-1280x800.png': 'theme-a-light-2560x1440.png',
              'theme-a-dark-1280x800.png': 'theme-a-dark-2560x1440.png',
              'theme-b-light-1280x800.png': 'theme-b-light-2560x1440.png',
              'theme-b-dark-1280x800.png': 'theme-b-dark-2560x1440.png',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'M8-07 expected one match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          sha256sum tests/e2e/visual-baselines/*2560x1440.png
          git rm .github/workflows/qhd-visual-baseline-apply.yml
          git add tests/e2e/visual-baselines tests/e2e/m8-07-chinese-experience.spec.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(display): accept witnessed QHD visual baselines'
          git push origin HEAD:work
