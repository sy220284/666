name: Quality Core

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit SHA or ref to validate
        required: false
        type: string
        default: ''
      draft_mode:
        description: Run only static checks for draft pull requests
        required: false
        type: boolean
        default: false
      full_suite:
        description: Run product tests, Electron E2E and build for code-bearing Ready PRs
        required: false
        type: boolean
        default: true
      package_smoke:
        description: Run the Linux package smoke job
        required: false
        type: boolean
        default: true
      security_suite:
        description: Run application security tests inside the reusable release gate
        required: false
        type: boolean
        default: false
      performance_eval:
        description: Run performance baselines inside the reusable release gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: true

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before static checks
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate active task and mirror
        run: pnpm task:validate
      - run: pnpm check:workspaces
      - run: pnpm check:boundaries
      - name: Check formatting
        shell: bash
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          pnpm format:check 2>&1 | tee test-results/ci/format-check.log
      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee test-results/ci/lint.log
      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee test-results/ci/typecheck.log
      - name: Assert clean working tree after static checks
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload static diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-check-diagnostics
          path: test-results/ci/
          if-no-files-found: warn
          retention-days: 7

  product-tests:
    name: product-tests
    if: ${{ inputs.draft_mode == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Skip product tests for documentation-only Ready PR
        if: ${{ inputs.full_suite == false }}
        run: echo "Product tests are not required because only Markdown or docs/ files changed."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ inputs.full_suite }}
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ inputs.full_suite }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ inputs.full_suite }}
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before product tests
        if: ${{ inputs.full_suite }}
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ inputs.full_suite }}
      - run: pnpm test:prepare
        if: ${{ inputs.full_suite }}
      - name: Run unit tests
        if: ${{ inputs.full_suite }}
        shell: bash
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          pnpm exec vitest run tests/unit 2>&1 | tee test-results/ci/unit.log
      - name: Run integration tests
        if: ${{ inputs.full_suite }}
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run tests/integration 2>&1 | tee test-results/ci/integration.log
      - name: Run migration tests
        if: ${{ inputs.full_suite }}
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run tests/migration 2>&1 | tee test-results/ci/migration.log
      - name: Run product source coverage threshold
        if: ${{ inputs.full_suite }}
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --config vitest.coverage.config.ts 2>&1 | tee test-results/ci/coverage.log
      - name: Assert clean working tree after product tests
        if: ${{ always() && inputs.full_suite }}
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload product test diagnostics and coverage
        if: ${{ always() && inputs.full_suite }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-tests-and-coverage
          path: |
            test-results/ci/unit.log
            test-results/ci/integration.log
            test-results/ci/migration.log
            test-results/ci/coverage.log
            test-results/unit/
            test-results/integration/
            test-results/migration/
            coverage/
          if-no-files-found: warn
          retention-days: 7

  tests:
    name: tests-${{ matrix.suite }}
    if: ${{ always() && inputs.draft_mode == false }}
    needs: product-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, migration]
    steps:
      - name: Enforce consolidated product test result
        shell: bash
        env:
          FULL_SUITE: ${{ inputs.full_suite }}
          PRODUCT_TEST_RESULT: ${{ needs.product-tests.result }}
        run: |
          set -euo pipefail
          echo "${{ matrix.suite }} is covered by the consolidated product-tests job."
          if [ "$FULL_SUITE" = true ]; then
            test "$PRODUCT_TEST_RESULT" = success
          else
            case "$PRODUCT_TEST_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi

  coverage:
    name: coverage
    if: ${{ always() && inputs.draft_mode == false }}
    needs: product-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce consolidated coverage result
        shell: bash
        env:
          FULL_SUITE: ${{ inputs.full_suite }}
          PRODUCT_TEST_RESULT: ${{ needs.product-tests.result }}
        run: |
          set -euo pipefail
          echo "Coverage is produced by the consolidated product-tests job."
          if [ "$FULL_SUITE" = true ]; then
            test "$PRODUCT_TEST_RESULT" = success
          else
            case "$PRODUCT_TEST_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi

  security-tests:
    name: security-tests
    if: ${{ inputs.draft_mode == false && inputs.security_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before security suite
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:prepare
      - name: Run application security tests
        shell: bash
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          pnpm test:security 2>&1 | tee test-results/ci/security.log
      - name: Assert clean working tree after security suite
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload security diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-security-diagnostics
          path: |
            test-results/ci/security.log
            test-results/security/
          if-no-files-found: warn
          retention-days: 7

  performance-eval:
    name: performance-eval
    if: ${{ inputs.draft_mode == false && inputs.performance_eval }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before performance suite
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run performance and AI protocol baselines
        shell: bash
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          pnpm test:perf 2>&1 | tee test-results/ci/performance-eval.log
      - name: Assert clean working tree after performance suite
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload performance and eval diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-performance-eval-diagnostics
          path: |
            test-results/ci/performance-eval.log
            test-results/performance/
          if-no-files-found: warn
          retention-days: 7

  desktop-e2e:
    name: desktop-e2e
    if: ${{ inputs.draft_mode == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Skip Electron E2E for documentation-only Ready PR
        if: ${{ inputs.full_suite == false }}
        run: echo "Electron E2E is not required because only Markdown or docs/ files changed."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ inputs.full_suite }}
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ inputs.full_suite }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ inputs.full_suite }}
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before desktop E2E
        if: ${{ inputs.full_suite }}
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ inputs.full_suite }}
      - name: Install Electron display dependencies
        if: ${{ inputs.full_suite }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb
          fc-match "Noto Serif CJK SC"
      - name: Run Electron E2E and capture diagnostics
        if: ${{ inputs.full_suite }}
        shell: bash
        env:
          WORLDFORGE_E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/electron
          WORLDFORGE_CAPTURE_MATRIX_DIR: ${{ github.workspace }}/test-results/display-matrix
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          pnpm test:e2e 2>&1 | tee test-results/ci/desktop-e2e.log
      - name: Assert clean working tree after desktop E2E
        if: ${{ always() && inputs.full_suite }}
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload Electron and display evidence
        if: ${{ always() && inputs.full_suite }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-e2e-evidence
          path: |
            test-results/ci/desktop-e2e.log
            test-results/electron/
            test-results/display-matrix/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: build
    if: ${{ always() && inputs.draft_mode == false }}
    needs: desktop-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce build performed by Electron E2E
        shell: bash
        env:
          FULL_SUITE: ${{ inputs.full_suite }}
          E2E_RESULT: ${{ needs.desktop-e2e.result }}
        run: |
          set -euo pipefail
          echo "The Electron E2E command performs the full workspace build."
          if [ "$FULL_SUITE" = true ]; then
            test "$E2E_RESULT" = success
          else
            case "$E2E_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi

  package-smoke:
    name: package-smoke-${{ matrix.platform }}
    if: ${{ inputs.draft_mode == false && inputs.package_smoke }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before package smoke
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb
      - name: Build and package desktop
        shell: bash
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          pnpm build 2>&1 | tee test-results/ci/package-smoke.log
          package_version="$(node -p "require('./package.json').version")"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          pnpm run package -- \
            --platform "${{ matrix.platform }}" \
            --version "$package_version" \
            --output "release/${{ matrix.platform }}" \
            2>&1 | tee -a test-results/ci/package-smoke.log
          node scripts/verify-package-assets.mjs \
            --platform "${{ matrix.platform }}" \
            --version "$package_version" \
            --directory "release/${{ matrix.platform }}" \
            2>&1 | tee -a test-results/ci/package-smoke.log
      - name: Run Linux packaged startup smoke with explicit CI sandbox fallback
        if: matrix.platform == 'linux'
        env:
          WORLDFORGE_PACKAGED_SMOKE_ALLOW_NO_SANDBOX: '1'
        run: >-
          xvfb-run -a node scripts/smoke-packaged-desktop.mjs
          --platform "${{ matrix.platform }}"
          --directory "release/${{ matrix.platform }}"
      - name: Run packaged startup smoke
        if: matrix.platform != 'linux'
        run: >-
          node scripts/smoke-packaged-desktop.mjs
          --platform "${{ matrix.platform }}"
          --directory "release/${{ matrix.platform }}"
      - name: Assert clean working tree after package smoke
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload package smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-smoke-${{ matrix.platform }}
          path: |
            test-results/ci/package-smoke.log
            release/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: quality
    if: always()
    needs:
      - static-checks
      - tests
      - coverage
      - security-tests
      - performance-eval
      - desktop-e2e
      - build
      - package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DRAFT_MODE: ${{ inputs.draft_mode }}
      PACKAGE_REQUIRED: ${{ inputs.package_smoke }}
      SECURITY_REQUIRED: ${{ inputs.security_suite }}
      PERFORMANCE_REQUIRED: ${{ inputs.performance_eval }}
      STATIC_RESULT: ${{ needs.static-checks.result }}
      TEST_RESULT: ${{ needs.tests.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      SECURITY_RESULT: ${{ needs.security-tests.result }}
      PERFORMANCE_RESULT: ${{ needs.performance-eval.result }}
      E2E_RESULT: ${{ needs.desktop-e2e.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      PACKAGE_RESULT: ${{ needs.package-smoke.result }}
    steps:
      - name: Enforce aggregate quality result
        shell: bash
        run: |
          set -euo pipefail
          printf 'draft=%s\nstatic=%s\ntests=%s\ncoverage=%s\nsecurity=%s\nperformance=%s\ne2e=%s\nbuild=%s\npackage=%s\n' \
            "$DRAFT_MODE" "$STATIC_RESULT" "$TEST_RESULT" "$COVERAGE_RESULT" \
            "$SECURITY_RESULT" "$PERFORMANCE_RESULT" "$E2E_RESULT" "$BUILD_RESULT" "$PACKAGE_RESULT"
          test "$STATIC_RESULT" = success
          if [ "$DRAFT_MODE" = true ]; then
            for result in "$TEST_RESULT" "$COVERAGE_RESULT" "$SECURITY_RESULT" \
              "$PERFORMANCE_RESULT" "$E2E_RESULT" "$BUILD_RESULT" "$PACKAGE_RESULT"; do
              case "$result" in
                success|skipped) ;;
                *) exit 1 ;;
              esac
            done
            exit 0
          fi

          for result in "$TEST_RESULT" "$COVERAGE_RESULT" "$E2E_RESULT" "$BUILD_RESULT"; do
            test "$result" = success
          done

          require_optional_job() {
            required="$1"
            result="$2"
            label="$3"
            if [ "$required" = true ]; then
              test "$result" = success || {
                echo "$label was enabled but did not succeed: $result" >&2
                exit 1
              }
              return
            fi
            case "$result" in
              success|skipped) ;;
              *)
                echo "$label produced an invalid disabled result: $result" >&2
                exit 1
                ;;
            esac
          }

          require_optional_job "$SECURITY_REQUIRED" "$SECURITY_RESULT" security-tests
          require_optional_job "$PERFORMANCE_REQUIRED" "$PERFORMANCE_RESULT" performance-eval
          require_optional_job "$PACKAGE_REQUIRED" "$PACKAGE_RESULT" package-smoke
