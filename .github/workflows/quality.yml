name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_suite: ${{ steps.route.outputs.full_suite }}
      package_smoke: ${{ steps.route.outputs.package_smoke }}
      toolchain_export: ${{ steps.route.outputs.toolchain_export }}
      reliability: ${{ steps.route.outputs.reliability }}
      windows_ime: ${{ steps.route.outputs.windows_ime }}
      platform_experience: ${{ steps.route.outputs.platform_experience }}
      release_audit: ${{ steps.route.outputs.release_audit }}
      reuse_quality: ${{ steps.closure.outputs.reuse_quality }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect reusable frozen implementation Quality
        id: closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ready-closure-route.mjs
      - name: Determine PR quality route from unified risk plan
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REUSE_QUALITY: ${{ steps.closure.outputs.reuse_quality }}
        run: |
          set -euo pipefail
          full_suite=false
          package_smoke=false
          toolchain_export=false
          reliability=false
          windows_ime=false
          platform_experience=false
          release_audit=false
          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          if [ "$REUSE_QUALITY" = true ]; then
            echo "Frozen implementation already has a complete Quality run; validating only closure and governance scope."
          else
            full_suite="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs full-suite)"
            package_smoke="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs package-smoke)"
            reliability="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs reliability)"
            windows_ime="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs windows-ime)"
            platform_experience="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs platform-experience)"
          fi
          toolchain_export="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs toolchain-export)"
          release_audit="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs release-audit)"
          echo "full_suite=$full_suite" >> "$GITHUB_OUTPUT"
          echo "package_smoke=$package_smoke" >> "$GITHUB_OUTPUT"
          echo "toolchain_export=$toolchain_export" >> "$GITHUB_OUTPUT"
          echo "reliability=$reliability" >> "$GITHUB_OUTPUT"
          echo "windows_ime=$windows_ime" >> "$GITHUB_OUTPUT"
          echo "platform_experience=$platform_experience" >> "$GITHUB_OUTPUT"
          echo "release_audit=$release_audit" >> "$GITHUB_OUTPUT"
          echo "PR risk plan: full suite=$full_suite; package smoke=$package_smoke; toolchain export=$toolchain_export; reliability=$reliability; Windows IME=$windows_ime; platform experience=$platform_experience; release audit=$release_audit; frozen Quality reuse=$REUSE_QUALITY"

  windows-experience:
    name: windows-experience
    needs: route
    if: >-
      (needs.route.outputs.windows_ime == 'true' || needs.route.outputs.platform_experience == 'true') &&
      (github.event.pull_request.draft == false ||
       contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->'))
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before Windows experience
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify built-in Microsoft Pinyin input profile
        if: ${{ needs.route.outputs.windows_ime == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path test-results/windows-ime | Out-Null
          $tipId = '{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}'
          $profileId = '{FA550B04-5AD7-411F-A5AC-CA038EC515D7}'
          $inputTip = "0804:$tipId$profileId"
          $profilePath = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\$tipId\LanguageProfile\0x00000804\$profileId"
          if (-not (Test-Path $profilePath)) {
            throw "M8_07_MICROSOFT_PINYIN_PROFILE_MISSING: $profilePath"
          }
          $registry = Get-ItemProperty -Path $profilePath
          $values = [ordered]@{}
          foreach ($property in $registry.PSObject.Properties) {
            if ($property.Name -notlike 'PS*') {
              $values[$property.Name] = [string]$property.Value
            }
          }
          [pscustomobject]@{
            inputTip = $inputTip
            profilePath = $profilePath
            registryValues = $values
          } |
            ConvertTo-Json -Depth 3 |
            Out-File -FilePath test-results/windows-ime/microsoft-pinyin-profile.json -Encoding utf8
          Start-Process "$env:WINDIR\System32\ctfmon.exe"
          Start-Sleep -Seconds 2
      - name: Build desktop once for Windows validation
        run: pnpm build
      - name: Run Windows platform author experience
        if: ${{ needs.route.outputs.platform_experience == 'true' }}
        env:
          WORLDFORGE_PLATFORM_EXPERIENCE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/platform-experience
        run: node scripts/run-electron-e2e.mjs tests/e2e/platform-experience.spec.ts
      - name: Run real Windows Pinyin acceptance
        if: ${{ needs.route.outputs.windows_ime == 'true' }}
        shell: powershell
        env:
          WORLDFORGE_WINDOWS_IME_EVIDENCE_DIR: ${{ github.workspace }}\test-results\windows-ime
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec playwright test --config tests/e2e/playwright.windows-ime.config.ts --workers=1 2>&1 |
            Tee-Object -FilePath test-results/windows-ime/windows-ime-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert clean working tree after Windows experience
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload Windows platform experience evidence
        if: ${{ always() && needs.route.outputs.platform_experience == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-experience-windows
          path: |
            test-results/platform-experience/
            test-results/electron/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows native IME evidence
        if: ${{ always() && needs.route.outputs.windows_ime == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m8-07-windows-native-ime
          path: test-results/windows-ime/
          if-no-files-found: error
          retention-days: 30

  platform-experience-macos:
    name: platform-experience-macos
    needs: route
    if: >-
      needs.route.outputs.platform_experience == 'true' &&
      (github.event.pull_request.draft == false ||
       contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->'))
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before macOS platform experience
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build desktop
        run: pnpm build
      - name: Run macOS platform author experience
        env:
          WORLDFORGE_PLATFORM_EXPERIENCE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/platform-experience
        run: node scripts/run-electron-e2e.mjs tests/e2e/platform-experience.spec.ts
      - name: Assert clean working tree after macOS platform experience
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload macOS platform experience evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-experience-macos
          path: |
            test-results/platform-experience/
            test-results/electron/
          if-no-files-found: error
          retention-days: 14

  quality-core:
    needs: route
    uses: ./.github/workflows/quality-core.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      draft_mode: ${{ github.event.pull_request.draft && !contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->') }}
      full_suite: ${{ needs.route.outputs.full_suite == 'true' }}
      package_smoke: ${{ needs.route.outputs.package_smoke == 'true' }}
      reliability_suite: ${{ needs.route.outputs.reliability == 'true' }}
      security_suite: false
      performance_eval: false
      linux_platform_experience: ${{ needs.route.outputs.platform_experience == 'true' }}

  release-audit:
    name: quality / release-audit
    needs: route
    if: >-
      needs.route.outputs.release_audit == 'true' &&
      (github.event.pull_request.draft == false ||
       contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before release audit
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run governance unit tests
        run: >-
          pnpm exec vitest run
          tests/unit/ci-efficiency.test.ts
          tests/unit/ci-draft-routing.test.ts
          tests/unit/automated-verification-authority.test.ts
          tests/unit/evidence-policy.test.ts
          tests/unit/ui-acceptance-gate.test.ts
          tests/unit/quality-system-v2.test.ts
      - name: Run CI policy validation
        run: pnpm ci:policy
      - name: Run release configuration check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:check
      - name: Scan effective Verified Evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verified-evidence-scan.mjs
      - name: Validate changed Evidence documents
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_FINAL: ${{ github.event.pull_request.draft == false }}
          EVIDENCE_PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/evidence-policy-entry.mjs scripts/evidence-policy.mjs
      - name: Assert clean working tree after release audit
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  toolchain-export:
    name: quality / toolchain-export
    needs: route
    if: >-
      needs.route.outputs.toolchain_export == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'work' ||
       github.event.pull_request.head.ref == 'governance')
    uses: ./.github/workflows/toolchain-export.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      profile: quality
      runner: ubuntu-24.04

  quality:
    name: quality / quality
    if: always()
    needs:
      - route
      - quality-core
      - windows-experience
      - platform-experience-macos
      - release-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce final PR quality authority
        shell: bash
        env:
          CORE_RESULT: ${{ needs.quality-core.result }}
          WINDOWS_IME_REQUIRED: ${{ needs.route.outputs.windows_ime }}
          PLATFORM_EXPERIENCE_REQUIRED: ${{ needs.route.outputs.platform_experience }}
          WINDOWS_RESULT: ${{ needs.windows-experience.result }}
          MACOS_RESULT: ${{ needs.platform-experience-macos.result }}
          RELEASE_AUDIT_REQUIRED: ${{ needs.route.outputs.release_audit }}
          RELEASE_AUDIT_RESULT: ${{ needs.release-audit.result }}
        run: |
          set -euo pipefail
          printf 'core=%s\nwindows-ime-required=%s\nplatform-experience-required=%s\nwindows=%s\nmacos=%s\nrelease-audit-required=%s\nrelease-audit=%s\n' \
            "$CORE_RESULT" "$WINDOWS_IME_REQUIRED" "$PLATFORM_EXPERIENCE_REQUIRED" \
            "$WINDOWS_RESULT" "$MACOS_RESULT" "$RELEASE_AUDIT_REQUIRED" "$RELEASE_AUDIT_RESULT"
          test "$CORE_RESULT" = success

          if [ "$WINDOWS_IME_REQUIRED" = true ] || [ "$PLATFORM_EXPERIENCE_REQUIRED" = true ]; then
            test "$WINDOWS_RESULT" = success
          else
            case "$WINDOWS_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi

          if [ "$PLATFORM_EXPERIENCE_REQUIRED" = true ]; then
            test "$MACOS_RESULT" = success
          else
            case "$MACOS_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi

          if [ "$RELEASE_AUDIT_REQUIRED" = true ]; then
            test "$RELEASE_AUDIT_RESULT" = success
          else
            case "$RELEASE_AUDIT_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi
