name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  statuses: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_suite: ${{ steps.route.outputs.full_suite }}
      package_smoke: ${{ steps.route.outputs.package_smoke }}
      toolchain_export: ${{ steps.route.outputs.toolchain_export }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine PR quality route
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          full_suite=false
          package_smoke=false
          toolchain_export=false
          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          if [ -z "$changed_files" ]; then
            full_suite=true
          else
            while IFS= read -r file; do
              case "$file" in
                *.md|docs/*|.github/*|scripts/*policy.mjs|scripts/automerge.mjs|scripts/main-verification.mjs)
                  ;;
                *)
                  full_suite=true
                  ;;
              esac
              case "$file" in
                package.json|pnpm-lock.yaml|pnpm-workspace.yaml|scripts/package-desktop.mjs|scripts/package-foundation.mjs|scripts/release-tool.mjs|.github/workflows/release.yml|.github/workflows/quality-core.yml)
                  package_smoke=true
                  ;;
              esac
              case "$file" in
                package.json|pnpm-lock.yaml|docs/process/CURRENT_WORKSPACE_TOOLCHAIN.json|docs/process/CURRENT_WORKSPACE_TOOLCHAIN.md|.github/governance/toolchain-bundle.mjs|.github/workflows/toolchain-export.yml|.github/workflows/quality.yml)
                  toolchain_export=true
                  ;;
              esac
            done <<< "$changed_files"
          fi
          echo "full_suite=$full_suite" >> "$GITHUB_OUTPUT"
          echo "package_smoke=$package_smoke" >> "$GITHUB_OUTPUT"
          echo "toolchain_export=$toolchain_export" >> "$GITHUB_OUTPUT"
          echo "PR quality full suite: $full_suite; package smoke: $package_smoke; toolchain export: $toolchain_export"

  windows-native-ime:
    name: windows-native-ime
    if: ${{ github.event.pull_request.draft == false && contains(github.event.pull_request.body, 'chinese-experience-verification-closure') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Assert clean working tree before Windows IME acceptance
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify built-in Microsoft Pinyin input profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path test-results/windows-ime | Out-Null
          $tipId = '{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}'
          $profileId = '{FA550B04-5AD7-411F-A5AC-CA038EC515D7}'
          $inputTip = "0804:$tipId$profileId"
          $profilePath = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\$tipId\LanguageProfile\0x00000804\$profileId"
          if (-not (Test-Path $profilePath)) {
            throw "M8_07_MICROSOFT_PINYIN_PROFILE_MISSING: $profilePath"
          }
          $registry = Get-ItemProperty -Path $profilePath
          $values = [ordered]@{}
          foreach ($property in $registry.PSObject.Properties) {
            if ($property.Name -notlike 'PS*') {
              $values[$property.Name] = [string]$property.Value
            }
          }
          [pscustomobject]@{
            inputTip = $inputTip
            profilePath = $profilePath
            registryValues = $values
          } |
            ConvertTo-Json -Depth 3 |
            Out-File -FilePath test-results/windows-ime/microsoft-pinyin-profile.json -Encoding utf8
          Start-Process "$env:WINDIR\System32\ctfmon.exe"
          Start-Sleep -Seconds 2
      - name: Build desktop
        run: pnpm build
      - name: Run real Windows Pinyin acceptance
        shell: powershell
        env:
          WORLDFORGE_WINDOWS_IME_EVIDENCE_DIR: ${{ github.workspace }}\test-results\windows-ime
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec playwright test --config tests/e2e/playwright.windows-ime.config.ts --workers=1 2>&1 |
            Tee-Object -FilePath test-results/windows-ime/windows-ime-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert clean working tree after Windows IME acceptance
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload Windows native IME evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m8-07-windows-native-ime
          path: test-results/windows-ime/
          if-no-files-found: error
          retention-days: 30

  quality:
    needs: route
    uses: ./.github/workflows/quality-core.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      # Draft stays merge-blocked. `full-validation-draft` may opt into the full matrix before Ready.
      draft_mode: ${{ github.event.pull_request.draft && !contains(github.event.pull_request.body, 'full-validation-draft') }}
      full_suite: ${{ needs.route.outputs.full_suite == 'true' }}
      package_smoke: ${{ needs.route.outputs.package_smoke == 'true' }}
      security_suite: false
      performance_eval: false

  release-audit:
    name: quality / release-audit
    if: ${{ github.event.pull_request.draft == false || contains(github.event.pull_request.body, 'full-validation-draft') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Assert clean working tree before release audit
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run CI policy validation
        run: pnpm ci:policy
      - name: Run release configuration check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:check
      - name: Scan effective Verified Evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verified-evidence-scan.mjs
      - name: Validate changed Evidence documents
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_FINAL: ${{ github.event.pull_request.draft == false }}
        run: node scripts/evidence-policy.mjs
      - name: Assert clean working tree after release audit
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  toolchain-export:
    name: quality / toolchain-export
    needs: route
    if: >-
      needs.route.outputs.toolchain_export == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work'
    uses: ./.github/workflows/toolchain-export.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      profile: quality
      runner: ubuntu-24.04

  package-smoke-gate:
    name: quality / package-smoke
    if: always()
    needs:
      - route
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Normalize optional package smoke result for Controlled Merge
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PACKAGE_SMOKE_REQUIRED: ${{ needs.route.outputs.package_smoke }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          echo "Package smoke required for this PR: $PACKAGE_SMOKE_REQUIRED"
