name: Recovery UI Verification

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/recovery-ui-verification.yml'

permissions:
  contents: read

env:
  CI: true

jobs:
  verify-recovery-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install dependencies for isolated verification
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Run recovery UI regression unit test
        run: |
          pnpm test:prepare
          pnpm exec vitest run tests/unit/renderer-m3-09-workbenches.test.ts
      - name: Install Electron display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb
          fc-match "Noto Serif CJK SC"
      - name: Build desktop workspaces
        run: pnpm build
      - name: Run targeted recovery Electron E2E
        env:
          WORLDFORGE_E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/electron
        run: >-
          node scripts/run-electron-e2e.mjs
          tests/e2e/electron-shell.spec.ts
          --grep
          "creates immutable Versions|creates a verified recovery point"
