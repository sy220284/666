name: Release
run-name: Release ${{ inputs.version }} (${{ github.event_name }}, attempt ${{ github.run_attempt }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json SemVer without a leading v
        required: true
        type: string
      release_kind:
        description: GitHub Release visibility
        required: true
        default: draft
        type: choice
        options:
          - draft
          - prerelease
          - stable
      require_distribution_trust:
        description: Require Windows signing plus macOS signing/notarization for non-stable builds
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  statuses: read

env:
  DISTRIBUTION_TRUST_MODE: ${{ (inputs.release_kind == 'stable' || inputs.require_distribution_trust) && 'required' || 'allow-unsigned' }}
  GITHUB_TOKEN: ${{ github.token }}
  RELEASE_KIND: ${{ inputs.release_kind }}
  SOURCE_AUTHORITY_CONTEXT: main-verification

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  release-status-start:
    name: Mark release pending
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      STATUS_CONTEXT: release-${{ inputs.version }}
      STATUS_SHA: ${{ github.sha }}
      STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending release status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"
          -f state=pending
          -f context="$STATUS_CONTEXT"
          -f description="Release started"
          -f target_url="$STATUS_TARGET_URL"

  quality:
    name: Release quality
    needs: release-status-start
    uses: ./.github/workflows/quality-core.yml
    with:
      package_smoke: false
      security_suite: true
      performance_eval: true

  release-gate:
    name: Release acceptance gate
    needs: release-status-start
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Recheck dependency and repository-secret safety
        run: |
          pnpm audit --audit-level=high
          node scripts/scan-secrets.mjs --history
      - name: Validate required distribution credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ "$DISTRIBUTION_TRUST_MODE" != required ]; then
            exit 0
          fi
          for name in \
            WINDOWS_CERTIFICATE_BASE64 WINDOWS_CERTIFICATE_PASSWORD \
            MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY \
            APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "Required distribution credential is not configured: $name" >&2
              exit 1
            fi
          done
      - name: Enforce source and product release acceptance gates
        run: |
          test "$GITHUB_REF_NAME" = main
          node scripts/ui-acceptance-gate.mjs
          pnpm release:gate -- \
            --version "$RELEASE_VERSION" \
            --kind "$RELEASE_KIND" \
            --distribution-trust "$DISTRIBUTION_TRUST_MODE"
      - run: pnpm release:check

  build:
    name: Package (${{ matrix.platform }})
    needs: release-gate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb
          fc-match "Noto Serif CJK SC"
      - run: pnpm build
      - name: Run platform startup smoke
        run: node scripts/run-electron-e2e.mjs tests/e2e/electron-shell.spec.ts
      - name: Prepare Windows signing certificate
        if: matrix.platform == 'windows' && env.DISTRIBUTION_TRUST_MODE == 'required'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'worldforge-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" >> $env:GITHUB_ENV
      - name: Prepare macOS signing and notarization credentials
        if: matrix.platform == 'macos' && env.DISTRIBUTION_TRUST_MODE == 'required'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/worldforge-signing.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_WorldForge.p8"
          keychain_path="$RUNNER_TEMP/worldforge-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "WORLDFORGE_MACOS_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Build Linux platform package
        if: matrix.platform == 'linux'
        run: >-
          pnpm run package --
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --output "release/${{ matrix.platform }}"
      - name: Build unsigned Windows platform package
        if: matrix.platform == 'windows' && env.DISTRIBUTION_TRUST_MODE == 'allow-unsigned'
        run: >-
          pnpm run package --
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --output "release/${{ matrix.platform }}"
      - name: Build trusted Windows platform package
        if: matrix.platform == 'windows' && env.DISTRIBUTION_TRUST_MODE == 'required'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: >-
          pnpm run package --
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --output "release/${{ matrix.platform }}"
      - name: Build unsigned macOS platform package
        if: matrix.platform == 'macos' && env.DISTRIBUTION_TRUST_MODE == 'allow-unsigned'
        run: >-
          pnpm run package --
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --output "release/${{ matrix.platform }}"
      - name: Build trusted macOS platform package
        if: matrix.platform == 'macos' && env.DISTRIBUTION_TRUST_MODE == 'required'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          WORLDFORGE_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: >-
          pnpm run package --
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --output "release/${{ matrix.platform }}"
      - name: Verify platform package assets
        run: >-
          node scripts/verify-package-assets.mjs
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --directory "release/${{ matrix.platform }}"
      - name: Remove temporary distribution credentials
        if: always() && env.DISTRIBUTION_TRUST_MODE == 'required'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = windows ]; then
            rm -f "$RUNNER_TEMP/worldforge-signing.pfx"
          elif [ "${{ matrix.platform }}" = macos ]; then
            security delete-keychain "$RUNNER_TEMP/worldforge-signing.keychain-db" || true
            rm -f \
              "$RUNNER_TEMP/worldforge-signing.p12" \
              "$RUNNER_TEMP/AuthKey_WorldForge.p8"
          fi
      - name: Run Linux packaged startup smoke
        if: matrix.platform == 'linux'
        env:
          WORLDFORGE_PACKAGED_SMOKE_ALLOW_NO_SANDBOX: '1'
        run: >-
          xvfb-run -a node scripts/smoke-packaged-desktop.mjs
          --platform "${{ matrix.platform }}"
          --directory "release/${{ matrix.platform }}"
      - name: Run packaged startup smoke
        if: matrix.platform != 'linux'
        run: >-
          node scripts/smoke-packaged-desktop.mjs
          --platform "${{ matrix.platform }}"
          --directory "release/${{ matrix.platform }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worldforge-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  release-status-ready:
    name: Mark release ready to publish
    needs:
      - quality
      - release-gate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      STATUS_CONTEXT: release-${{ inputs.version }}
      STATUS_SHA: ${{ github.sha }}
      STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish build-complete release status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"
          -f state=pending
          -f context="$STATUS_CONTEXT"
          -f description="Artifacts built; awaiting publish"
          -f target_url="$STATUS_TARGET_URL"

  publish:
    name: Publish GitHub Release
    needs:
      - quality
      - release-gate
      - build
      - release-status-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_KIND: ${{ inputs.release_kind }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: worldforge-*
          path: release
      - name: Recheck gates and create checksums
        run: |
          node scripts/ui-acceptance-gate.mjs
          node scripts/release-tool.mjs gate \
            --version "$RELEASE_VERSION" \
            --kind "$RELEASE_KIND" \
            --distribution-trust "$DISTRIBUTION_TRUST_MODE" \
            --assets release
          node scripts/release-tool.mjs checksums \
            --version "$RELEASE_VERSION" \
            --kind "$RELEASE_KIND" \
            --distribution-trust "$DISTRIBUTION_TRUST_MODE" \
            --assets release \
            --output release/SHA256SUMS.txt
      - name: Create immutable GitHub Release
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to publish against an ambiguous commit." >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi
          release_args=(
            --target "$GITHUB_SHA"
            --title "WorldForge $tag"
            --generate-notes
          )
          case "$RELEASE_KIND" in
            draft) release_args+=(--draft --latest=false) ;;
            prerelease) release_args+=(--prerelease --latest=false) ;;
            stable) ;;
            *)
              echo "Unsupported release kind: $RELEASE_KIND" >&2
              exit 1
              ;;
          esac
          gh release create "$tag" "${assets[@]}" "${release_args[@]}"

  release-status-final:
    name: Publish final release status
    if: always()
    needs:
      - quality
      - release-gate
      - build
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      GATE_RESULT: ${{ needs.release-gate.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      STATUS_CONTEXT: release-${{ inputs.version }}
      STATUS_SHA: ${{ github.sha }}
      STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish final release status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Release failed before tag publication"
          if [ "$QUALITY_RESULT" = success ] && \
             [ "$GATE_RESULT" = success ] && \
             [ "$BUILD_RESULT" = success ] && \
             [ "$PUBLISH_RESULT" = success ]; then
            state=success
            description="Release published"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$STATUS_TARGET_URL"
