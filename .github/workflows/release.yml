name: Release
run-name: Release ${{ inputs.version || '1.0.1' }} (${{ github.event_name }}, attempt ${{ github.run_attempt }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json SemVer without a leading v
        required: true
        type: string
      release_kind:
        description: GitHub Release visibility
        required: true
        default: draft
        type: choice
        options:
          - draft
          - prerelease
          - stable
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: read

env:
  CI: true
  DISTRIBUTION_TRUST_MODE: allow-unsigned
  GITHUB_TOKEN: ${{ github.token }}
  RELEASE_KIND: ${{ inputs.release_kind || 'stable' }}
  SOURCE_AUTHORITY_CONTEXT: main-verification

concurrency:
  group: release-${{ inputs.version || '1.0.1' }}
  cancel-in-progress: true

jobs:
  release-status-start:
    name: Mark release pending
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.number == 416 && github.event.issue.pull_request && github.event.comment.body == '/release-v1.0.1' && github.event.comment.author_association == 'OWNER') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      STATUS_CONTEXT: release-${{ inputs.version || '1.0.1' }}
      STATUS_SHA: ${{ github.sha }}
      STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending release status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"
          -f state=pending
          -f context="$STATUS_CONTEXT"
          -f description="Release started"
          -f target_url="$STATUS_TARGET_URL"

  quality:
    name: Release quality
    needs: release-status-start
    uses: ./.github/workflows/quality-core.yml
    with:
      desktop_e2e: false
      package_smoke: false
      security_suite: true
      performance_eval: true

  release-core-e2e:
    name: release-core-${{ matrix.platform }}-${{ matrix.shard }}-of-3
    needs: release-status-start
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            shard: 1
          - os: ubuntu-24.04
            platform: linux
            shard: 2
          - os: ubuntu-24.04
            platform: linux
            shard: 3
          - os: windows-latest
            platform: windows
            shard: 1
          - os: windows-latest
            platform: windows
            shard: 2
          - os: windows-latest
            platform: windows
            shard: 3
          - os: macos-latest
            platform: macos
            shard: 1
          - os: macos-latest
            platform: macos
            shard: 2
          - os: macos-latest
            platform: macos
            shard: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before release E2E
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb
          fc-match "Noto Serif CJK SC"
      - name: Build desktop
        run: pnpm build
      - name: Run sharded desktop E2E
        shell: bash
        env:
          WORLDFORGE_E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/electron
          WORLDFORGE_CAPTURE_MATRIX_DIR: ${{ github.workspace }}/test-results/display-matrix
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          node scripts/run-electron-e2e.mjs --shard=${{ matrix.shard }}/3 2>&1 | tee test-results/ci/release-e2e.log
      - name: Assert clean working tree after release E2E
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload release E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-e2e-${{ matrix.platform }}-${{ matrix.shard }}-of-3
          path: |
            test-results/ci/release-e2e.log
            test-results/electron/
            test-results/display-matrix/
          if-no-files-found: warn
          retention-days: 14

  release-platform-experience:
    name: release-platform-experience-${{ matrix.platform }}
    needs: release-status-start
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before platform experience
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb
          fc-match "Noto Serif CJK SC"
      - name: Build desktop
        run: pnpm build
      - name: Run platform author experience and capture screenshots
        env:
          WORLDFORGE_PLATFORM_EXPERIENCE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/platform-experience
        run: node scripts/run-electron-e2e.mjs tests/e2e/platform-experience.spec.ts
      - name: Assert clean working tree after platform experience
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload platform experience evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-platform-experience-${{ matrix.platform }}
          path: |
            test-results/platform-experience/
            test-results/electron/
          if-no-files-found: error
          retention-days: 14

  release-windows-native-ime:
    name: release-windows-native-ime
    needs: release-status-start
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Assert clean working tree before Windows IME
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify built-in Microsoft Pinyin input profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path test-results/windows-ime | Out-Null
          $tipId = '{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}'
          $profileId = '{FA550B04-5AD7-411F-A5AC-CA038EC515D7}'
          $inputTip = "0804:$tipId$profileId"
          $profilePath = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\$tipId\LanguageProfile\0x00000804\$profileId"
          if (-not (Test-Path $profilePath)) {
            throw "M8_07_MICROSOFT_PINYIN_PROFILE_MISSING: $profilePath"
          }
          $registry = Get-ItemProperty -Path $profilePath
          $values = [ordered]@{}
          foreach ($property in $registry.PSObject.Properties) {
            if ($property.Name -notlike 'PS*') {
              $values[$property.Name] = [string]$property.Value
            }
          }
          [pscustomobject]@{
            inputTip = $inputTip
            profilePath = $profilePath
            registryValues = $values
          } |
            ConvertTo-Json -Depth 3 |
            Out-File -FilePath test-results/windows-ime/microsoft-pinyin-profile.json -Encoding utf8
          Start-Process "$env:WINDIR\System32\ctfmon.exe"
          Start-Sleep -Seconds 2
      - name: Build desktop
        run: pnpm build
      - name: Run real Windows Pinyin acceptance
        shell: powershell
        env:
          WORLDFORGE_WINDOWS_IME_EVIDENCE_DIR: ${{ github.workspace }}\test-results\windows-ime
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec playwright test --config tests/e2e/playwright.windows-ime.config.ts --workers=1 2>&1 |
            Tee-Object -FilePath test-results/windows-ime/windows-ime-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert clean working tree after Windows IME
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload Windows IME evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-native-ime
          path: test-results/windows-ime/
          if-no-files-found: error
          retention-days: 30

  release-e2e-authority:
    name: Release three-platform E2E authority
    if: always()
    needs:
      - release-core-e2e
      - release-platform-experience
      - release-windows-native-ime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CORE_RESULT: ${{ needs.release-core-e2e.result }}
      PLATFORM_RESULT: ${{ needs.release-platform-experience.result }}
      WINDOWS_IME_RESULT: ${{ needs.release-windows-native-ime.result }}
    steps:
      - name: Enforce three-platform release E2E authority
        shell: bash
        run: |
          set -euo pipefail
          printf 'core=%s\nplatform=%s\nwindows-ime=%s\n' "$CORE_RESULT" "$PLATFORM_RESULT" "$WINDOWS_IME_RESULT"
          test "$CORE_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$WINDOWS_IME_RESULT" = success

  release-gate:
    name: Release acceptance gate
    needs: release-status-start
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version || '1.0.1' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Recheck dependency and repository-secret safety
        run: |
          pnpm audit --audit-level=high
          node scripts/scan-secrets.mjs --history
      - name: Enforce source and product release acceptance gates
        run: |
          test "$GITHUB_REF_NAME" = main
          node scripts/ui-acceptance-gate.mjs
          pnpm release:gate -- \
            --version "$RELEASE_VERSION" \
            --kind "$RELEASE_KIND" \
            --distribution-trust "$DISTRIBUTION_TRUST_MODE"
      - run: pnpm release:check

  build:
    name: Package (${{ matrix.platform }})
    needs: release-gate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version || '1.0.1' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb
          fc-match "Noto Serif CJK SC"
      - run: pnpm build
      - name: Build Linux platform package
        if: matrix.platform == 'linux'
        run: >-
          pnpm run package --
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --output "release/${{ matrix.platform }}"
      - name: Build Windows platform package
        if: matrix.platform == 'windows'
        run: >-
          pnpm run package --
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --output "release/${{ matrix.platform }}"
      - name: Build macOS platform package
        if: matrix.platform == 'macos'
        run: >-
          pnpm run package --
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --output "release/${{ matrix.platform }}"
      - name: Verify platform package assets
        run: >-
          node scripts/verify-package-assets.mjs
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
          --release-kind "$RELEASE_KIND"
          --distribution-trust "$DISTRIBUTION_TRUST_MODE"
          --directory "release/${{ matrix.platform }}"
      - name: Run Linux packaged startup smoke
        if: matrix.platform == 'linux'
        env:
          WORLDFORGE_PACKAGED_SMOKE_ALLOW_NO_SANDBOX: '1'
        run: >-
          xvfb-run -a node scripts/smoke-packaged-desktop.mjs
          --platform "${{ matrix.platform }}"
          --directory "release/${{ matrix.platform }}"
      - name: Run packaged startup smoke
        if: matrix.platform != 'linux'
        run: >-
          node scripts/smoke-packaged-desktop.mjs
          --platform "${{ matrix.platform }}"
          --directory "release/${{ matrix.platform }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worldforge-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  release-status-ready:
    name: Mark release ready to publish
    needs:
      - quality
      - release-e2e-authority
      - release-gate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      STATUS_CONTEXT: release-${{ inputs.version || '1.0.1' }}
      STATUS_SHA: ${{ github.sha }}
      STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish build-complete release status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"
          -f state=pending
          -f context="$STATUS_CONTEXT"
          -f description="Artifacts built and three-platform E2E passed; awaiting publish"
          -f target_url="$STATUS_TARGET_URL"

  publish:
    name: Publish GitHub Release
    needs:
      - quality
      - release-e2e-authority
      - release-gate
      - build
      - release-status-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_KIND: ${{ inputs.release_kind || 'stable' }}
      RELEASE_VERSION: ${{ inputs.version || '1.0.1' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: worldforge-*
          path: release
      - name: Recheck gates and create checksums
        run: |
          node scripts/ui-acceptance-gate.mjs
          node scripts/release-tool.mjs gate \
            --version "$RELEASE_VERSION" \
            --kind "$RELEASE_KIND" \
            --distribution-trust "$DISTRIBUTION_TRUST_MODE" \
            --assets release
          node scripts/release-tool.mjs checksums \
            --version "$RELEASE_VERSION" \
            --kind "$RELEASE_KIND" \
            --distribution-trust "$DISTRIBUTION_TRUST_MODE" \
            --assets release \
            --output release/SHA256SUMS.txt
      - name: Create immutable GitHub Release
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to publish against an ambiguous commit." >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi
          release_args=(
            --target "$GITHUB_SHA"
            --title "WorldForge $tag"
            --generate-notes
          )
          case "$RELEASE_KIND" in
            draft) release_args+=(--draft --latest=false) ;;
            prerelease) release_args+=(--prerelease --latest=false) ;;
            stable) ;;
            *)
              echo "Unsupported release kind: $RELEASE_KIND" >&2
              exit 1
              ;;
          esac
          gh release create "$tag" "${assets[@]}" "${release_args[@]}"

  release-status-final:
    name: Publish final release status
    if: ${{ always() && (github.event_name != 'issue_comment' || (github.event.issue.number == 416 && github.event.issue.pull_request && github.event.comment.body == '/release-v1.0.1' && github.event.comment.author_association == 'OWNER')) }}
    needs:
      - quality
      - release-e2e-authority
      - release-gate
      - build
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      E2E_RESULT: ${{ needs.release-e2e-authority.result }}
      GATE_RESULT: ${{ needs.release-gate.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      STATUS_CONTEXT: release-${{ inputs.version || '1.0.1' }}
      STATUS_SHA: ${{ github.sha }}
      STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish final release status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Release failed before tag publication"
          if [ "$QUALITY_RESULT" = success ] && \
             [ "$E2E_RESULT" = success ] && \
             [ "$GATE_RESULT" = success ] && \
             [ "$BUILD_RESULT" = success ] && \
             [ "$PUBLISH_RESULT" = success ]; then
            state=success
            description="Release published"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$STATUS_TARGET_URL"
