name: Repository Governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/governance/**'
      - '.github/workflows/**'
      - 'scripts/automerge.mjs'
      - 'scripts/check-boundaries.mjs'
      - 'scripts/check-workspaces.mjs'
      - 'scripts/ci-policy.mjs'
      - 'scripts/main-verification.mjs'
      - 'scripts/migrate-final-audit-cleanup.mjs'
      - 'scripts/ruleset-policy.mjs'
      - 'scripts/workflow-structure-policy.mjs'
      - 'docs/process/CI_WORKFLOW_ARCHITECTURE.md'
      - 'docs/process/MAIN_BRANCH_PROTECTION.md'
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-governance-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  final-audit-cleanup:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'sy220284/666' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect one-time cleanup
        id: route
        shell: bash
        run: |
          if test -f scripts/migrate-final-audit-cleanup.mjs; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          node-version: 24
          cache: pnpm
      - name: Generate lockfile and final governance changes
        if: ${{ steps.route.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --prefer-offline
          node --check scripts/migrate-final-audit-cleanup.mjs
          node scripts/migrate-final-audit-cleanup.mjs
          pnpm exec prettier --write \
            .github/governance/deferred-task-closure.mjs \
            .github/governance/task-transition-policy-core.mjs \
            .github/governance/verification-hold-taskctl.mjs \
            apps/desktop/renderer/build-assets.mjs \
            scripts/atomic-file-transaction.mjs \
            scripts/audit-remediation-policy.mjs \
            scripts/ci-policy.mjs \
            scripts/evidence-policy.mjs \
            scripts/task-control-lib.mjs \
            scripts/taskctl.mjs \
            scripts/verified-evidence-scan.mjs \
            pnpm-lock.yaml
      - name: Validate final audit cleanup
        if: ${{ steps.route.outputs.run == 'true' }}
        shell: bash
        run: |
          mkdir -p test-results/final-audit-cleanup
          set -o pipefail
          {
            pnpm install --frozen-lockfile --prefer-offline
            node .github/governance/automation-layout-policy.mjs
            pnpm check:workspaces
            pnpm check:boundaries
            pnpm ci:policy
            pnpm test:quality
            pnpm exec vitest run \
              tests/unit/workflow-structure-policy.test.ts \
              tests/unit/tooling-hardening.test.ts \
              tests/unit/atomic-file-transaction.test.ts \
              tests/unit/taskctl-transaction-policy.test.ts \
              tests/integration/workspace-graph.test.ts
            pnpm lint
            pnpm typecheck
          } 2>&1 | tee test-results/final-audit-cleanup/validation.log
      - name: Upload final cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: final-audit-cleanup-diagnostics
          path: test-results/final-audit-cleanup/
          if-no-files-found: warn
          retention-days: 1
      - name: Commit validated ordinary files
        if: ${{ steps.route.outputs.run == 'true' && success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/migrate-final-audit-cleanup.mjs
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            pnpm-lock.yaml \
            .github/governance/deferred-task-closure.mjs \
            .github/governance/task-transition-policy-core.mjs \
            .github/governance/verification-hold-taskctl.mjs \
            apps/desktop/renderer/build-assets.mjs \
            scripts/atomic-file-transaction.mjs \
            scripts/audit-remediation-policy.mjs \
            scripts/ci-policy.mjs \
            scripts/evidence-policy.mjs \
            scripts/task-control-lib.mjs \
            scripts/taskctl.mjs \
            scripts/verified-evidence-scan.mjs \
            scripts/migrate-final-audit-cleanup.mjs
          git diff --cached --check
          git commit -m 'fix(governance): finish audit tooling hardening'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$HEAD_REF"

  repository-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Assert clean trusted governance checkout
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Audit permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Self-test deferred task closure
        run: node .github/governance/deferred-task-closure.mjs --self-test
      - name: Audit complete native main-branch protection
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          RULESET_REPORT: artifacts/repository-governance/report.json
          RULESET_STRICT: true
        run: node scripts/ruleset-policy.mjs check
      - name: Assert governance audit did not mutate tracked files
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload ruleset drift report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-governance-report
          path: artifacts/repository-governance/
          if-no-files-found: error
          retention-days: 30
