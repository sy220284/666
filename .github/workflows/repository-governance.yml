name: Repository Governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/governance/**'
      - '.github/workflows/**'
      - 'scripts/automerge.mjs'
      - 'scripts/ci-policy.mjs'
      - 'scripts/main-verification.mjs'
      - 'scripts/ruleset-policy.mjs'
      - 'docs/process/CI_WORKFLOW_ARCHITECTURE.md'
      - 'docs/process/MAIN_BRANCH_PROTECTION.md'
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-lock-patch:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'sy220284/666' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Add coverage provider to the governed manifest and lockfile
        run: pnpm add --workspace-root --save-dev --save-exact @vitest/coverage-v8@4.1.10
      - name: Remove mutable coverage dependency installation from CI
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = '.github/workflows/quality-core.yml';
          const lines = (await readFile(file, 'utf8')).split('\n');
          const removableSteps = new Set([
            '      - name: Install exact coverage provider without changing the lockfile',
            '      - name: Restore package manifest after temporary coverage provider install',
          ]);
          const output = [];
          let removed = 0;
          for (let index = 0; index < lines.length; index += 1) {
            if (!removableSteps.has(lines[index])) {
              output.push(lines[index]);
              continue;
            }
            removed += 1;
            index += 2;
          }
          if (removed !== removableSteps.size) throw new Error(`Expected two mutable coverage steps, removed ${removed}`);
          await writeFile(file, output.join('\n'), 'utf8');
          NODE
      - name: Validate frozen installation and real coverage execution
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/coverage-lock
          {
            echo '=== frozen install ==='
            pnpm install --frozen-lockfile --prefer-offline
            echo '=== coverage ==='
            pnpm test:coverage
            echo '=== manifest ==='
            node -e "const p=require('./package.json'); console.log(p.devDependencies?.['@vitest/coverage-v8']); if(p.devDependencies?.['@vitest/coverage-v8']!=='4.1.10') process.exit(1)"
            echo '=== lockfile ==='
            grep -n '@vitest/coverage-v8' pnpm-lock.yaml | head
            echo '=== workflow checks ==='
            ! grep -n -- '--lockfile=false' .github/workflows/quality-core.yml
            ! grep -n 'temporary coverage provider' .github/workflows/quality-core.yml
          } 2>&1 | tee test-results/coverage-lock/validation.log
      - name: Upload exact locked coverage patch and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: locked-coverage-provider-patch
          path: |
            package.json
            pnpm-lock.yaml
            .github/workflows/quality-core.yml
            test-results/coverage-lock/validation.log
          if-no-files-found: error
          retention-days: 1

  repository-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Assert clean trusted governance checkout
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Audit permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Self-test deferred task closure
        run: node .github/governance/deferred-task-closure.mjs --self-test
      - name: Audit complete native main-branch protection
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          RULESET_REPORT: artifacts/repository-governance/report.json
          RULESET_STRICT: true
        run: node scripts/ruleset-policy.mjs check
      - name: Assert governance audit did not mutate tracked files
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload ruleset drift report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-governance-report
          path: artifacts/repository-governance/
          if-no-files-found: error
          retention-days: 30
