name: Repository Governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/governance/**'
      - '.github/workflows/**'
      - 'scripts/automerge.mjs'
      - 'scripts/ci-policy.mjs'
      - 'scripts/main-verification.mjs'
      - 'scripts/ruleset-policy.mjs'
      - 'docs/process/CI_WORKFLOW_ARCHITECTURE.md'
      - 'docs/process/MAIN_BRANCH_PROTECTION.md'
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-governance-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-lock-commit:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'sy220284/666' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Determine whether the validated patch still needs to be committed
        id: route
        shell: bash
        run: |
          set -euo pipefail
          run=true
          if node -e "const p=require('./package.json'); process.exit(p.devDependencies?.['@vitest/coverage-v8']==='4.1.10'?0:1)" \
            && ! grep -q 'document[[:space:]]*\.[[:space:]]*querySelector' apps/desktop/renderer/src/features/writing/writing-workbench.tsx; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ steps.route.outputs.run == 'true' }}
      - name: Materialize the already validated package and React changes
        if: ${{ steps.route.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm add --workspace-root --save-dev --save-exact @vitest/coverage-v8@4.1.10
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const wrapperPath = 'apps/desktop/renderer/src/features/writing/writing-workbench.tsx';
          let wrapper = await readFile(wrapperPath, 'utf8');
          wrapper = wrapper.replace(
            "import { useEffect, useMemo, useRef, useState } from 'react';",
            "import { useCallback, useEffect, useMemo, useRef, useState } from 'react';",
          );
          const domEffect = /\n  useEffect\(\(\) => \{\n    if \(!restoreNotice \|\| props\.panel !== 'editor'\) return;[\s\S]*?\n  \}, \[props\.panel, restoreNotice\]\);\n/u;
          if (!domEffect.test(wrapper)) throw new Error('Restore notice DOM effect was not found');
          wrapper = wrapper.replace(domEffect, '\n');
          const bridgeMarker = '  const bridge = useMemo(\n';
          wrapper = wrapper.replace(
            bridgeMarker,
            "  const consumeRestoreNotice = useCallback(() => setRestoreNotice(null), []);\n\n" + bridgeMarker,
          );
          const continuationProp = '      initialContinuation={continuation}\n';
          wrapper = wrapper.replace(
            continuationProp,
            continuationProp +
              '      statusNotice={restoreNotice}\n' +
              '      onStatusNoticeConsumed={consumeRestoreNotice}\n',
          );
          await writeFile(wrapperPath, wrapper, 'utf8');

          const corePath = 'apps/desktop/renderer/src/features/writing/writing-core-workbench.tsx';
          let core = await readFile(corePath, 'utf8');
          const propMarker = '  readonly onStatus: (message: string) => void;\n';
          core = core.replace(
            propMarker,
            propMarker +
              '  readonly statusNotice?: string | null;\n' +
              '  readonly onStatusNoticeConsumed?: () => void;\n',
          );
          core = core.replace(
            '  onPanelChange,\n  onStatus,\n}: WritingWorkbenchProps) {',
            '  onPanelChange,\n  onStatus,\n  statusNotice,\n  onStatusNoticeConsumed,\n}: WritingWorkbenchProps) {',
          );
          const statusMarker =
            "  const setStatus = useCallback((message: string, failure = false): void => {\n" +
            '    setEditorState(message);\n' +
            '    setEditorFailure(failure);\n' +
            '  }, []);\n';
          core = core.replace(
            statusMarker,
            statusMarker +
              '\n  useEffect(() => {\n' +
              "    if (!statusNotice || panel !== 'editor') return;\n" +
              '    setStatus(statusNotice);\n' +
              '    onStatusNoticeConsumed?.();\n' +
              '  }, [onStatusNoticeConsumed, panel, setStatus, statusNotice]);\n',
          );
          await writeFile(corePath, core, 'utf8');
          NODE
          pnpm exec prettier --write \
            apps/desktop/renderer/src/features/writing/writing-workbench.tsx \
            apps/desktop/renderer/src/features/writing/writing-core-workbench.tsx
      - name: Revalidate the non-workflow patch
        if: ${{ steps.route.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run tests/security/renderer-react-boundary.test.ts
          pnpm test:coverage
          node -e "const p=require('./package.json'); if(p.devDependencies?.['@vitest/coverage-v8']!=='4.1.10') process.exit(1)"
          ! grep -q 'document[[:space:]]*\.[[:space:]]*querySelector' apps/desktop/renderer/src/features/writing/writing-workbench.tsx
      - name: Commit only package and React files
        if: ${{ steps.route.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            package.json \
            pnpm-lock.yaml \
            apps/desktop/renderer/src/features/writing/writing-workbench.tsx \
            apps/desktop/renderer/src/features/writing/writing-core-workbench.tsx
          git diff --cached --check
          git commit -m 'chore(ci): lock coverage provider and restore React boundary'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$HEAD_REF"

  repository-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Assert clean trusted governance checkout
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Audit permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Self-test deferred task closure
        run: node .github/governance/deferred-task-closure.mjs --self-test
      - name: Audit complete native main-branch protection
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          RULESET_REPORT: artifacts/repository-governance/report.json
          RULESET_STRICT: true
        run: node scripts/ruleset-policy.mjs check
      - name: Assert governance audit did not mutate tracked files
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload ruleset drift report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-governance-report
          path: artifacts/repository-governance/
          if-no-files-found: error
          retention-days: 30
