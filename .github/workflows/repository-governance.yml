name: Repository Governance

on:
  push:
    branches: [main, governance]
    paths:
      - '.github/governance/main-protection.json'
      - '.github/governance/required-checks.json'
      - '.github/workflows/repository-governance.yml'
      - 'scripts/ruleset-policy.mjs'
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoformat-governance:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/governance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: governance
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format only the files identified by the diagnostic run
        run: >-
          pnpm exec prettier --write
          scripts/main-verification.mjs
          scripts/ready-closure-route.mjs
          scripts/workflow-structure-policy.mjs
          tests/unit/ci-draft-routing.test.ts
          tests/unit/ci-efficiency.test.ts
          tests/unit/governance-main-verification.test.ts
          tests/unit/quality-system-v2.test.ts
      - name: Commit exact Prettier output back to governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/main-verification.mjs \
            scripts/ready-closure-route.mjs \
            scripts/workflow-structure-policy.mjs \
            tests/unit/ci-draft-routing.test.ts \
            tests/unit/ci-efficiency.test.ts \
            tests/unit/governance-main-verification.test.ts \
            tests/unit/quality-system-v2.test.ts
          git commit -m "治理：应用仓库 Prettier 格式"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:governance

  repository-governance:
    if: ${{ github.ref != 'refs/heads/governance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
      RULESET_REPORT: artifacts/repository-governance/report.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Assert clean governance checkout
        run: node .github/governance/assert-clean-tree.mjs
      - name: Audit permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Validate permanent CI policy
        run: node scripts/ci-policy.mjs
      - name: Self-test main verification wait behavior
        run: node .github/governance/main-verification-wait.self-test.mjs
      - name: Apply and verify native main ruleset
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_ADMIN_TOKEN"
          node scripts/ruleset-policy.mjs apply
      - name: Assert governance did not mutate tracked files
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
      - name: Upload ruleset report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-governance-report
          path: artifacts/repository-governance/
          if-no-files-found: error
          retention-days: 30
