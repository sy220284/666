name: Repository Governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/governance/**'
      - '.github/workflows/**'
      - 'scripts/automerge.mjs'
      - 'scripts/ci-policy.mjs'
      - 'scripts/main-verification.mjs'
      - 'scripts/ruleset-policy.mjs'
      - 'docs/process/CI_WORKFLOW_ARCHITECTURE.md'
      - 'docs/process/MAIN_BRANCH_PROTECTION.md'
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-governance-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN TEMPORARY ACTION PIN JOB
  pin-external-actions:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'sy220284/666' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin allowlisted actions and remove this migration job
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const workflowDirectory = path.join('.github', 'workflows');
          const replacements = new Map([
            ['actions/checkout@v6', 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6'],
            ['actions/setup-node@v6', 'actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6'],
            ['actions/upload-artifact@v7', 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7'],
            ['actions/download-artifact@v8', 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8'],
            ['pnpm/action-setup@v4', 'pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4'],
          ]);

          for (const file of await readdir(workflowDirectory)) {
            if (!/\.ya?ml$/u.test(file)) continue;
            const filePath = path.join(workflowDirectory, file);
            let source = await readFile(filePath, 'utf8');
            for (const [tagged, pinned] of replacements) source = source.replaceAll(tagged, pinned);
            if (file === 'repository-governance.yml') {
              source = source.replace(
                /\n  # BEGIN TEMPORARY ACTION PIN JOB[\s\S]*?\n  # END TEMPORARY ACTION PIN JOB\n/u,
                '\n',
              );
              source = source.replace('permissions:\n  contents: write', 'permissions:\n  contents: read');
            }
            await writeFile(filePath, source, 'utf8');
          }

          const policyPath = path.join('scripts', 'ci-policy.mjs');
          let policy = await readFile(policyPath, 'utf8');
          const oldPins = [
            'const actionVersions = new Map([',
            "  ['actions/checkout', 'v6'],",
            "  ['actions/setup-node', 'v6'],",
            "  ['actions/upload-artifact', 'v7'],",
            "  ['actions/download-artifact', 'v8'],",
            "  ['pnpm/action-setup', 'v4'],",
            ']);',
          ].join('\n');
          const newPins = [
            'const actionPins = new Map([',
            "  ['actions/checkout', 'd23441a48e516b6c34aea4fa41551a30e30af803'],",
            "  ['actions/setup-node', '249970729cb0ef3589644e2896645e5dc5ba9c38'],",
            "  ['actions/upload-artifact', '043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'],",
            "  ['actions/download-artifact', '3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c'],",
            "  ['pnpm/action-setup', 'b906affcce14559ad1aafd4ab0e942779e9f58b1'],",
            ']);',
          ].join('\n');
          const oldValidation = [
            '  for (const match of source.matchAll(/uses:\\s*([^@\\s]+)@([^\\s#]+)/gu)) {',
            '    const expected = actionVersions.get(match[1]);',
            '    if (expected && match[2] !== expected) {',
            '      errors.push(`${file}: ${match[1]} must use ${expected}`);',
            '    }',
            '  }',
            '',
            '  const checkouts = [...source.matchAll(/uses:\\s*actions\\/checkout@v6/gu)].length;',
          ].join('\n');
          const newValidation = [
            '  for (const match of source.matchAll(/uses:\\s*([^@\\s]+)@([^\\s#]+)/gu)) {',
            '    const action = match[1];',
            '    const reference = match[2];',
            "    if (action.startsWith('./')) continue;",
            '    const expected = actionPins.get(action);',
            '    if (!expected) {',
            '      errors.push(`${file}: external action ${action} is not allowlisted`);',
            '      continue;',
            '    }',
            '    if (reference !== expected) {',
            '      errors.push(`${file}: ${action} must use immutable SHA ${expected}`);',
            '    }',
            '  }',
            '',
            '  const checkouts = [...source.matchAll(/uses:\\s*actions\\/checkout@[^\\s#]+/gu)].length;',
          ].join('\n');
          if (!policy.includes(oldPins) || !policy.includes(oldValidation)) {
            throw new Error('CI policy source no longer matches the audited migration baseline');
          }
          policy = policy.replace(oldPins, newPins).replace(oldValidation, newValidation);
          await writeFile(policyPath, policy, 'utf8');
          NODE
      - name: Commit immutable pins to the active task branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HEAD_REF"
          git diff --check
          test "$(grep -RhoE 'uses: [^[:space:]]+@[0-9a-f]{40}' .github/workflows/*.yml | wc -l)" -gt 0
          test -z "$(grep -RhoE 'uses: [^[:space:]]+@v[0-9]+' .github/workflows/*.yml || true)"
          test -z "$(grep -R 'BEGIN TEMPORARY ACTION PIN JOB' .github/workflows || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows scripts/ci-policy.mjs
          git commit -m 'chore(ci): enforce immutable external action pins'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$HEAD_REF"
  # END TEMPORARY ACTION PIN JOB

  repository-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Assert clean trusted governance checkout
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Audit permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Self-test deferred task closure
        run: node .github/governance/deferred-task-closure.mjs --self-test
      - name: Audit complete native main-branch protection
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          RULESET_REPORT: artifacts/repository-governance/report.json
          RULESET_STRICT: true
        run: node scripts/ruleset-policy.mjs check
      - name: Assert governance audit did not mutate tracked files
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload ruleset drift report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-governance-report
          path: artifacts/repository-governance/
          if-no-files-found: error
          retention-days: 30
