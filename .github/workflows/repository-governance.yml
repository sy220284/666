name: Repository Governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/governance/**'
      - '.github/workflows/**'
      - 'scripts/automerge.mjs'
      - 'scripts/ci-policy.mjs'
      - 'scripts/main-verification.mjs'
      - 'scripts/ruleset-policy.mjs'
      - 'docs/process/CI_WORKFLOW_ARCHITECTURE.md'
      - 'docs/process/MAIN_BRANCH_PROTECTION.md'
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-governance-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  migrate-taskctl:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'sy220284/666' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect one-time migration script
        id: route
        shell: bash
        run: |
          if test -f scripts/migrate-taskctl-atomic.mjs; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          version: 11.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ steps.route.outputs.run == 'true' }}
      - name: Generate and format atomic taskctl changes
        if: ${{ steps.route.outputs.run == 'true' }}
        shell: bash
        run: |
          mkdir -p test-results/taskctl-migration
          set -o pipefail
          {
            python - <<'PY'
          from pathlib import Path

          path = Path('scripts/migrate-taskctl-atomic.mjs')
          source = path.read_text()
          replacements = [
              (r"\\n}\\n\\nasync function", r"\\n\\}\\n\\nasync function"),
              (
                  "functionBody.indexOf('writeTaskStateTransaction')",
                  "functionBody.lastIndexOf('writeTaskStateTransaction')",
              ),
              (
                  """const activation = await prepareActivation(
              state,
              implementedIndex,
              next.id,
              transitionAllowedPaths,
            );""",
                  "const activation = await prepareActivation(state, implementedIndex, next.id);",
              ),
          ]
          for before, after in replacements:
              if before not in source:
                  raise SystemExit(f'Migration repair baseline missing: {before!r}')
              source = source.replace(before, after)
          path.write_text(source)
          PY
            node --check scripts/migrate-taskctl-atomic.mjs
            node scripts/migrate-taskctl-atomic.mjs
            python - <<'PY'
          from pathlib import Path

          path = Path('scripts/taskctl.mjs')
          source = path.read_text()
          journal = """function taskTransactionJournalDirectory() {
            return path.resolve(root, git(['rev-parse', '--git-path', 'taskctl-transactions']));
          }
          """
          fallback = """function taskTransactionJournalDirectory() {
            try {
              return path.resolve(root, git(['rev-parse', '--git-path', 'taskctl-transactions']));
            } catch {
              return path.join(root, '.taskctl-transactions');
            }
          }
          """
          if journal not in source:
              raise SystemExit('Transaction journal baseline missing')
          source = source.replace(journal, fallback)
          retired = """async function writeActiveState() {
            throw new Error('writeActiveState is retired; use writeTaskStateTransaction');
          }

          """
          if retired not in source:
              raise SystemExit('Retired writeActiveState baseline missing')
          path.write_text(source.replace(retired, ''))
          PY
            pnpm exec prettier --write \
              scripts/atomic-file-transaction.mjs \
              scripts/taskctl.mjs \
              tests/unit/atomic-file-transaction.test.ts \
              tests/unit/taskctl-transaction-policy.test.ts
          } 2>&1 | tee test-results/taskctl-migration/generate.log
      - name: Validate rollback, recovery and task lifecycle
        if: ${{ steps.route.outputs.run == 'true' }}
        shell: bash
        run: |
          mkdir -p test-results/taskctl-migration
          set -o pipefail
          {
            node --check scripts/atomic-file-transaction.mjs
            node --check scripts/taskctl.mjs
            pnpm exec vitest run \
              tests/unit/atomic-file-transaction.test.ts \
              tests/unit/task-control.test.ts \
              tests/unit/task-ordering.test.ts \
              tests/unit/taskctl-transaction-policy.test.ts \
              tests/integration/task-lifecycle.test.ts
            pnpm task:validate
          } 2>&1 | tee test-results/taskctl-migration/validate.log
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taskctl-atomic-migration-diagnostics
          path: |
            test-results/taskctl-migration/
            scripts/taskctl.mjs
            tests/unit/taskctl-transaction-policy.test.ts
          if-no-files-found: warn
          retention-days: 1
      - name: Commit validated migration and delete one-time script
        if: ${{ steps.route.outputs.run == 'true' && success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/migrate-taskctl-atomic.mjs
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/atomic-file-transaction.mjs \
            scripts/taskctl.mjs \
            scripts/migrate-taskctl-atomic.mjs \
            tests/unit/atomic-file-transaction.test.ts \
            tests/unit/taskctl-transaction-policy.test.ts
          git diff --cached --check
          git commit -m 'fix(governance): make task state transitions recoverable and atomic'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$HEAD_REF"

  repository-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Assert clean trusted governance checkout
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Audit permanent automation inventory
        run: node .github/governance/automation-layout-policy.mjs
      - name: Self-test deferred task closure
        run: node .github/governance/deferred-task-closure.mjs --self-test
      - name: Audit complete native main-branch protection
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          RULESET_REPORT: artifacts/repository-governance/report.json
          RULESET_STRICT: true
        run: node scripts/ruleset-policy.mjs check
      - name: Assert governance audit did not mutate tracked files
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload ruleset drift report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-governance-report
          path: artifacts/repository-governance/
          if-no-files-found: error
          retention-days: 30
