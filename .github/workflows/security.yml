name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine dependency audit route
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          FULL_VALIDATION_DRAFT: ${{ contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->') }}
        run: |
          set -euo pipefail
          run=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            run=true
          elif [ "$PR_DRAFT" = true ] && [ "$FULL_VALIDATION_DRAFT" != true ]; then
            echo "Dependency audit deferred until Ready or the exact full-validation-draft marker."
          else
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            run="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs dependency-audit)"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ steps.route.outputs.run == 'true' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Clean tree before dependency audit
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ steps.route.outputs.run == 'true' }}
      - name: Audit high-severity dependency vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.route.outputs.run }}" = true ]; then
            pnpm audit --audit-level=high
          else
            echo "Dependency audit skipped because package-manager inputs are unchanged."
          fi
      - name: Clean tree after dependency audit
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  supply-chain-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine supply-chain inventory route
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          FULL_VALIDATION_DRAFT: ${{ contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->') }}
        run: |
          set -euo pipefail
          run=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            run=true
          elif [ "$PR_DRAFT" = true ] && [ "$FULL_VALIDATION_DRAFT" != true ]; then
            echo "Supply-chain inventory deferred until Ready or the exact full-validation-draft marker."
          else
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            run="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs supply-chain-inventory)"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ steps.route.outputs.run == 'true' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896455e5dc5ba9c38 # v6
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Clean tree before supply-chain inventory
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ steps.route.outputs.run == 'true' }}
      - name: Validate supply-chain inventory policy
        if: ${{ steps.route.outputs.run == 'true' }}
        run: pnpm exec vitest run tests/unit/supply-chain-inventory-policy.test.ts
      - name: Generate SBOM and license inventory
        shell: bash
        run: |
          mkdir -p test-results/security/supply-chain
          set -o pipefail
          if [ "${{ steps.route.outputs.run }}" = true ]; then
            node scripts/supply-chain-inventory.mjs 2>&1 |
              tee test-results/security/supply-chain/supply-chain-inventory.log
          else
            echo "Supply-chain inventory skipped because dependency authority inputs are unchanged." |
              tee test-results/security/supply-chain/supply-chain-inventory.log
          fi
      - name: Upload supply-chain inventory evidence
        if: ${{ always() && steps.route.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-inventory
          path: test-results/security/supply-chain/
          if-no-files-found: error
          retention-days: 30
      - name: Clean tree after supply-chain inventory
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e289645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Clean tree before repository secret scan
        run: node .github/governance/assert-clean-tree.mjs
      - name: Scan repository secrets
        shell: bash
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          FULL_VALIDATION_DRAFT: ${{ contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->') }}
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$PR_DRAFT" = true ] && [ "$FULL_VALIDATION_DRAFT" != true ]; then
            echo "Draft mode: scanning the current tracked tree; full history runs when Ready or the exact full-validation-draft marker."
            node scripts/scan-secrets.mjs 2>&1 | tee test-results/ci/secret-scan.log
          else
            node scripts/scan-secrets.mjs --history 2>&1 | tee test-results/ci/secret-scan.log
          fi
      - name: Upload secret scan diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secret-scan-diagnostics
          path: test-results/ci/secret-scan.log
          if-no-files-found: error
          retention-days: 7
      - name: Clean tree after repository secret scan
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  application-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine application security route
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          FULL_VALIDATION_DRAFT: ${{ contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->') }}
        run: |
          set -euo pipefail
          run=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            run=true
          elif [ "$PR_DRAFT" = true ] && [ "$FULL_VALIDATION_DRAFT" != true ]; then
            echo "Application security tests deferred until Ready or the exact full-validation-draft marker."
          else
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            if [ -z "$changed_files" ]; then
              run=true
            else
              run="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs application-security)"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ steps.route.outputs.run == 'true' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ steps.route.outputs.run == 'true' }}
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Clean tree before application checks
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ steps.route.outputs.run == 'true' }}
      - run: pnpm test:prepare
        if: ${{ steps.route.outputs.run == 'true' }}
      - name: Run application security tests
        shell: bash
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          if [ "${{ steps.route.outputs.run }}" = true ]; then
            pn`m test:security 2>&1 | tee test-results/ci/application-security.log
          else
            echo "Application security suite skipped because no runtime or security-authority input changed." |
              tee test-results/ci/application-security.log
          fi
      - name: Upload application security diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application-security-diagnostics
          path: |
            test-results/ci/application-security.log
            test-results/security/
          if-no-files-found: warn
          retention-days: 7
      - name: Clean tree after application checks
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  security:
    name: security
    if: always()
    needs:
      - dependency-audit
      - supply-chain-inventory
      - secret-scan
      - application-security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      INVENTORY_RESULT: ${{ needs.supply-chain-inventory.result }}
      SECRET_RESULT: ${{ needs.secret-scan.result }}
      APP_RESULT: ${{ needs.application-security.result }}
    steps:
      - name: Enforce security result
        shell: bash
        run: |
          set -euo pipefail
          printf 'audit=%s\ninventory=%s\nscan=%s\napplication=%s\n' \
            "$AUDIT_RESULT" "$INVENTORY_RESULT" "$SECRET_RESULT" "$APP_RESULT"
          test "$AUDIT_RESULT" = success
          test "$INVENTORY_RESULT" = success
          test "$SECRET_RESULT" = success
          test "$APP_RESULT" = success
