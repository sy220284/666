name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: security-route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dependency_audit: ${{ steps.route.outputs.dependency_audit }}
      supply_chain_inventory: ${{ steps.route.outputs.supply_chain_inventory }}
      application_security: ${{ steps.route.outputs.application_security }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine security validation route once
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          FULL_VALIDATION_DRAFT: ${{ contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->') }}
        run: |
          set -euo pipefail
          dependency_audit=false
          supply_chain_inventory=false
          application_security=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            dependency_audit=true
            supply_chain_inventory=true
            application_security=true
          elif [ "$PR_DRAFT" = true ] && [ "$FULL_VALIDATION_DRAFT" != true ]; then
            echo "Heavy security checks are deferred until Ready or the exact full-validation-draft marker."
          else
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            if [ -z "$changed_files" ]; then
              application_security=true
            else
              dependency_audit="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs dependency-audit)"
              supply_chain_inventory="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs supply-chain-inventory)"
              application_security="$(printf '%s\n' "$changed_files" | node scripts/ci-risk-policy.mjs application-security)"
            fi
          fi
          echo "dependency_audit=$dependency_audit" >> "$GITHUB_OUTPUT"
          echo "supply_chain_inventory=$supply_chain_inventory" >> "$GITHUB_OUTPUT"
          echo "application_security=$application_security" >> "$GITHUB_OUTPUT"
          echo "Security risk plan: dependency=$dependency_audit; supply-chain=$supply_chain_inventory; application=$application_security"

  dependency-audit:
    needs: route
    if: ${{ needs.route.outputs.dependency_audit == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Clean tree before dependency audit
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit high-severity dependency vulnerabilities
        run: pnpm audit --audit-level=high
      - name: Clean tree after dependency audit
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  supply-chain-inventory:
    needs: route
    if: ${{ needs.route.outputs.supply_chain_inventory == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Clean tree before supply-chain inventory
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate supply-chain inventory policy
        run: pnpm exec vitest run tests/unit/supply-chain-inventory-policy.test.ts
      - name: Generate SBOM and license inventory
        shell: bash
        run: |
          mkdir -p test-results/security/supply-chain
          set -o pipefail
          node scripts/supply-chain-inventory.mjs 2>&1 |
            tee test-results/security/supply-chain/supply-chain-inventory.log
      - name: Upload supply-chain inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-inventory
          path: test-results/security/supply-chain/
          if-no-files-found: error
          retention-days: 30
      - name: Clean tree after supply-chain inventory
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Clean tree before repository secret scan
        run: node .github/governance/assert-clean-tree.mjs
      - name: Scan repository secrets at the appropriate scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          FULL_VALIDATION_DRAFT: ${{ contains(github.event.pull_request.body || '', '<!-- full-validation-draft -->') }}
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            node scripts/scan-secrets.mjs --history 2>&1 | tee test-results/ci/secret-scan.log
          elif [ "$PR_DRAFT" = true ] && [ "$FULL_VALIDATION_DRAFT" != true ]; then
            node scripts/scan-secrets.mjs 2>&1 | tee test-results/ci/secret-scan.log
          else
            node scripts/scan-secrets.mjs --base "$BASE_SHA" 2>&1 | tee test-results/ci/secret-scan.log
          fi
      - name: Upload secret scan diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secret-scan-diagnostics
          path: test-results/ci/secret-scan.log
          if-no-files-found: error
          retention-days: 7
      - name: Clean tree after repository secret scan
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  application-security:
    needs: route
    if: ${{ needs.route.outputs.application_security == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Clean tree before application checks
        run: node .github/governance/assert-clean-tree.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:prepare
      - name: Run application security tests
        shell: bash
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          pnpm test:security 2>&1 | tee test-results/ci/application-security.log
      - name: Upload application security diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application-security-diagnostics
          path: |
            test-results/ci/application-security.log
            test-results/security/
          if-no-files-found: warn
          retention-days: 7
      - name: Clean tree after application checks
        if: always()
        run: node .github/governance/assert-clean-tree.mjs

  security:
    name: security
    if: always()
    needs:
      - route
      - dependency-audit
      - supply-chain-inventory
      - secret-scan
      - application-security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ROUTE_RESULT: ${{ needs.route.result }}
      DEPENDENCY_REQUIRED: ${{ needs.route.outputs.dependency_audit }}
      INVENTORY_REQUIRED: ${{ needs.route.outputs.supply_chain_inventory }}
      APPLICATION_REQUIRED: ${{ needs.route.outputs.application_security }}
      AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      INVENTORY_RESULT: ${{ needs.supply-chain-inventory.result }}
      SECRET_RESULT: ${{ needs.secret-scan.result }}
      APP_RESULT: ${{ needs.application-security.result }}
    steps:
      - name: Enforce security result
        shell: bash
        run: |
          set -euo pipefail
          printf 'route=%s\ndependency-required=%s\naudit=%s\ninventory-required=%s\ninventory=%s\nscan=%s\napplication-required=%s\napplication=%s\n' \
            "$ROUTE_RESULT" "$DEPENDENCY_REQUIRED" "$AUDIT_RESULT" "$INVENTORY_REQUIRED" "$INVENTORY_RESULT" \
            "$SECRET_RESULT" "$APPLICATION_REQUIRED" "$APP_RESULT"
          test "$ROUTE_RESULT" = success
          test "$SECRET_RESULT" = success

          require_optional_job() {
            required="$1"
            result="$2"
            label="$3"
            if [ "$required" = true ]; then
              test "$result" = success || {
                echo "$label was enabled but did not succeed: $result" >&2
                exit 1
              }
              return
            fi
            case "$result" in
              success|skipped) ;;
              *)
                echo "$label produced an invalid disabled result: $result" >&2
                exit 1
                ;;
            esac
          }

          require_optional_job "$DEPENDENCY_REQUIRED" "$AUDIT_RESULT" dependency-audit
          require_optional_job "$INVENTORY_REQUIRED" "$INVENTORY_RESULT" supply-chain-inventory
          require_optional_job "$APPLICATION_REQUIRED" "$APP_RESULT" application-security
