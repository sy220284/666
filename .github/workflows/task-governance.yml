name: Task Governance Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '11 4 * * 1'

permissions:
  contents: read

concurrency:
  group: task-governance-audit
  cancel-in-progress: true

jobs:
  task-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Audit task metadata without blocking pull requests
        run: node .github/governance/single-work-taskctl.mjs validate
