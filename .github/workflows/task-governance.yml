name: Task Governance Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '11 4 * * 1'

permissions:
  contents: read

concurrency:
  group: task-governance-audit
  cancel-in-progress: true

jobs:
  task-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
      - name: Audit task metadata without blocking pull requests
        run: node .github/governance/single-work-taskctl.mjs validate
