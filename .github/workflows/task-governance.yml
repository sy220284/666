name: Task Governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: task-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  task-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TASK_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      TASK_EVENT_NAME: ${{ github.event_name }}
      TASK_PR_HEAD_REF: ${{ github.head_ref }}
      TASK_PR_DRAFT: ${{ github.event.pull_request.draft }}
      TASK_PR_READY: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve effective PR base
        run: |
          base_ref="$(git merge-base "origin/${TASK_BASE_BRANCH}" HEAD)"
          echo "TASK_BASE_REF=${base_ref}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Assert clean working tree before task validation
        run: node .github/governance/assert-clean-tree.mjs
      - name: Detect task marker
        id: task
        run: |
          if node .github/governance/single-work-policy.mjs has-marker; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate unique work task governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/governance/single-work-policy.mjs validate
      - name: Materialize base task state
        if: ${{ steps.task.outputs.enabled != 'true' }}
        run: |
          git show "${TASK_BASE_REF}:docs/tasks/ACTIVE_TASK.json" > "$RUNNER_TEMP/base-active-task.json"
          git show "${TASK_BASE_REF}:docs/tasks/TASK_INDEX.md" > "$RUNNER_TEMP/base-task-index.md"
      - name: Validate active task and generated mirror
        if: ${{ steps.task.outputs.enabled != 'true' }}
        run: node .github/governance/verification-hold-taskctl.mjs validate
      - name: Detect task state transition
        if: ${{ steps.task.outputs.enabled != 'true' }}
        id: transition
        run: |
          if git diff --quiet "$TASK_BASE_REF" HEAD -- docs/tasks/ACTIVE_TASK.json docs/tasks/TASK_INDEX.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Self-test task governance
        run: |
          node .github/governance/single-work-policy.mjs self-test
          node .github/governance/task-checkpoint-policy.mjs self-test
      - name: Validate task transition for Ready PRs
        if: ${{ steps.task.outputs.enabled != 'true' && steps.transition.outputs.changed == 'true' && !contains(github.event.pull_request.body || '', '<!-- task-checkpoint -->') }}
        env:
          TASK_BASE_STATE_PATH: ${{ runner.temp }}/base-active-task.json
          TASK_BASE_INDEX_PATH: ${{ runner.temp }}/base-task-index.md
        run: node .github/governance/task-transition-policy.mjs
      - name: Validate active task checkpoint
        if: ${{ steps.task.outputs.enabled != 'true' && steps.transition.outputs.changed == 'true' && contains(github.event.pull_request.body || '', '<!-- task-checkpoint -->') }}
        env:
          TASK_BASE_STATE_PATH: ${{ runner.temp }}/base-active-task.json
          TASK_BASE_INDEX_PATH: ${{ runner.temp }}/base-task-index.md
        run: node .github/governance/task-checkpoint-policy.mjs
      - name: Enforce milestone close and evidence reachability
        if: ${{ steps.task.outputs.enabled != 'true' && steps.transition.outputs.changed == 'true' }}
        env:
          TASK_BASE_STATE_PATH: ${{ runner.temp }}/base-active-task.json
          TASK_BASE_INDEX_PATH: ${{ runner.temp }}/base-task-index.md
        run: node .github/governance/stage-close-policy.mjs
      - name: Assert clean working tree after task validation
        if: always()
        run: node .github/governance/assert-clean-tree.mjs
