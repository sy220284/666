name: Temporary Evidence Rehash

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  rehash:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Recalculate final evidence manifests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json

          for task_id in ('M4-01', 'M4-02', 'M4-03'):
              directory = Path('docs/test-evidence') / task_id
              manifest_path = directory / 'manifest.json'
              manifest = json.loads(manifest_path.read_text())
              entries = []
              for path in sorted(directory.rglob('*')):
                  if not path.is_file() or path.name == 'manifest.json':
                      continue
                  content = path.read_bytes()
                  entries.append({
                      'path': path.relative_to(directory).as_posix(),
                      'bytes': len(content),
                      'sha256': hashlib.sha256(content).hexdigest(),
                  })
              manifest['files'] = entries
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
          python3 -m json.tool docs/test-evidence/M4-01/manifest.json >/dev/null
          python3 -m json.tool docs/test-evidence/M4-02/manifest.json >/dev/null
          python3 -m json.tool docs/test-evidence/M4-03/manifest.json >/dev/null
      - name: Commit corrected manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-evidence/M4-01/manifest.json docs/test-evidence/M4-02/manifest.json docs/test-evidence/M4-03/manifest.json
          git commit -m "证据：重算M4-01至M4-03终验清单"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
