name: Temporary Format Repair

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/temporary-format-repair.yml'

permissions:
  contents: write

concurrency:
  group: temporary-format-repair-work
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            .github/workflows/full-work-validation.yml \
            .github/governance/automation-layout-policy.mjs \
            .github/governance/single-work-policy.mjs \
            tests/unit/full-work-validation.test.ts \
            pnpm-workspace.yaml \
            pnpm-lock.yaml
      - name: Commit formatting result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/full-work-validation.yml \
            .github/governance/automation-layout-policy.mjs \
            .github/governance/single-work-policy.mjs \
            tests/unit/full-work-validation.test.ts \
            pnpm-workspace.yaml \
            pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'All selected files already match repository formatting.'
            exit 0
          fi
          git commit -m '格式：应用仓库锁定Prettier结果'
          git push origin HEAD:work
