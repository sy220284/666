name: Temporary Lock Refresh

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - shell: bash
        run: |
          mkdir -p test-results/lock-refresh
          pnpm audit --json > test-results/lock-refresh/audit.json || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: refreshed-security-lock
          path: |
            pnpm-lock.yaml
            test-results/lock-refresh/audit.json
          if-no-files-found: error
          retention-days: 1
