name: Temporary Lockfile Refresh

on:
  push:
    branches: [work]
    paths:
      - 'pnpm-workspace.yaml'
      - '.github/workflows/temporary-lockfile-refresh.yml'

permissions:
  contents: write

concurrency:
  group: temporary-lockfile-refresh-work
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile with repository pnpm
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify high-severity dependency audit
        run: pnpm audit --audit-level=high
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already matches the requested overrides.'
            exit 0
          fi
          git commit -m '安全：重生成依赖锁文件'
          git push origin HEAD:work
