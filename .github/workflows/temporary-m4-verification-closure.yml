name: Temporary M4 Verification Closure

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  close-m4:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Generate M4-01—M4-03 final closure
        run: python3 .github/governance/temporary-close-m4.py
      - name: Normalize generated text
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path('docs/tasks/ACTIVE_TASK.md'),
              Path('docs/tasks/TASK_INDEX.md'),
              Path('docs/tasks/M4_TASKS.md'),
              Path('docs/tasks/M4/M4-01_FTS_INDEX_DICTIONARY.md'),
              Path('docs/tasks/M4/M4-02_CONSTRAINT_PACKAGE.md'),
              Path('docs/tasks/M4/M4-03_PROVIDER_CREDENTIAL_CONNECTION.md'),
              Path('docs/product/V1.0_TRACEABILITY_MATRIX.md'),
          ]
          for directory in (
              Path('docs/test-evidence/M4-01'),
              Path('docs/test-evidence/M4-02'),
              Path('docs/test-evidence/M4-03'),
          ):
              files.extend(directory.glob('*.md'))
              files.extend(directory.glob('*.txt'))
          for path in files:
              if not path.exists():
                  continue
              source = path.read_text()
              normalized = '\n'.join(line.rstrip() for line in source.splitlines()) + '\n'
              path.write_text(normalized)
          PY
      - name: Validate generated JSON
        shell: bash
        run: |
          python3 -m json.tool docs/tasks/ACTIVE_TASK.json >/dev/null
          python3 -m json.tool package.json >/dev/null
          python3 -m json.tool docs/test-evidence/M4-01/manifest.json >/dev/null
          python3 -m json.tool docs/test-evidence/M4-02/manifest.json >/dev/null
          python3 -m json.tool docs/test-evidence/M4-03/manifest.json >/dev/null
      - name: Commit generated closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json docs/tasks docs/product/V1.0_TRACEABILITY_MATRIX.md docs/test-evidence/M4-01 docs/test-evidence/M4-02 docs/test-evidence/M4-03
          git commit -m "治理：完全关闭M4-01至M4-03并暂缓M4-04"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
