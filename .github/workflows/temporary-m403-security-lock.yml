name: Temporary M403 Security Lock

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply minimal lock security patch
        shell: bash
        run: |
          git show origin/main:pnpm-lock.yaml > pnpm-lock.yaml
          python3 <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          source = path.read_text()
          replacements = [
              (
                  "settings:\n  autoInstallPeers: true\n  excludeLinksFromLockfile: false\n\nimporters:",
                  "settings:\n  autoInstallPeers: true\n  excludeLinksFromLockfile: false\n\noverrides:\n  brace-expansion: 5.0.8\n\nimporters:",
              ),
              (
                  "  brace-expansion@5.0.7:\n    resolution:\n      {\n        integrity: sha512-7oFy703dxfY3/NLxC1fh2SUCQ0H9rmAY+5EpDVfXjUTTs+HEwR2nYaqLv+GWcTsumwxPfiz6CzCNkwXwBUwqCA==,\n      }\n    engines: { node: 18 || 20 || >=22 }",
                  "  brace-expansion@5.0.8:\n    resolution:\n      {\n        integrity: sha512-JZyDyq3D4AUifKTPOB7DELf6XsB3WdPuNxCtob1vFXPsSXhdAiHBWJ/tJ8HAc9aH84BK+5JFZLNkJKx3G9kzQg==,\n      }\n    engines: { node: 20 || >=22 }",
              ),
              ("  brace-expansion@5.0.7:\n    dependencies:", "  brace-expansion@5.0.8:\n    dependencies:"),
              ("      brace-expansion: 5.0.7", "      brace-expansion: 5.0.8"),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one lock replacement, found {count}: {old[:60]!r}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm audit --audit-level high
      - name: Commit generated lock file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "安全：刷新brace-expansion修复锁文件"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
