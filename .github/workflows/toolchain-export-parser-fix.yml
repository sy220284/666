name: One-time Toolchain Export Parser Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: toolchain-export-parser-fix
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Apply exact parser and lint fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/governance/toolchain-bundle.mjs')
          s = p.read_text()
          old_globals = '/* global console, fetch, process, setTimeout */'
          new_globals = '/* global URL, console, fetch, process, setTimeout */'
          old_regex = "const match = /^ {2}(.+):$/u.exec(line);"
          new_regex = "const match = /^ {2}(\\S.*):$/u.exec(line);"
          if old_globals not in s:
              raise SystemExit('expected globals declaration not found')
          if old_regex not in s:
              raise SystemExit('expected lockfile package-key regex not found')
          s = s.replace(old_globals, new_globals, 1)
          s = s.replace(old_regex, new_regex, 1)
          p.write_text(s)
          PY
          git diff --check
          node --check .github/governance/toolchain-bundle.mjs
      - name: Write back exact fix
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin work
          test "$(git rev-parse origin/work)" = "$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/governance/toolchain-bundle.mjs
          git commit -m "fix: parse only top-level toolchain lockfile packages [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:work
