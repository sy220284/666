name: Toolchain Export

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to export from
        required: true
        type: string
      profile:
        description: Offline toolchain profile
        required: true
        type: string
      runner:
        description: Hosted runner used to build the platform-specific bundle
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to export from
        required: true
        type: string
      profile:
        description: Minimal offline toolchain profile
        required: true
        default: formatter
        type: choice
        options:
          - formatter
          - quality
      runner:
        description: Hosted runner used to build the platform-specific bundle
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

permissions:
  contents: read

concurrency:
  group: toolchain-export-${{ inputs.source_sha }}-${{ inputs.profile }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  export:
    name: export-${{ inputs.profile }}-${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      TOOLCHAIN_AUTHORITY: docs/process/CURRENT_WORKSPACE_TOOLCHAIN.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
      - name: Validate exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Validate permanent toolchain authority
        run: node .github/governance/toolchain-bundle.mjs validate-authority
      - name: Assert clean source checkout
        run: node .github/governance/assert-clean-tree.mjs
      - name: Export and verify offline toolchain
        env:
          TOOLCHAIN_OUTPUT: ${{ runner.temp }}/worldforge-toolchain
          TOOLCHAIN_PROFILE: ${{ inputs.profile }}
          TOOLCHAIN_SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          node .github/governance/toolchain-bundle.mjs export
          --profile "$TOOLCHAIN_PROFILE"
          --source-sha "$TOOLCHAIN_SOURCE_SHA"
      - name: Assert source checkout remained clean
        run: node .github/governance/assert-clean-tree.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            worldforge-toolchain-${{ inputs.profile }}-${{ runner.os }}-${{
            runner.arch }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/worldforge-toolchain/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
