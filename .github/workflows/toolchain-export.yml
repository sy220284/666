name: Toolchain Export

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to export from
        required: true
        type: string
      profile:
        description: Minimal offline toolchain profile
        required: true
        default: formatter
        type: choice
        options:
          - formatter
          - quality
      runner:
        description: Hosted runner used to build the platform-specific bundle
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
  push:
    branches:
      - work
    paths:
      - .github/workflows/toolchain-export.yml

permissions:
  contents: read

concurrency:
  group: toolchain-export-${{ inputs.source_sha || github.sha }}-${{ inputs.profile || 'quality' }}-${{ inputs.runner || 'ubuntu-24.04' }}
  cancel-in-progress: false

jobs:
  export:
    name: export-${{ inputs.profile || 'quality' }}-${{ inputs.runner || 'ubuntu-24.04' }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Assert clean source checkout
        run: node .github/governance/assert-clean-tree.mjs
      - name: Export and verify offline toolchain
        env:
          TOOLCHAIN_OUTPUT: ${{ runner.temp }}/worldforge-toolchain
          TOOLCHAIN_PROFILE: ${{ inputs.profile || 'quality' }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: >-
          node .github/governance/toolchain-bundle.mjs export
          --profile "$TOOLCHAIN_PROFILE"
          --source-sha "$SOURCE_SHA"
      - name: Assert source checkout remained clean
        run: node .github/governance/assert-clean-tree.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worldforge-toolchain-${{ inputs.profile || 'quality' }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/worldforge-toolchain/
          if-no-files-found: error
          retention-days: 7
