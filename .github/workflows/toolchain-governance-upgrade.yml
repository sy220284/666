name: Toolchain Governance Upgrade

on:
  push:
    branches:
      - chore/toolchain-governance-20260810

permissions:
  contents: write
  statuses: write

concurrency:
  group: toolchain-governance-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Mark governance run pending
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -d '{"state":"pending","context":"toolchain-governance","description":"Governed toolchain upgrade is running"}'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/toolchain-governance-20260810
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1

      - name: Install governed pnpm runtime
        run: npm install --global pnpm@11.21.0

      - name: Install Electron display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb

      - name: Apply and validate governance upgrade
        id: upgrade
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          rm -f .toolchain-governance-failure.log
          python3 -c "from pathlib import Path; p=Path('scripts/toolchain-governance-upgrade-runner.mjs'); s=p.read_text(); p.write_text(s.replace(r'\\1  version', r'\\1 {2}version'))"
          node scripts/toolchain-governance-upgrade-runner.mjs 2>&1 | tee /tmp/toolchain-governance-validation.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/toolchain-governance-validation.log .toolchain-governance-failure.log
          fi
          exit "$status"

      - name: Commit verified governance upgrade
        if: ${{ success() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: upgrade and verify governed toolchain"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:chore/toolchain-governance-20260810

      - name: Persist failure evidence
        if: ${{ failure() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f .toolchain-governance-failure.log ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .toolchain-governance-failure.log
            git commit -m "ci: record toolchain governance validation failure"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:chore/toolchain-governance-20260810
          fi

      - name: Publish governance result
        if: ${{ always() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Governed toolchain upgrade verified'
          else
            state=failure
            description='Governed toolchain upgrade failed'
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"toolchain-governance\",\"description\":\"${description}\"}"
