name: Toolchain Governance Upgrade

on:
  push:
    branches: [chore/toolchain-governance-20260810]

permissions:
  contents: write

concurrency:
  group: toolchain-governance-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1

      - name: Apply governed toolchain baseline
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');
          const write = (file, content) => fs.writeFileSync(path.join(root, file), content);
          const updateJson = (file, mutate) => {
            const value = JSON.parse(read(file));
            mutate(value);
            write(file, `${JSON.stringify(value, null, 2)}\n`);
          };

          const versions = {
            node: '24.18.1',
            pnpm: '11.21.0',
            nodeTypes: '24.13.3',
            electron: '43.2.0',
            playwright: '1.62.0',
            eslint: '10.8.0',
            prettier: '3.9.6',
            typescriptEslint: '8.65.0',
          };

          updateJson('package.json', (pkg) => {
            pkg.packageManager = `pnpm@${versions.pnpm}`;
            pkg.engines.node = `>=${versions.node} <25.0.0`;
            pkg.engines.pnpm = `>=${versions.pnpm} <12.0.0`;
            pkg.scripts['toolchain:check'] = 'node scripts/toolchain-policy.mjs';
            pkg.scripts['ci:policy'] =
              'node scripts/toolchain-policy.mjs && node scripts/workflow-structure-policy.mjs && node scripts/ci-policy.mjs && node scripts/check-coverage-policy.mjs && node scripts/code-quality-policy.mjs';
            Object.assign(pkg.devDependencies, {
              '@playwright/test': versions.playwright,
              '@types/node': versions.nodeTypes,
              electron: versions.electron,
              eslint: versions.eslint,
              prettier: versions.prettier,
              'typescript-eslint': versions.typescriptEslint,
            });
          });

          for (const file of [
            'apps/desktop/main/package.json',
            'apps/desktop/preload/package.json',
            'packages/core-service/package.json',
            'packages/testkit/package.json',
          ]) {
            updateJson(file, (pkg) => {
              if (pkg.devDependencies?.['@types/node']) {
                pkg.devDependencies['@types/node'] = versions.nodeTypes;
              }
              if (pkg.devDependencies?.electron) {
                pkg.devDependencies.electron = versions.electron;
              }
            });
          }

          let workspace = read('pnpm-workspace.yaml');
          workspace = workspace.replace(
            /\nallowBuilds:/u,
            '\nengineStrict: true\npreferFrozenLockfile: true\nstrictPeerDependencies: true\n\nallowBuilds:',
          );
          workspace = workspace.replace(
            /\nminimumReleaseAgeExclude:\n(?:  - .*\n?)+$/u,
            '\n',
          );
          write('pnpm-workspace.yaml', workspace);
          if (fs.existsSync(path.join(root, '.npmrc'))) fs.rmSync(path.join(root, '.npmrc'));

          updateJson('docs/process/CURRENT_WORKSPACE_TOOLCHAIN.json', (authority) => {
            authority.bundledPnpmVersion = versions.pnpm;
            authority.nodeRuntimeVersion = versions.node;
          });

          const workflowDir = path.join(root, '.github/workflows');
          const files = fs.readdirSync(workflowDir).filter((name) => name.endsWith('.yml') || name.endsWith('.yaml'));
          for (const name of files) {
            if (name === 'toolchain-governance-upgrade.yml') continue;
            const file = path.join(workflowDir, name);
            let content = fs.readFileSync(file, 'utf8');
            content = content
              .replaceAll(
                'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6',
                'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2',
              )
              .replaceAll(
                'pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4',
                'pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9',
              )
              .replaceAll(
                'actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6',
                'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0',
              )
              .replaceAll('version: 11.13.1', `version: ${versions.pnpm}`)
              .replaceAll('node-version: 24', `node-version: ${versions.node}`);
            fs.writeFileSync(file, content);
          }

          for (const file of ['scripts/ci-policy.mjs', 'scripts/workflow-structure-policy.mjs']) {
            let content = read(file);
            content = content
              .replaceAll(
                'd23441a48e516b6c34aea4fa41551a30e30af803',
                'de0fac2e4500dabe0009e67214ff5f5447ce83dd',
              )
              .replaceAll(
                'b906affcce14559ad1aafd4ab0e942779e9f58b1',
                '0ebf47130e4866e96fce0953f49152a61190b271',
              )
              .replaceAll(
                '249970729cb0ef3589644e2896645e5dc5ba9c38',
                '48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e',
              )
              .replaceAll('11.13.1', versions.pnpm)
              .replaceAll("node-version: 24", `node-version: ${versions.node}`);
            write(file, content);
          }

          let doc = read('docs/process/CURRENT_WORKSPACE_TOOLCHAIN.md');
          const replacements = [
            ['文档日期：2026-08-05', '文档日期：2026-08-10'],
            ['| Node.js | 24.18.0 |', `| Node.js | ${versions.node} |`],
            ['| pnpm | 11.13.1 |', `| pnpm | ${versions.pnpm} |`],
            ['| Prettier | 3.9.5 |', `| Prettier | ${versions.prettier} |`],
            ['| ESLint | 10.7.0 |', `| ESLint | ${versions.eslint} |`],
            ['| typescript-eslint | 8.64.0 |', `| typescript-eslint | ${versions.typescriptEslint} |`],
            ['| Electron | 43.1.1 |', `| Electron | ${versions.electron} |`],
            ['| Playwright | 1.61.1 |', `| Playwright | ${versions.playwright} |`],
            ['并在`package.json`中锁定pnpm 11.13.1。', `并在\`package.json\`中锁定pnpm ${versions.pnpm}。`],
          ];
          for (const [from, to] of replacements) doc = doc.replaceAll(from, to);
          const marker = '## 4. 激活方式';
          const governance = `## 3.1 2026-08-10 工具链治理基线\n\n本轮将仓库与CI工具链统一到经过核验的稳定版本：Node.js ${versions.node} LTS、pnpm ${versions.pnpm}、Electron ${versions.electron}、Playwright ${versions.playwright}、ESLint ${versions.eslint}、Prettier ${versions.prettier}、typescript-eslint ${versions.typescriptEslint}，并将 \`@types/node\` 对齐到 Node 24 类型线（${versions.nodeTypes}）。TypeScript 继续保持 6.0.3，避免越过 typescript-eslint 当前官方支持上界。\n\n项目级 pnpm 设置从 \`.npmrc\` 迁入 \`pnpm-workspace.yaml\`。从 pnpm 11 起，除 registry/auth 外的项目设置以 \`pnpm-workspace.yaml\` 为权威；因此 \`engineStrict\`、\`preferFrozenLockfile\`、\`strictPeerDependencies\` 均由 workspace 文件统一声明，原仅包含这些设置的 \`.npmrc\` 删除。\n\nGitHub Actions 固定升级到 checkout v6.0.2、pnpm/action-setup v6.0.9、setup-node v6.4.0 的完整提交SHA，Node CI运行时固定为 ${versions.node}，pnpm固定为 ${versions.pnpm}。暂不迁移到新的 \`pnpm/setup\`：其 v2 与 pnpm 11 的 Intel macOS 独立二进制存在官方限制，而仓库仍保留 macOS 打包矩阵。\n\n仓库新增 \`pnpm toolchain:check\`，并并入 \`pnpm ci:policy\`，用于持续阻止 packageManager、工具链权威清单、workspace重复依赖版本和CI运行时发生漂移。\n\n> 如果持久化目录 \`/mnt/data/666-toolchain\` 仍是旧版本，它只能视为历史快照；必须依据本轮新的 package.json、pnpm-lock.yaml 和工具链权威清单重新导出并复验后，才能替换现有工作空间资产。\n\n`;
          if (!doc.includes('## 3.1 2026-08-10 工具链治理基线')) {
            doc = doc.replace(marker, `${governance}${marker}`);
          }
          write('docs/process/CURRENT_WORKSPACE_TOOLCHAIN.md', doc);
          NODE

          cat > scripts/toolchain-policy.mjs <<'EOF'
          import { readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';

          const root = process.cwd();
          const readText = (file) => readFile(path.join(root, file), 'utf8');
          const readJson = async (file) => JSON.parse(await readText(file));
          const fail = (message) => {
            throw new Error(`TOOLCHAIN_POLICY: ${message}`);
          };

          const rootPackage = await readJson('package.json');
          const authority = await readJson('docs/process/CURRENT_WORKSPACE_TOOLCHAIN.json');
          const expectedPnpm = authority.bundledPnpmVersion;
          const expectedNode = authority.nodeRuntimeVersion;
          const expectedNodeTypes = rootPackage.devDependencies['@types/node'];
          const expectedElectron = rootPackage.devDependencies.electron;

          if (rootPackage.packageManager !== `pnpm@${expectedPnpm}`) {
            fail(`packageManager ${rootPackage.packageManager} does not match authority pnpm ${expectedPnpm}`);
          }
          if (!rootPackage.engines.node.includes(expectedNode)) {
            fail(`Node engine ${rootPackage.engines.node} does not include governed runtime ${expectedNode}`);
          }
          if (!rootPackage.engines.pnpm.includes(expectedPnpm)) {
            fail(`pnpm engine ${rootPackage.engines.pnpm} does not include governed pnpm ${expectedPnpm}`);
          }

          const workspace = await readText('pnpm-workspace.yaml');
          for (const setting of ['engineStrict: true', 'preferFrozenLockfile: true', 'strictPeerDependencies: true']) {
            if (!workspace.includes(setting)) fail(`missing pnpm workspace setting: ${setting}`);
          }

          const packageFiles = [
            'apps/desktop/main/package.json',
            'apps/desktop/preload/package.json',
            'packages/core-service/package.json',
            'packages/testkit/package.json',
          ];
          for (const file of packageFiles) {
            const pkg = await readJson(file);
            if (pkg.devDependencies?.['@types/node'] && pkg.devDependencies['@types/node'] !== expectedNodeTypes) {
              fail(`${file} @types/node ${pkg.devDependencies['@types/node']} != root ${expectedNodeTypes}`);
            }
            if (pkg.devDependencies?.electron && pkg.devDependencies.electron !== expectedElectron) {
              fail(`${file} electron ${pkg.devDependencies.electron} != root ${expectedElectron}`);
            }
          }

          const workflowsDir = path.join(root, '.github/workflows');
          for (const name of await readdir(workflowsDir)) {
            if (!name.endsWith('.yml') && !name.endsWith('.yaml')) continue;
            if (name === 'toolchain-governance-upgrade.yml') continue;
            const content = await readFile(path.join(workflowsDir, name), 'utf8');
            if (content.includes('pnpm/action-setup@') && content.includes('version: 11.13.1')) {
              fail(`${name} still pins old pnpm 11.13.1`);
            }
            for (const match of content.matchAll(/version:\s+(11\.\d+\.\d+)/gu)) {
              if (match[1] !== expectedPnpm) fail(`${name} pnpm ${match[1]} != ${expectedPnpm}`);
            }
            for (const match of content.matchAll(/node-version:\s+([0-9.]+)/gu)) {
              if (match[1] !== expectedNode) fail(`${name} Node ${match[1]} != ${expectedNode}`);
            }
          }

          console.log(`Toolchain policy OK: Node ${expectedNode}; pnpm ${expectedPnpm}; @types/node ${expectedNodeTypes}; Electron ${expectedElectron}.`);
          EOF

          node scripts/toolchain-policy.mjs

      - name: Regenerate lockfile with governed pnpm
        run: pnpm install --lockfile-only

      - name: Format governed files
        run: pnpm format

      - name: Validate regenerated lockfile and toolchain
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm toolchain:check
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:unit
          printf 'node=%s\npnpm=%s\nprettier=%s\neslint=%s\ntsc=%s\nplaywright=%s\nelectron=%s\n' \
            "$(node --version)" \
            "$(pnpm --version)" \
            "$(pnpm exec prettier --version)" \
            "$(pnpm exec eslint --version)" \
            "$(pnpm exec tsc --version)" \
            "$(pnpm exec playwright --version)" \
            "$(pnpm exec electron --version)"

      - name: Commit verified governance upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: upgrade and govern toolchain"
          git push origin HEAD:chore/toolchain-governance-20260810
