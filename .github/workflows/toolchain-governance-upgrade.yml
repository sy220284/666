name: Toolchain Governance Upgrade

on:
  push:
    branches:
      - chore/toolchain-governance-20260810

permissions:
  contents: write

concurrency:
  group: toolchain-governance-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/toolchain-governance-20260810
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1

      - name: Install governed pnpm runtime
        run: npm install --global pnpm@11.21.0

      - name: Install Electron display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xvfb

      - name: Apply and validate governance upgrade
        id: upgrade
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          node scripts/toolchain-governance-upgrade-runner.mjs 2>&1 | tee /tmp/toolchain-governance-validation.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/toolchain-governance-validation.log .toolchain-governance-failure.log
          fi
          exit "$status"

      - name: Commit verified governance upgrade
        if: ${{ success() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: upgrade and verify governed toolchain"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:chore/toolchain-governance-20260810

      - name: Persist failure evidence
        if: ${{ failure() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f .toolchain-governance-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .toolchain-governance-failure.log
          git commit -m "ci: record toolchain governance validation failure"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:chore/toolchain-governance-20260810
