name: Toolchain Governance Upgrade

on:
  push:
    branches:
      - chore/toolchain-governance-20260810

permissions:
  contents: write

concurrency:
  group: toolchain-governance-upgrade
  cancel-in-progress: true

jobs:
  writeback-smoke:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/toolchain-governance-20260810
          fetch-depth: 0
      - name: Prove governed runner writeback
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner-writeback-ok\n' > .toolchain-governance-runner-ok
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .toolchain-governance-runner-ok
          git commit -m "ci: verify toolchain governance runner writeback"
          git push origin HEAD:chore/toolchain-governance-20260810
