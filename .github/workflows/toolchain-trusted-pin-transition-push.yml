name: One-time Trusted Toolchain Pin Transition Push

# Re-trigger after this workflow exists in the parent commit.
on:
  push:
    branches: [work]

permissions:
  contents: read

concurrency:
  group: toolchain-trusted-pin-transition-push
  cancel-in-progress: false

jobs:
  transition:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply and validate final phase-one transition
        shell: bash
        run: |
          set -euo pipefail
          node scripts/toolchain-trusted-pin-transition.mjs
          pnpm exec prettier --write scripts/ci-policy.mjs scripts/workflow-structure-policy.mjs docs/process/TOOLCHAIN_UPGRADE_2026-08-10.md
          node scripts/ci-policy.mjs
          node scripts/workflow-structure-policy.mjs
          node scripts/toolchain-policy.mjs
          pnpm exec vitest run tests/unit/workflow-structure-policy.test.ts
      - name: Commit final phase-one transition and self-clean
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_ADMIN_TOKEN"
          git fetch origin work
          test "$(git rev-parse origin/work)" = "$(git rev-parse HEAD)"
          rm -f \
            .github/workflows/toolchain-trusted-pin-transition-push.yml \
            .github/workflows/toolchain-trusted-policy-writeback.yml \
            .github/workflows/toolchain-trusted-pin-transition-v2.yml \
            scripts/toolchain-trusted-pin-transition.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: complete trusted action pin phase one [skip ci]"
          git push "https://x-access-token:${REPO_ADMIN_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:work
