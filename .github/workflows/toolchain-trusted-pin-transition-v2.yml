name: One-time Trusted Toolchain Pin Transition V2

on:
  push:
    branches: [work]
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: toolchain-trusted-pin-transition-v2
  cancel-in-progress: false

jobs:
  transition:
    if: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Install governed pnpm runtime
        run: npm install --global pnpm@11.21.0
      - name: Restore workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply deterministic trusted pin transition
        run: node scripts/toolchain-trusted-pin-transition.mjs
      - name: Format and validate transition
        run: |
          pnpm exec prettier --write scripts/ci-policy.mjs scripts/workflow-structure-policy.mjs docs/process/TOOLCHAIN_UPGRADE_2026-08-10.md
          node scripts/ci-policy.mjs
          node scripts/workflow-structure-policy.mjs
          node scripts/toolchain-policy.mjs
          pnpm exec vitest run tests/unit/workflow-structure-policy.test.ts
      - name: Commit transition and self-clean
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_ADMIN_TOKEN"
          rm -f \
            .github/workflows/toolchain-trusted-pin-transition-v2.yml \
            scripts/toolchain-trusted-pin-transition.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: stage trusted action pin migration [skip ci]"
          git push "https://x-access-token:${REPO_ADMIN_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:work
