name: One-time Trusted Toolchain Policy Writeback

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: toolchain-trusted-policy-writeback
  cancel-in-progress: false

jobs:
  writeback:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare and validate policy transition
        shell: bash
        run: |
          set -euo pipefail
          node scripts/toolchain-trusted-pin-transition.mjs
          pnpm exec prettier --write scripts/ci-policy.mjs scripts/workflow-structure-policy.mjs docs/process/TOOLCHAIN_UPGRADE_2026-08-10.md
          node scripts/ci-policy.mjs
          node scripts/workflow-structure-policy.mjs
          node scripts/toolchain-policy.mjs
          pnpm exec vitest run tests/unit/workflow-structure-policy.test.ts
          git checkout HEAD -- .github/workflows
      - name: Write back validated policy files only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin work
          test "$(git rev-parse origin/work)" = "$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ci-policy.mjs scripts/workflow-structure-policy.mjs docs/process/TOOLCHAIN_UPGRADE_2026-08-10.md
          git commit -m "ci: stage trusted action pin policy migration [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:work
