name: One-time Toolchain Workflow Sync

on:
  push:
    branches:
      - chore/toolchain-governance-20260810

permissions:
  contents: read

concurrency:
  group: toolchain-workflow-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/toolchain-governance-20260810
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1

      - name: Apply verified permanent workflow replacements
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const dir = '.github/workflows';
          const oldPins = {
            checkout: 'd23441a48e516b6c34aea4fa41551a30e30af803',
            setupNode: '249970729cb0ef3589644e2896645e5dc5ba9c38',
            pnpmSetup: 'b906affcce14559ad1aafd4ab0e942779e9f58b1',
          };
          const pins = {
            checkout: 'de0fac2e4500dabe0009e67214ff5f5447ce83dd',
            setupNode: '48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e',
            pnpmSetup: '0ebf47130e4866e96fce0953f49152a61190b271',
          };
          for (const name of fs.readdirSync(dir)) {
            if (!/\.ya?ml$/u.test(name) || name === 'toolchain-workflow-sync.yml') continue;
            const file = path.join(dir, name);
            let content = fs.readFileSync(file, 'utf8');
            content = content
              .replaceAll(`actions/checkout@${oldPins.checkout} # v6`, `actions/checkout@${pins.checkout} # v6.0.2`)
              .replaceAll(`pnpm/action-setup@${oldPins.pnpmSetup} # v4`, `pnpm/action-setup@${pins.pnpmSetup} # v6.0.9`)
              .replaceAll(`actions/setup-node@${oldPins.setupNode} # v6`, `actions/setup-node@${pins.setupNode} # v6.4.0`)
              .replaceAll('node-version: 24\n', 'node-version: 24.18.1\n')
              .replace(/\n([ \t]+)with:\n\1  version: 11\.13\.1\n/gu, '\n');
            fs.writeFileSync(file, content);
          }
          NODE

      - name: Validate governed workflow state
        run: |
          node scripts/toolchain-policy.mjs
          node scripts/workflow-structure-policy.mjs
          node scripts/ci-policy.mjs

      - name: Commit synchronized workflows and remove one-time runner
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_ADMIN_TOKEN"
          rm .github/workflows/toolchain-workflow-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows
          git commit -m "ci: sync verified toolchain workflow pins [skip ci]"
          git push "https://x-access-token:${REPO_ADMIN_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:chore/toolchain-governance-20260810
