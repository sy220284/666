name: V1 Repackage Finalize
run-name: V1 repackage finalize ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: v1-repackage-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 1.0.0
  SOURCE_MAIN_SHA: 3448e5ae8ec0bdd2ce1f983141b0ba654957e2a9
  PACKAGE_RUN_ID: '30668456301'

jobs:
  checksums:
    name: Generate final repackage checksums
    if: ${{ github.head_ref == 'tooling/v1-repackage-latest-main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert source main remains unchanged
        shell: bash
        run: |
          git merge-base --is-ancestor "$SOURCE_MAIN_SHA" HEAD
          changed="$(git diff --name-only "$SOURCE_MAIN_SHA"...HEAD)"
          test "$changed" = ".github/workflows/v1-repackage.yml"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: worldforge-repack-1.0.0-*
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Generate SHA-256 manifest and source metadata
        shell: bash
        run: |
          : > release/SHA256SUMS.txt
          while IFS= read -r -d '' file; do
            hash="$(sha256sum "$file" | cut -d' ' -f1)"
            printf '%s  %s\n' "$hash" "${file#release/}" >> release/SHA256SUMS.txt
          done < <(find release -type f ! -name SHA256SUMS.txt ! -name REPACKAGE_INFO.txt -print0 | sort -z)
          test -s release/SHA256SUMS.txt
          cat > release/REPACKAGE_INFO.txt <<EOF
          WorldForge version: $RELEASE_VERSION
          Verified source main: $SOURCE_MAIN_SHA
          Package workflow run: $PACKAGE_RUN_ID
          Package workflow head: 633ebe571549dad34a25d05d9c30683bf8a77494
          Source PR: #${{ github.event.pull_request.number }}
          Existing immutable v1.0.0 Release: unchanged
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worldforge-repack-${{ env.RELEASE_VERSION }}-checksums
          path: |
            release/SHA256SUMS.txt
            release/REPACKAGE_INFO.txt
          if-no-files-found: error
          retention-days: 14

  cleanup:
    name: Remove one-time repackage workflow
    if: ${{ success() && github.head_ref == 'tooling/v1-repackage-latest-main' }}
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove temporary workflow from tooling branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/v1-repackage.yml
          git add .github/workflows/v1-repackage.yml
          git commit -m "工具：完成V1.0重新打包并清理临时工作流"
          git push
