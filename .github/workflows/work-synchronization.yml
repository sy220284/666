name: Work Synchronization

# Legacy trusted-policy bootstrap marker: - Main Verification
# Normal synchronization now runs directly inside Main Verification; this workflow is recovery-only.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact verified main commit SHA to synchronize work to
        required: true
        type: string
      source_pr:
        description: Merged work pull request number that produced the main commit
        required: true
        type: string
      source_head_sha:
        description: Exact source work head SHA that is safe to replace
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  statuses: read

concurrency:
  group: work-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - name: Self-test synchronization guards
        run: node .github/governance/work-synchronization.mjs self-test
      - name: Synchronize work to verified main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_SYNCHRONIZATION_OUTPUT: artifacts/work-synchronization
        run: node .github/governance/work-synchronization.mjs
      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: work-synchronization-${{ inputs.expected_sha }}
          path: artifacts/work-synchronization/
          if-no-files-found: error
          retention-days: 30
