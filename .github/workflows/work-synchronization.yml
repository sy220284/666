name: Work Synchronization

on:
  workflow_run:
    workflows:
      - Main Verification
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: work-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Self-test synchronization guards
        run: node .github/governance/work-synchronization.mjs self-test
      - name: Synchronize work to verified main
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_SYNCHRONIZATION_OUTPUT: artifacts/work-synchronization
        run: node .github/governance/work-synchronization.mjs
      - name: Upload synchronization report
        if: always() && github.event_name == 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: work-synchronization-${{ github.event.workflow_run.head_sha }}
          path: artifacts/work-synchronization/
          if-no-files-found: error
          retention-days: 30
