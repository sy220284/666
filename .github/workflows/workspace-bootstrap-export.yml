name: Temporary Workspace Bootstrap Export

on:
  push:
    branches:
      - governance
    paths:
      - .github/workflows/workspace-bootstrap-export.yml

permissions:
  contents: read

concurrency:
  group: temporary-workspace-bootstrap-export
  cancel-in-progress: true

env:
  BASELINE_SHA: cf0afba3eec33b47322089dd3c06ada77e69c75a

jobs:
  export:
    name: export-linux-x64-workspace-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Validate exact source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          node .github/governance/assert-clean-tree.mjs
      - name: Install complete workspace dependencies
        shell: bash
        env:
          STORE_DIR: ${{ runner.temp }}/worldforge-pnpm-store
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$STORE_DIR"
          node .github/governance/assert-clean-tree.mjs
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "11.21.0"
          node -p "require('./node_modules/electron/package.json').version"
          pnpm exec esbuild --version
          pnpm exec vitest --version
          pnpm exec playwright --version
      - name: Build source, dependency and Node runtime archives
        id: bundle
        shell: bash
        env:
          STORE_DIR: ${{ runner.temp }}/worldforge-pnpm-store
          OUTPUT_DIR: ${{ runner.temp }}/worldforge-workspace-bootstrap
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          metadata_dir='.worldforge-bootstrap-export'
          mkdir -p "$metadata_dir"
          pnpm list -r --depth -1 --json > "$metadata_dir/workspace-packages.json"
          find . -type d -name node_modules -prune -print | sort > "$metadata_dir/node-modules-paths.txt"
          git ls-files 'apps/**/package.json' 'packages/**/package.json' | sort > "$metadata_dir/workspace-manifests.txt"

          cat > "$metadata_dir/MANIFEST.json" <<EOF
          {
            "schemaVersion": 1,
            "repository": "sy220284/666",
            "baselineCommit": "$BASELINE_SHA",
            "platform": "linux",
            "architecture": "x64",
            "nodeVersion": "$(node --version)",
            "npmVersion": "$(npm --version)",
            "pnpmVersion": "$(pnpm --version)",
            "lockfileSha256": "$(sha256sum pnpm-lock.yaml | awk '{print $1}')",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          source_archive="worldforge-source-linux-x64-${BASELINE_SHA}.tar.zst"
          git archive --format=tar HEAD | zstd -T0 -3 -o "$OUTPUT_DIR/$source_archive"

          {
            printf '%s\n' package.json pnpm-lock.yaml pnpm-workspace.yaml
            cat "$metadata_dir/workspace-manifests.txt"
            cat "$metadata_dir/node-modules-paths.txt"
            printf '%s\n' "$metadata_dir"
          } | awk 'NF && !seen[$0]++' > "$metadata_dir/archive-paths.txt"
          dependency_archive="worldforge-workspace-dependencies-linux-x64-${BASELINE_SHA}.tar.zst"
          dependency_tar="$OUTPUT_DIR/worldforge-workspace-dependencies-linux-x64-${BASELINE_SHA}.tar"
          tar -cf "$dependency_tar" -C "$GITHUB_WORKSPACE" -T "$GITHUB_WORKSPACE/$metadata_dir/archive-paths.txt"
          tar -rf "$dependency_tar" -C "${RUNNER_TEMP}" worldforge-pnpm-store
          zstd -T0 -3 --rm "$dependency_tar" -o "$OUTPUT_DIR/$dependency_archive"

          node_bin="$(readlink -f "$(command -v node)")"
          node_root="$(dirname "$(dirname "$node_bin")")"
          runtime_root="${RUNNER_TEMP}/worldforge-runtime"
          mkdir -p "$runtime_root/runtime"
          cp -a "$node_root" "$runtime_root/runtime/node"
          node_archive="worldforge-node-v24.18.1-linux-x64-${BASELINE_SHA}.tar.zst"
          tar -C "$runtime_root" -cf - runtime | zstd -T0 -3 -o "$OUTPUT_DIR/$node_archive"

          cp "$metadata_dir/MANIFEST.json" "$OUTPUT_DIR/BOOTSTRAP_MANIFEST.json"
          (
            cd "$OUTPUT_DIR"
            sha256sum "$source_archive" "$dependency_archive" "$node_archive" > SHA256SUMS.txt
          )
          "$node_root/bin/node" --version
          node .github/governance/assert-clean-tree.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worldforge-workspace-bootstrap-Linux-X64-${{ env.BASELINE_SHA }}
          path: ${{ runner.temp }}/worldforge-workspace-bootstrap/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0
